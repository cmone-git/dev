<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="stylesheet" href="../../../../css/cm.css">
  <link rel="stylesheet" href="../../../../css/forms.css">
  <link rel="stylesheet" href="../../../../css/responsive.css">

  <script src="https://unpkg.com/lucide@latest"></script>

  <title>Universal Transactions — BIZODIT</title>

  <style>
    .id-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .id-box input {
      flex: 1;
    }

    .id-status {
      min-width: 24px;
      text-align: center;
      font-size: 14px;
    }

    /* Standard Toolbar */
    .list-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .list-search {
      flex: 1 1 160px;
      min-width: 140px;
      height: 38px;
      border: 1px solid #d7dce2;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 13px;
      outline: none;
      background: #fff;
      box-sizing: border-box;
      transition: border-color .15s;
    }

    .list-search:focus {
      border-color: #0b3b66;
    }

    .refresh-btn,
    .list-icon-btn,
    .form-view-action {
      width: 38px;
      height: 38px;
      border: 1px solid #d7dce2;
      background: #fff;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex: 0 0 auto;
      color: #4b5563;
      box-sizing: border-box;
    }

    .refresh-btn.spinning svg {
      animation: spin .8s linear infinite;
    }

    .list-icon-btn.active {
      background: #f1f4f7;
    }

    .add-form-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-width: 68px;
      height: 38px;
      padding: 0 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      box-sizing: border-box;
    }

    .date-range {
      display: flex;
      gap: 8px;
      align-items: end;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .date-range .field {
      flex: 1 1 140px;
      min-width: 130px;
      margin-bottom: 0;
    }

    .date-range .field label {
      display: block;
      margin-bottom: 5px;
    }

    .list-panel {
      display: block;
    }

    .list-panel.hidden,
    .entry-panel.hidden {
      display: none;
    }

    .data-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Card Item */
    .data-row {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
    }

    .data-row-main {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .data-row-content {
      min-width: 0;
      flex: 1;
      cursor: pointer;
    }

    .data-row-title {
      font-weight: 600;
      font-size: 14px;
      color: #1e293b;
    }

    .data-row-sub {
      margin-top: 3px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.4;
    }

    .data-row-meta {
      text-align: right;
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .data-row-date {
      font-size: 11px;
      color: #727983;
    }

    .trn-amount {
      font-size: 13px;
      font-weight: 600;
    }

    .trn-amount.inflow {
      color: #15803d;
    }

    .trn-amount.outflow {
      color: #b42318;
    }

    .trn-amount.neutral {
      color: #0b3b66;
    }

    .trn-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 500;
      background: #f8fafc;
      color: #475569;
      border: 1px solid #e2e8f0;
    }

    .trn-badge.payment { background: #fff1f1; color: #b42318; border-color: #f3c2c2; }
    .trn-badge.receipt { background: #f0fdf4; color: #166534; border-color: #dcfce7; }
    .trn-badge.contra { background: #eff6ff; color: #1e40af; border-color: #dbeafe; }
    .trn-badge.sales { background: #faf5ff; color: #7e22ce; border-color: #f3e8ff; }
    .trn-badge.purchase { background: #fffbeb; color: #b45309; border-color: #fef3c7; }
    .trn-badge.journal { background: #f1f5f9; color: #334155; border-color: #cbd5e1; }

    /* Card Action Toolbar */
    .trn-row-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px solid #f1f5f9;
    }

    .trn-action-btn {
      width: 30px;
      height: 30px;
      border: 1px solid #e2e8f0;
      background: #fafafa;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      text-decoration: none;
      cursor: pointer;
    }

    .trn-action-btn svg {
      width: 15px;
      height: 15px;
    }

    .trn-action-btn.call { color: #0b3b66; }
    .trn-action-btn.whatsapp { color: #15803d; }
    .trn-action-btn.open-btn { color: #334155; }

    /* Dynamic Balance Indicator under Inputs */
    .ledger-balance-hint {
      font-size: 11px;
      color: #0b3b66;
      font-weight: 500;
      margin-top: 3px;
      min-height: 16px;
    }

    /* Form Dynamic Type Container */
    .type-fields-group {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      background: #fafbfc;
      border: 1px solid #e2e8f0;
      padding: 12px;
      border-radius: 8px;
    }

    .type-fields-title {
      grid-column: 1 / -1;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 2px;
    }

    /* View / Edit Mode Form Actions */
    .form-view-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      width: auto;
      height: auto;
      border: 0;
      background: transparent;
      margin: -4px 0 10px;
    }

    .form-view-action.delete { color: #b42318; }
    .form-view-action.hidden { display: none; }

    .view-mode input:not([readonly]),
    .view-mode select,
    .view-mode textarea {
      background: #f7f8f9;
      color: #33404c;
      pointer-events: none;
    }

    .view-mode .form-actions { display: none; }

    .form-mode-label {
      display: none;
      margin: -7px 0 14px;
      font-size: 11px;
      color: #7b8791;
    }

    .view-mode .form-mode-label { display: block; }

    .empty-list {
      padding: 28px 12px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    .filter-panel {
      display: none;
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid #e0e3e7;
      border-radius: 10px;
      background: #fafbfc;
    }

    .filter-panel.show { display: block; }
    .filter-panel .field { margin-bottom: 8px; }

    .sort-menu {
      display: none;
      position: relative;
    }

    .sort-menu.show { display: block; margin-bottom: 10px; }

    .sort-options {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .sort-option {
      border: 1px solid #d7dce2;
      background: #fff;
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .sort-option.active {
      background: #eef2f5;
      font-weight: 600;
    }

    .form-message {
      display: none;
      margin: 0 0 14px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
    }

    .form-message.show { display: block; }
    .form-message.error { background: #fff1f1; color: #b42318; border: 1px solid #f3c2c2; }
    .form-message.success { background: #effaf3; color: #16723a; border: 1px solid #b9e4c7; }

    .saving .save-icon {
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<header class="cm-header">
  <div class="cm-header-inner">
    <div class="cm-header-left">
      <button class="menu-toggle" id="menuToggle" type="button">
        <i data-lucide="menu"></i>
      </button>

      <div class="cm-brand">
        <div class="cm-logo">BZ</div>
        <div class="cm-brand-title">BIZODIT</div>
      </div>
    </div>
  </div>
</header>

<main class="main">
  <div class="page">
    <div class="form-page">

      <section class="module-header">
        <div class="module-header-left">
          <button class="back-btn" id="pageBackBtn" type="button">
            <i data-lucide="arrow-left"></i>
          </button>

          <div class="module-title">
            <h1>Transactions</h1>
            <p>Unified voucher entry & multi-ledger journal accounting</p>
            <div class="report-as-on">
              Date : <strong id="presentDate">--</strong>
            </div>
          </div>
        </div>
      </section>

      <div id="trnListPanel" class="form-section list-panel">
        <div class="list-toolbar">
          <input id="trnSearch" class="list-search" type="search" placeholder="Search transactions..." autocomplete="off">
          <button id="trnSortBtn" class="list-icon-btn" type="button" title="Sort"><i data-lucide="arrow-up-down"></i></button>
          <button id="trnFilterBtn" class="list-icon-btn" type="button" title="Filter"><i data-lucide="list-filter"></i></button>
          <button id="trnRefreshBtn" class="refresh-btn" type="button" title="Refresh"><i data-lucide="refresh-cw"></i></button>
          <button id="exportTrnBtn" class="list-icon-btn" type="button" title="Export CSV"><i data-lucide="download"></i></button>
          <button id="importTrnBtn" class="list-icon-btn" type="button" title="Import CSV"><i data-lucide="upload"></i></button>
          <button id="downloadTemplateBtn" class="list-icon-btn" type="button" title="Download Template"><i data-lucide="file-spreadsheet"></i></button>
          <input type="file" id="csvFileInput" accept=".csv" style="display:none">
          <button id="addTrnBtn" class="btn btn-primary add-form-btn" type="button"><i data-lucide="plus"></i>Add</button>
        </div>

        <div id="trnSortMenu" class="sort-menu">
          <div class="sort-options">
            <button class="sort-option active" data-sort="date">Date (Newest)</button>
            <button class="sort-option" data-sort="date-asc">Date (Oldest)</button>
            <button class="sort-option" data-sort="id">Doc No (TRN-26-0001)</button>
            <button class="sort-option" data-sort="amount">Amount High–Low</button>
            <button class="sort-option" data-sort="type">Voucher Type</button>
          </div>
        </div>

        <div id="trnFilterPanel" class="filter-panel">
          <div class="field">
            <label>Voucher Type</label>
            <select id="trnTypeFilter">
              <option value="">All Voucher Types</option>
              <option value="Payment">Payment Voucher</option>
              <option value="Receipt">Receipt Voucher</option>
              <option value="Contra">Contra Voucher</option>
              <option value="Sales">Sales Voucher</option>
              <option value="Purchase">Purchase Voucher</option>
              <option value="Journal">Journal Voucher</option>
            </select>
          </div>
          <div class="date-range">
            <div class="field">
              <label>From Date</label>
              <input id="trnFromDate" type="date">
            </div>
            <div class="field">
              <label>To Date</label>
              <input id="trnToDate" type="date">
            </div>
          </div>
        </div>

        <div id="trnList" class="data-list"><div class="empty-list">Loading transactions...</div></div>
      </div>

      <form class="form-section entry-panel hidden" id="trnForm">
        <div class="form-view-actions">
          <button id="editTrnBtn" class="form-view-action" type="button" title="Edit transaction"><i data-lucide="pencil"></i></button>
          <button id="deleteTrnBtn" class="form-view-action delete" type="button" title="Delete transaction"><i data-lucide="trash-2"></i></button>
        </div>

        <h2 id="trnFormTitle">Transaction Entry</h2>
        <div id="formModeLabel" class="form-mode-label">View mode — tap Edit to modify this record.</div>
        <div id="formMessage" class="form-message"></div>
        <div id="sourceComplianceHint" class="form-message success" style="display:none"></div>

        <div class="form-grid">
          <!-- Document Header -->
          <div class="field">
            <label>Doc No.</label>
            <div class="id-box">
              <input id="trnDocNo" type="text" readonly placeholder="Generating (TRN-26-0001)...">
              <span id="idStatus" class="id-status"></span>
            </div>
          </div>

          <div class="field">
            <label>Transaction Date <span class="required">*</span></label>
            <input id="trnDate" type="date" required>
          </div>

          <div class="field">
            <label>Voucher Type <span class="required">*</span></label>
            <select id="voucherType" required>
              <option value="Payment">Payment (Outgoing Cash / Bank)</option>
              <option value="Receipt">Receipt (Incoming Cash / Bank)</option>
              <option value="Contra">Contra (Bank / Cash Internal Transfer)</option>
              <option value="Sales">Sales (Income / Client Invoicing)</option>
              <option value="Purchase">Purchase (Expense / Vendor Bill)</option>
              <option value="Journal">Journal (Adjustment / Non-Cash)</option>
            </select>
          </div>

          <div class="field">
            <label>Amount (₹) <span class="required">*</span></label>
            <input id="amount" type="number" min="0.01" step="0.01" required placeholder="0.00">
          </div>

          <!-- Dynamic Type Adaptive Container -->
          <div class="type-fields-group" id="typeSpecificSection">
            <div class="type-fields-title" id="typeGroupTitle"><i data-lucide="layers"></i> Voucher Account Allocation</div>

            <!-- Primary Debit / Target Ledger -->
            <div class="field" id="debitFieldBox">
              <label id="debitLabel">Debit Ledger (Dr) <span class="required">*</span></label>
              <select id="debitLedger" required>
                <option value="">Select Ledger...</option>
              </select>
              <div class="ledger-balance-hint" id="debitBalanceHint"></div>
            </div>

            <!-- Primary Credit / Source Ledger -->
            <div class="field" id="creditFieldBox">
              <label id="creditLabel">Credit Ledger (Cr) <span class="required">*</span></label>
              <select id="creditLedger" required>
                <option value="">Select Ledger...</option>
              </select>
              <div class="ledger-balance-hint" id="creditBalanceHint"></div>
            </div>

            <!-- Dynamic Bank/Cash Account Selector (Populated from Ledgers: Bank & Cash-in-Hand) -->
            <div class="field" id="bankCashFieldBox">
              <label id="bankCashLabel">Bank / Cash Account <span class="required">*</span></label>
              <select id="bankCashLedger">
                <option value="">Select Bank / Cash...</option>
              </select>
              <div class="ledger-balance-hint" id="bankCashBalanceHint"></div>
            </div>

            <!-- Payment Mode -->
            <div class="field" id="paymentModeBox">
              <label>Payment Mode <span class="required">*</span></label>
              <select id="paymentMode">
                <option value="Bank Transfer / NEFT / RTGS">Bank Transfer / NEFT / RTGS</option>
                <option value="UPI / QR">UPI / QR</option>
                <option value="Cash">Cash</option>
                <option value="Cheque">Cheque</option>
                <option value="Card">Card</option>
                <option value="Not Applicable">Not Applicable</option>
              </select>
            </div>

            <!-- Party / Client Selector (Optional link for CRM and WhatsApp) -->
            <div class="field" id="partyFieldBox">
              <label id="partyLabel">Party / Client Link</label>
              <input id="partySearchInput" type="text" list="partyList" placeholder="Search Client / Party (Optional)" autocomplete="off">
              <datalist id="partyList"></datalist>
            </div>

            <!-- Reference / Cheque No -->
            <div class="field" id="refFieldBox">
              <label>Cheque / UTR / Reference No.</label>
              <input id="referenceNo" type="text" placeholder="Cheque, UTR or Invoice Ref">
            </div>
          </div>

          <div class="field">
            <label>Created By</label>
            <input id="createdBy" type="text" value="Admin" placeholder="Created by">
          </div>

          <div class="field full">
            <label>Narration / Description <span class="required">*</span></label>
            <textarea id="narration" rows="2" required placeholder="Enter transaction remarks / particulars..."></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelFormBtn">Cancel</button>
          <button id="saveBtn" class="btn btn-primary" type="submit">
            <i class="save-icon" data-lucide="save"></i>
            <span class="save-text">Save Transaction</span>
          </button>
        </div>
      </form>

    </div>
  </div>
</main>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a class="bottom-item" href="../../../../index.html">
      <i data-lucide="house"></i>
      <span>HOME</span>
    </a>

    <a class="bottom-item" href="../../../crm/crm.html">
      <i data-lucide="users-round"></i>
      <span>CRM</span>
    </a>

    <a class="bottom-item active" href="../../accounts.html">
      <i data-lucide="wallet"></i>
      <span>ACCOUNTS</span>
    </a>

    <a class="bottom-item" href="../../../settings/settings.html">
      <i data-lucide="settings-2"></i>
      <span>SETTINGS</span>
    </a>
  </div>
</nav>

<script type="module">
  import { formatIndianDate, todayISO } from "../../../../js/date.js";
  import { db } from "../../../../js/firebase-config.js";
  import {
    doc,
    runTransaction,
    updateDoc,
    deleteDoc,
    collection,
    getDocs,
    getDoc,
    query,
    limit
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  const form = document.getElementById("trnForm");
  const saveBtn = document.getElementById("saveBtn");
  const message = document.getElementById("formMessage");
  const idInput = document.getElementById("trnDocNo");
  const idStatus = document.getElementById("idStatus");
  const trnDateInput = document.getElementById("trnDate");
  const voucherTypeSelect = document.getElementById("voucherType");

  const debitLedgerSelect = document.getElementById("debitLedger");
  const creditLedgerSelect = document.getElementById("creditLedger");
  const bankCashLedgerSelect = document.getElementById("bankCashLedger");
  const debitBalanceHint = document.getElementById("debitBalanceHint");
  const creditBalanceHint = document.getElementById("creditBalanceHint");
  const bankCashBalanceHint = document.getElementById("bankCashBalanceHint");

  const partySearchInput = document.getElementById("partySearchInput");
  const partyList = document.getElementById("partyList");

  const editTrnBtn = document.getElementById("editTrnBtn");
  const deleteTrnBtn = document.getElementById("deleteTrnBtn");
  const cancelFormBtn = document.getElementById("cancelFormBtn");

  const CACHE_TRN = "bizodit_transactions_cache_v1";
  const CACHE_LEDGER = "bizodit_ledgers_cache_v1";
  const CACHE_CLIENTS = "bizodit_clients_cache_v3";

  let transactions = [];
  let ledgersCache = [];
  let clientsCache = [];
  let currentId = null;
  let mode = "new"; // "new", "view", "edit"
  let trnSort = "date";
  const pageParams = new URLSearchParams(window.location.search);
  const queryLedgerId = clean(pageParams.get("ledger"));
  const queryComplianceId = clean(pageParams.get("compliance"));

  document.getElementById("presentDate").textContent = formatIndianDate(new Date());
  trnDateInput.value = todayISO();

  const clean = value => String(value || "").trim();
  const upper = value => clean(value).toUpperCase();

  const showMessage = (text, type = "error") => {
    message.textContent = text;
    message.className = `form-message show ${type}`;
  };

  const clearMessage = () => {
    message.textContent = "";
    message.className = "form-message";
  };

  function formatRupees(num) {
    return new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR" }).format(num || 0);
  }

  function whatsappClean(n) {
    let x = String(n || "").replace(/\D/g, "");
    if (x.length === 10) x = "91" + x;
    if (x.length === 11 && x.startsWith("0")) x = "91" + x.slice(1);
    return x;
  }

  /* Load Ledgers & Populate Dropdowns with Opening Balances */
  async function loadLedgers() {
    try {
      const cached = JSON.parse(localStorage.getItem(CACHE_LEDGER) || "[]");
      if (Array.isArray(cached) && cached.length) {
        ledgersCache = cached;
        populateLedgerDropdowns();
      }
    } catch (e) { console.warn(e); }

    try {
      const snapshot = await getDocs(query(collection(db, "ledgers"), limit(500)));
      ledgersCache = snapshot.docs.map(item => ({ id: item.id, ...item.data() }));
      localStorage.setItem(CACHE_LEDGER, JSON.stringify(ledgersCache));
      populateLedgerDropdowns();
    } catch (e) {
      console.error("Ledger fetch error", e);
    }
  }

  function getLedgerBalText(ledger) {
    if (!ledger) return "";
    const bal = Number(ledger.openingBalance) || 0;
    const type = ledger.balanceType || "Dr";
    return `Opening: ${formatRupees(bal)} ${type}`;
  }

  function populateLedgerDropdowns() {
    const allOptions = [`<option value="">Select Ledger...</option>`];
    const bankCashOptions = [`<option value="">Select Bank / Cash Account...</option>`];

    ledgersCache.forEach(l => {
      const name = l.ledgerName || l.id;
      const cat = l.category || "General";
      const bal = Number(l.openingBalance) || 0;
      const balType = l.balanceType || "Dr";
      const optStr = `<option value="${escapeHtml(name)}" data-id="${escapeHtml(l.ledgerId||l.id)}" data-cat="${escapeHtml(cat)}" data-bal="${bal}" data-type="${balType}">${escapeHtml(name)} (${escapeHtml(cat)}) [${formatRupees(bal)} ${balType}]</option>`;

      allOptions.push(optStr);

      if (cat === "Bank Accounts" || cat === "Cash-in-Hand") {
        bankCashOptions.push(optStr);
      }
    });

    debitLedgerSelect.innerHTML = allOptions.join("");
    creditLedgerSelect.innerHTML = allOptions.join("");
    bankCashLedgerSelect.innerHTML = bankCashOptions.join("");
    filterLedgerOptionsForVoucher(voucherTypeSelect.value || "Payment");
  }

  function updateBalanceDisplay(selectEl, hintEl) {
    const selOpt = selectEl.options[selectEl.selectedIndex];
    if (!selOpt || !selOpt.value) {
      hintEl.textContent = "";
      return;
    }
    const bal = Number(selOpt.dataset.bal) || 0;
    const type = selOpt.dataset.type || "Dr";
    const cat = selOpt.dataset.cat || "";
    hintEl.textContent = `Current Bal: ${formatRupees(bal)} ${type} • Category: ${cat}`;
  }

  function filterLedgerOptionsForVoucher(type) {
    const all = Array.isArray(ledgersCache) ? ledgersCache : [];
    let debit = all;
    let credit = all;
    if (type === "Sales") {
      debit = all.filter(l => l.category === "Sundry Debtors (Customers)");
      credit = all.filter(l => l.category === "Sales");
    } else if (type === "Purchase") {
      debit = all.filter(l => ["Direct Expenses","Indirect Expenses","Purchase"].includes(l.category));
      credit = all.filter(l => l.category === "Sundry Creditors (Suppliers)");
    } else if (type === "Receipt") {
      credit = all; debit = all.filter(l => l.category === "Bank Accounts" || l.category === "Cash-in-Hand" || l.category === "Sundry Debtors (Customers)");
    } else if (type === "Payment") {
      credit = all.filter(l => l.category === "Bank Accounts" || l.category === "Cash-in-Hand" || l.category === "Sundry Creditors (Suppliers)");
    }
    const currentDr = debitLedgerSelect.value;
    const currentCr = creditLedgerSelect.value;
    const makeOptions = (arr, placeholder) => '<option value="">'+placeholder+'</option>' + arr.map(l => {
      const name = l.ledgerName || l.id; const cat = l.category || "General"; const bal=Number(l.openingBalance)||0; const bt=l.balanceType||"Dr";
      return `<option value="${escapeHtml(name)}" data-id="${escapeHtml(l.ledgerId||l.id)}" data-cat="${escapeHtml(cat)}" data-bal="${bal}" data-type="${escapeHtml(bt)}">${escapeHtml(name)} (${escapeHtml(cat)}) [${formatRupees(bal)} ${escapeHtml(bt)}]</option>`;
    }).join('');
    debitLedgerSelect.innerHTML = makeOptions(debit,'Select Debit Ledger...');
    creditLedgerSelect.innerHTML = makeOptions(credit,'Select Credit Ledger...');
    if ([...debitLedgerSelect.options].some(o=>o.value===currentDr)) debitLedgerSelect.value=currentDr;
    if ([...creditLedgerSelect.options].some(o=>o.value===currentCr)) creditLedgerSelect.value=currentCr;
    updateBalanceDisplay(debitLedgerSelect, debitBalanceHint);
    updateBalanceDisplay(creditLedgerSelect, creditBalanceHint);
  }

  /* Auto Doc ID: TRN-26-0001 (counters/transaction_YY) */
  async function getNextTransactionId(transaction, dateString) {
    const yr = String(new Date(dateString || new Date()).getFullYear()).slice(-2);
    const counterRef = doc(db, "counters", `transaction_${yr}`);
    const counterSnap = await transaction.get(counterRef);
    let nextNumber = 1;

    if (counterSnap.exists()) {
      const lastNumber = Number(counterSnap.data().lastNumber);
      if (Number.isFinite(lastNumber) && lastNumber >= 0) nextNumber = lastNumber + 1;
    }

    while (true) {
      const candidateId = `TRN-${yr}-${String(nextNumber).padStart(4, "0")}`;
      const candidateRef = doc(db, "transactions", candidateId);
      const candidateSnap = await transaction.get(candidateRef);

      if (!candidateSnap.exists()) {
        return { id: candidateId, counterRef, nextNumber, yr };
      }
      nextNumber++;
    }
  }

  function renderTransactionList() {
    const term = clean(trnSearch.value).toLowerCase();
    const typeVal = clean(trnTypeFilter.value);

    let rows = transactions.filter(row => {
      const docNo = row.trnDocNo || row.id || "";
      const text = `${docNo} ${row.voucherType || ""} ${row.debitLedger || ""} ${row.creditLedger || ""} ${row.partyName || ""} ${row.narration || ""}`.toLowerCase();
      const dDate = String(row.trnDate || "").slice(0, 10);
      const matchesFrom = !trnFromDate.value || (dDate && dDate >= trnFromDate.value);
      const matchesTo = !trnToDate.value || (dDate && dDate <= trnToDate.value);

      return (!term || text.includes(term)) && (!typeVal || row.voucherType === typeVal) && matchesFrom && matchesTo;
    });

    rows.sort((a, b) => {
      if (trnSort === "date") return String(b.trnDate || "").localeCompare(String(a.trnDate || ""));
      if (trnSort === "date-asc") return String(a.trnDate || "").localeCompare(String(b.trnDate || ""));
      if (trnSort === "id") return String(b.trnDocNo || b.id || "").localeCompare(String(a.trnDocNo || a.id || ""), undefined, { numeric: true });
      if (trnSort === "amount") return (Number(b.amount) || 0) - (Number(a.amount) || 0);
      if (trnSort === "type") return String(a.voucherType || "").localeCompare(String(b.voucherType || ""));
      return 0;
    });

    if (!rows.length) {
      trnList.innerHTML = '<div class="empty-list">No transactions found.</div>';
      return;
    }

    trnList.innerHTML = rows.map(row => {
      const id = String(row.trnDocNo || row.id);
      const type = row.voucherType || "Payment";
      const dr = row.debitLedger || "Debit";
      const cr = row.creditLedger || "Credit";
      const amt = formatRupees(row.amount);
      const amtClass = type === "Receipt" ? "inflow" : (type === "Payment" ? "outflow" : "neutral");

      // Extract client phone if linked
      let phone = "";
      if (row.partyName) {
        const cl = clientsCache.find(x => row.partyName.includes(x.clientName) || (x.clientId && row.partyName.includes(x.clientId)));
        if (cl) phone = clean(cl.mobile);
      }

      return `
      <div class="data-row">
        <div class="data-row-main">
          <div class="data-row-content" data-open="${escapeHtml(id)}">
            <div class="data-row-title">${escapeHtml(dr)} <span style="color:#94a3b8; font-weight:400;">/</span> ${escapeHtml(cr)}</div>
            <div class="data-row-sub">${escapeHtml(id)} ${row.partyName ? `· ${escapeHtml(row.partyName)}` : ''} ${row.referenceNo ? `· Ref: ${escapeHtml(row.referenceNo)}` : ''}</div>
          </div>
          <div class="data-row-meta">
            <span class="data-row-date">${escapeHtml(row.trnDate || "")}</span>
            <span class="trn-amount ${amtClass}">${escapeHtml(amt)}</span>
            <span class="trn-badge ${type.toLowerCase()}">${escapeHtml(type)}</span>
          </div>
        </div>
        <div class="trn-row-actions">
          ${phone ? `<a class="trn-action-btn call" href="tel:${escapeHtml(phone)}" title="Call Party"><i data-lucide="phone"></i></a>` : ""}
          ${phone ? `<a class="trn-action-btn whatsapp" href="https://wa.me/${escapeHtml(whatsappClean(phone))}" target="_blank" rel="noopener" title="WhatsApp"><i data-lucide="message-circle"></i></a>` : ""}
          <button class="trn-action-btn open-btn" data-open="${escapeHtml(id)}" type="button" title="View Voucher"><i data-lucide="arrow-up-right"></i></button>
        </div>

  /* CSV Download/Export/Import Utilities */
  function downloadBlob(content, filename, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

    const rows = transactions.map(c => [

      `"${c.amount||0}"`, `"${(c.debitLedger||"").replace(/"/g,'""')}"`, `"${(c.creditLedger||"").replace(/"/g,'""')}"`,

    ]);
    const csv = [headers.join(","), ...rows.map(r => r.join(","))].join("\n");

  document.getElementById("importTrnBtn").addEventListener("click", () => document.getElementById("csvFileInput").click());

  document.getElementById("csvFileInput").addEventListener("change", async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const text = await file.text();
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (lines.length < 2) { alert("CSV file has no data rows."); return; }

    const parseRow = row => {
      const res = []; let inQ = false, val = "";
      for (let i = 0; i < row.length; i++) {
        const c = row[i];
        if (c === '"') { if (inQ && row[i+1] === '"') { val += '"'; i++; } else inQ = !inQ; }
        else if (c === ',' && !inQ) { res.push(val.trim()); val = ""; }
        else val += c;
      }
      res.push(val.trim());
      return res;
    };

    const rows = lines.slice(1).map(parseRow);
    if (!confirm(`Import ${rows.length} transaction record(s)?`)) { e.target.value = ""; return; }

    trnRefreshBtn.classList.add("spinning");
    try {
      let imported = 0;
      const now = new Date().toISOString();
      for (const r of rows) {
        const vDate = clean(r[0]) || todayISO();
        const vType = clean(r[1]) || "Payment";
        const amt = Number(r[2]) || 0;
        const dr = clean(r[3]);
        const cr = clean(r[4]);
        if (!amt || !dr || !cr) continue;

        await runTransaction(db, async tx => {
          const result = await getNextTransactionId(tx, vDate);
          const trnRef = doc(db, "transactions", result.id);
          const record = {
            trnDocNo: result.id,
            trnDate: vDate,
            voucherType: vType,
            amount: amt,
            debitLedger: dr,
            creditLedger: cr,
            paymentMode: clean(r[5]) || "Bank Transfer / NEFT / RTGS",
            partyName: clean(r[6]),
            referenceNo: clean(r[7]),
            createdBy: clean(r[8]) || "Admin",
            narration: clean(r[9]) || "",
            createdAt: now,
            updatedAt: now
          };
          tx.set(result.counterRef, { lastNumber: result.nextNumber, updatedAt: now }, { merge: true });
          tx.set(trnRef, record);
        });
        imported++;
      }
      localStorage.removeItem(CACHE_TRN);
      await loadTransactionList();
      alert(`Successfully imported ${imported} transaction(s).`);
    } catch (err) {
      console.error(err);
      alert("Error during transaction import: " + err.message);
    } finally {
      trnRefreshBtn.classList.remove("spinning");
      e.target.value = "";
    }
  });

    if (!confirm(`Delete transaction (${currentId})?\n\nThis action cannot be undone.`)) return;
    deleteTrnBtn.disabled = true;
    try {
      await deleteDoc(doc(db, "transactions", currentId));
      transactions = transactions.filter(x => String(x.trnDocNo || x.id) !== String(currentId));
      localStorage.setItem(CACHE_TRN, JSON.stringify(transactions));
      showMessage("Transaction deleted successfully.", "success");
      setTimeout(openList, 450);
    } catch (e) {
      showMessage(e.message || "Unable to delete transaction.");
    } finally {
      deleteTrnBtn.disabled = false;
    }
  });

  trnSearch.addEventListener("input", renderTransactionList);
  trnTypeFilter.addEventListener("change", renderTransactionList);
  trnFromDate.addEventListener("change", renderTransactionList);
  trnToDate.addEventListener("change", renderTransactionList);

  trnRefreshBtn.addEventListener("click", async () => {
    trnRefreshBtn.classList.add("spinning");
    try {
      localStorage.removeItem(CACHE_TRN);
      await loadTransactionList();
    } finally {
      trnRefreshBtn.classList.remove("spinning");
    }
  });

  trnSortBtn.addEventListener("click", () => trnSortMenu.classList.toggle("show"));
  trnFilterBtn.addEventListener("click", () => trnFilterPanel.classList.toggle("show"));

  trnSortMenu.querySelectorAll(".sort-option").forEach(option => {
    option.addEventListener("click", () => {
      trnSort = option.dataset.sort;
      trnSortMenu.querySelectorAll(".sort-option").forEach(x => x.classList.remove("active"));
      option.classList.add("active");
      trnSortMenu.classList.remove("show");
      renderTransactionList();
    });
  });

  document.getElementById("pageBackBtn").addEventListener("click", () => {
    if (!form.classList.contains("hidden")) {
      openList();
    } else {
      history.back();
    }
  });

  /* Create Transaction via Atomic Transaction */
  async function createTransaction() {
    const d = formData();
    if (!d.trnDate) { showMessage("Transaction Date is required."); trnDateInput.focus(); return; }
    if (!d.amount || d.amount <= 0) { showMessage("Enter a valid amount greater than 0."); document.getElementById("amount").focus(); return; }
    if (!d.debitLedger) { showMessage("Debit Ledger is required."); debitLedgerSelect.focus(); return; }
    if (!d.creditLedger) { showMessage("Credit Ledger is required."); creditLedgerSelect.focus(); return; }
    if (d.debitLedger.toLowerCase() === d.creditLedger.toLowerCase()) {
      showMessage("Debit and Credit ledgers cannot be identical.");
      creditLedgerSelect.focus();
      return;
    }
    if (!d.narration) { showMessage("Narration is required."); document.getElementById("narration").focus(); return; }

    saveBtn.disabled = true;
    form.classList.add("saving");
    saveBtn.querySelector(".save-text").textContent = "Saving...";
    idStatus.textContent = "…";

    try {
      const now = new Date().toISOString();
      let generatedId = "";

      await runTransaction(db, async (transaction) => {
        const result = await getNextTransactionId(transaction, d.trnDate);
        generatedId = result.id;
        const trnRef = doc(db, "transactions", generatedId);
        const data = {
          ...d,
          trnDocNo: generatedId,
          createdAt: now,
          updatedAt: now
        };
        transaction.set(result.counterRef, { lastNumber: result.nextNumber, updatedAt: now }, { merge: true });
        transaction.set(trnRef, data);
      });

      idInput.value = generatedId;
      idStatus.textContent = "✓";
      showMessage(`Transaction ${generatedId} saved successfully.`, "success");
      localStorage.removeItem(CACHE_TRN);

      setTimeout(() => {
        openList();
        loadTransactionList();
      }, 450);
    } catch (error) {
      console.error("Transaction save error:", error);
      idStatus.textContent = "";
      showMessage(error?.message || "Unable to save transaction. Please try again.");
    } finally {
      saveBtn.disabled = false;
      form.classList.remove("saving");
      saveBtn.querySelector(".save-text").textContent = "Save Transaction";
    }
  }

  /* Update Transaction without duplicating */
  async function updateTransaction() {
    if (!currentId) return;
    const d = formData();
    if (!d.amount || d.amount <= 0 || !d.debitLedger || !d.creditLedger) {
      showMessage("Amount, Debit Ledger, and Credit Ledger are required.");
      return;
    }
    if (d.debitLedger.toLowerCase() === d.creditLedger.toLowerCase()) {
      showMessage("Debit and Credit ledgers cannot be identical.");
      return;
    }

    saveBtn.disabled = true;
    form.classList.add("saving");
    saveBtn.querySelector(".save-text").textContent = "Updating...";

    try {
      const now = new Date().toISOString();
      await updateDoc(doc(db, "transactions", currentId), {
        trnDate: d.trnDate,
        voucherType: d.voucherType,
        amount: d.amount,
        debitLedger: d.debitLedger,
        creditLedger: d.creditLedger,
        bankCashLedger: d.bankCashLedger,
        paymentMode: d.paymentMode,
        partyName: d.partyName,
        referenceNo: d.referenceNo,
        createdBy: d.createdBy,
        narration: d.narration,
        updatedAt: now
      });

      const idx = transactions.findIndex(c => String(c.trnDocNo || c.id) === String(currentId));
      if (idx >= 0) {
        transactions[idx] = { ...transactions[idx], ...d, trnDocNo: currentId, updatedAt: now };
        localStorage.setItem(CACHE_TRN, JSON.stringify(transactions));
      }

      showMessage("Transaction updated successfully.", "success");
      setTimeout(() => {
        openList();
      }, 450);
    } catch (error) {
      console.error("Transaction update error:", error);
      showMessage(error?.message || "Unable to update transaction.");
    } finally {
      saveBtn.disabled = false;
      form.classList.remove("saving");
      saveBtn.querySelector(".save-text").textContent = "Save Transaction";
    }
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    clearMessage();
    if (saveBtn.disabled) return;

    if (mode === "edit") {
      await updateTransaction();
    } else {
      await createTransaction();
    }
  });

  document.getElementById("menuToggle")?.addEventListener("click", () => document.body.classList.toggle("sidebar-open"));

  window.lucide?.createIcons();
  loadLedgers().then(() => loadClients()).then(() => loadTransactionList()).then(() => {
    if (queryComplianceId) return applyComplianceQuery();
    return applyQueryLedger();
  });
</script>

</body>
