<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="stylesheet" href="../../../../css/cm.css">
  <link rel="stylesheet" href="../../../../css/forms.css">
  <link rel="stylesheet" href="../../../../css/responsive.css">

  <script src="https://unpkg.com/lucide@latest"></script>

  <title>Credentials — BIZODIT</title>

  <style>
    .id-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .id-box input {
      flex: 1;
    }

    .id-status {
      min-width: 24px;
      text-align: center;
      font-size: 14px;
    }

    /* Toolbar matching compliance & clients */
    .list-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .list-search {
      flex: 1 1 160px;
      min-width: 140px;
      height: 38px;
      border: 1px solid #d7dce2;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 13px;
      outline: none;
      background: #fff;
      box-sizing: border-box;
      transition: border-color .15s;
    }

    .list-search:focus {
      border-color: #0b3b66;
    }

    .refresh-btn,
    .list-icon-btn,
    .form-view-action {
      width: 38px;
      height: 38px;
      border: 1px solid #d7dce2;
      background: #fff;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex: 0 0 auto;
      color: #4b5563;
      box-sizing: border-box;
    }

    .refresh-btn.spinning svg {
      animation: spin .8s linear infinite;
    }

    .list-icon-btn.active {
      background: #f1f4f7;
    }

    .add-form-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-width: 68px;
      height: 38px;
      padding: 0 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      box-sizing: border-box;
    }

    .list-panel {
      display: block;
    }

    .list-panel.hidden,
    .entry-panel.hidden {
      display: none;
    }

    .data-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Card Item */
    .data-row {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
    }

    .data-row-main {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .data-row-content {
      min-width: 0;
      flex: 1;
      cursor: pointer;
    }

    .data-row-title {
      font-weight: 600;
      font-size: 14px;
      color: #1e293b;
    }

    .data-row-sub {
      margin-top: 3px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.4;
    }

    .data-row-meta {
      text-align: right;
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    /* Badges */
    .portal-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 500;
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #dbeafe;
    }

    /* Action Toolbar in Cards */
    .credential-row-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px solid #f1f5f9;
    }

    .credential-action-btn {
      width: 30px;
      height: 30px;
      border: 1px solid #e2e8f0;
      background: #fafafa;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      text-decoration: none;
      cursor: pointer;
    }

    .credential-action-btn svg {
      width: 15px;
      height: 15px;
    }

    .credential-action-btn.call {
      color: #0b3b66;
    }

    .credential-action-btn.whatsapp {
      color: #15803d;
    }

    .credential-action-btn.open-btn {
      color: #334155;
    }

    .input-with-action {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .input-with-action input {
      flex: 1;
    }

    .form-view-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      width: auto;
      height: auto;
      border: 0;
      background: transparent;
      margin: -4px 0 10px;
    }

    .form-view-action.delete {
      color: #b42318;
    }

    .form-view-action.hidden {
      display: none;
    }

    .view-mode input:not([readonly]),
    .view-mode select,
    .view-mode textarea {
      background: #f7f8f9;
      color: #33404c;
      pointer-events: none;
    }

    .view-mode .form-actions {
      display: none;
    }

    .form-mode-label {
      display: none;
      margin: -7px 0 14px;
      font-size: 11px;
      color: #7b8791;
    }

    .view-mode .form-mode-label {
      display: block;
    }

    .empty-list {
      padding: 28px 12px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    .filter-panel {
      display: none;
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid #e0e3e7;
      border-radius: 10px;
      background: #fafbfc;
    }

    .filter-panel.show {
      display: block;
    }

    .filter-panel .field {
      margin-bottom: 8px;
    }

    .sort-menu {
      display: none;
      position: relative;
    }

    .sort-menu.show {
      display: block;
      margin-bottom: 10px;
    }

    .sort-options {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .sort-option {
      border: 1px solid #d7dce2;
      background: #fff;
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .sort-option.active {
      background: #eef2f5;
      font-weight: 600;
    }

    .form-message {
      display: none;
      margin: 0 0 14px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
    }

    .form-message.show {
      display: block;
    }

    .form-message.error {
      background: #fff1f1;
      color: #b42318;
      border: 1px solid #f3c2c2;
    }

    .form-message.success {
      background: #effaf3;
      color: #16723a;
      border: 1px solid #b9e4c7;
    }

    .client-loading {
      opacity: .65;
    }

    .saving .save-icon {
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<header class="cm-header">
  <div class="cm-header-inner">
    <div class="cm-header-left">
      <button class="menu-toggle" id="menuToggle" type="button">
        <i data-lucide="menu"></i>
      </button>

      <div class="cm-brand">
        <div class="cm-logo">BZ</div>
        <div class="cm-brand-title">BIZODIT</div>
      </div>
    </div>
  </div>
</header>

<main class="main">
  <div class="page">
    <div class="form-page">

      <section class="module-header">
        <div class="module-header-left">
          <button class="back-btn" id="pageBackBtn" type="button">
            <i data-lucide="arrow-left"></i>
          </button>

          <div class="module-title">
            <h1>Credentials</h1>
            <p>Track client login & portal credentials</p>
            <div class="report-as-on">
              Date : <strong id="presentDate">--</strong>
            </div>
          </div>
        </div>
      </section>

      <div id="credentialListPanel" class="form-section list-panel">
        <div class="list-toolbar">
          <input id="credentialSearch" class="list-search" type="search" placeholder="Search credentials..." autocomplete="off">
          <button id="credentialSortBtn" class="list-icon-btn" type="button" title="Sort"><i data-lucide="arrow-up-down"></i></button>
          <button id="credentialFilterBtn" class="list-icon-btn" type="button" title="Filter"><i data-lucide="list-filter"></i></button>
          <button id="credentialRefreshBtn" class="refresh-btn" type="button" title="Refresh"><i data-lucide="refresh-cw"></i></button>
          <button id="exportCredentialBtn" class="list-icon-btn" type="button" title="Export CSV"><i data-lucide="download"></i></button>
          <button id="importCredentialBtn" class="list-icon-btn" type="button" title="Import CSV"><i data-lucide="upload"></i></button>
          <button id="downloadTemplateBtn" class="list-icon-btn" type="button" title="Download Template"><i data-lucide="file-spreadsheet"></i></button>
          <input type="file" id="csvFileInput" accept=".csv" style="display:none">
          <button id="addCredentialBtn" class="btn btn-primary add-form-btn" type="button"><i data-lucide="plus"></i>Add</button>
        </div>

        <div id="credentialSortMenu" class="sort-menu">
          <div class="sort-options">
            <button class="sort-option active" data-sort="id">ID (CR-0001)</button>
            <button class="sort-option" data-sort="client">Client Name</button>
            <button class="sort-option" data-sort="portal">Portal Name</button>
            <button class="sort-option" data-sort="newest">Newest</button>
          </div>
        </div>

        <div id="credentialFilterPanel" class="filter-panel">
          <div class="field">
            <label>Portal</label>
            <select id="credentialPortalFilter">
              <option value="">All Portals</option>
              <option value="GST">GST</option>
              <option value="Income Tax">Income Tax</option>
              <option value="MCA">MCA</option>
              <option value="TRACES">TRACES</option>
              <option value="EPFO">EPFO</option>
              <option value="ESIC">ESIC</option>
              <option value="Tally">Tally</option>
              <option value="Bank">Bank</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div id="credentialList" class="data-list"><div class="empty-list">Loading credentials...</div></div>
      </div>

      <form class="form-section entry-panel hidden" id="credentialForm">
        <div class="form-view-actions">
          <button id="editCredentialBtn" class="form-view-action" type="button" title="Edit credential"><i data-lucide="pencil"></i></button>
          <button id="deleteCredentialBtn" class="form-view-action delete" type="button" title="Delete credential"><i data-lucide="trash-2"></i></button>
        </div>

        <h2 id="credentialFormTitle">Credential Entry</h2>
        <div id="formModeLabel" class="form-mode-label">View mode — tap Edit to modify this credential.</div>
        <div id="formMessage" class="form-message"></div>

        <div class="form-grid">
          <div class="field">
            <label>Credential ID</label>
            <div class="id-box">
              <input id="credentialID" type="text" readonly placeholder="Generating on save (CR-0001)...">
              <span id="idStatus" class="id-status"></span>
            </div>
          </div>

          <div class="field">
            <label>Client ID <span class="required">*</span></label>
            <input id="clientId" type="text" required list="clientIdList" placeholder="Search / select Client ID" autocomplete="off" style="text-transform:uppercase">
            <datalist id="clientIdList"></datalist>
          </div>

          <div class="field">
            <label>Client Name <span class="required">*</span></label>
            <input id="clientName" type="text" required list="clientNameList" placeholder="Search / select Client Name" autocomplete="off">
            <datalist id="clientNameList"></datalist>
          </div>

          <div class="field">
            <label>Portal Name <span class="required">*</span></label>
            <input id="portalName" type="text" required placeholder="e.g. GST, Income Tax, MCA" list="portalSuggestions">
            <datalist id="portalSuggestions">
              <option value="GST">
              <option value="Income Tax">
              <option value="MCA">
              <option value="TRACES">
              <option value="EPFO">
              <option value="ESIC">
            </datalist>
          </div>

          <div class="field">
            <label>Portal / Registration No.</label>
            <div class="input-with-action">
              <input id="portalNo" type="text" placeholder="GSTIN / PAN / Registration No.">
              <button class="list-icon-btn" type="button" data-copy-target="portalNo" title="Copy Registration No."><i data-lucide="copy"></i></button>
            </div>
          </div>

          <div class="field">
            <label>User Name / Login ID <span class="required">*</span></label>
            <div class="input-with-action">
              <input id="userName" type="text" required placeholder="Enter username / ID" autocomplete="off">
              <button class="list-icon-btn" type="button" data-copy-target="userName" title="Copy User Name"><i data-lucide="copy"></i></button>
            </div>
          </div>

          <div class="field">
            <label>Password <span class="required">*</span></label>
            <div class="input-with-action">
              <input id="password" type="password" required placeholder="Enter password" autocomplete="new-password">
              <button id="togglePasswordBtn" class="list-icon-btn" type="button" title="Show/Hide Password"><i data-lucide="eye"></i></button>
              <button class="list-icon-btn" type="button" data-copy-target="password" title="Copy Password"><i data-lucide="copy"></i></button>
            </div>
          </div>

          <div class="field">
            <label>Created By</label>
            <input id="createdBy" type="text" value="Admin" placeholder="Created by">
          </div>

          <div class="field full">
            <label>Narration</label>
            <textarea id="narration" rows="3" placeholder="Additional details, recovery email/phone, security notes..."></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelFormBtn">Cancel</button>
          <button id="saveBtn" class="btn btn-primary" type="submit">
            <i class="save-icon" data-lucide="save"></i>
            <span class="save-text">Save Credential</span>
          </button>
        </div>
      </form>

    </div>
  </div>
</main>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a class="bottom-item" href="../../../../index.html">
      <i data-lucide="house"></i>
      <span>HOME</span>
    </a>

    <a class="bottom-item" href="../../crm.html">
      <i data-lucide="users-round"></i>
      <span>CRM</span>
    </a>

    <a class="bottom-item" href="../../../accounts/accounts.html">
      <i data-lucide="wallet"></i>
      <span>ACCOUNTS</span>
    </a>

    <a class="bottom-item" href="../../../settings/settings.html">
      <i data-lucide="settings-2"></i>
      <span>SETTINGS</span>
    </a>
  </div>
</nav>

<script type="module">
  import { formatIndianDate } from "../../../../js/date.js";
  import { db } from "../../../../js/firebase-config.js";
  import {
    doc,
    runTransaction,
    updateDoc,
    deleteDoc,
    collection,
    getDocs,
    getDoc,
    query,
    limit
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  const form = document.getElementById("credentialForm");
  const saveBtn = document.getElementById("saveBtn");
  const message = document.getElementById("formMessage");
  const idInput = document.getElementById("credentialID");
  const idStatus = document.getElementById("idStatus");
  const passwordInput = document.getElementById("password");
  const togglePasswordBtn = document.getElementById("togglePasswordBtn");
  const editCredentialBtn = document.getElementById("editCredentialBtn");
  const deleteCredentialBtn = document.getElementById("deleteCredentialBtn");
  const cancelFormBtn = document.getElementById("cancelFormBtn");

  const CACHE = "bizodit_credentials_cache_v2";
  let credentials = [];
  let currentId = null;
  let mode = "new"; // "new", "view", "edit"

  document.getElementById("presentDate").textContent = formatIndianDate(new Date());

  const clean = value => String(value || "").trim();
  const upper = value => clean(value).toUpperCase();

  const showMessage = (text, type = "error") => {
    message.textContent = text;
    message.className = `form-message show ${type}`;
  };

  const clearMessage = () => {
    message.textContent = "";
    message.className = "form-message";
  };

  /* Password Toggle */
  togglePasswordBtn.addEventListener("click", () => {
    const isPassword = passwordInput.type === "password";
    passwordInput.type = isPassword ? "text" : "password";
    togglePasswordBtn.innerHTML = `<i data-lucide="${isPassword ? 'eye-off' : 'eye'}"></i>`;
    window.lucide?.createIcons();
  });

  /* Copy Buttons for Portal No, Username, and Password */
  document.querySelectorAll("[data-copy-target]").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const targetId = btn.getAttribute("data-copy-target");
      const targetInput = document.getElementById(targetId);
      if (!targetInput || !targetInput.value) {
        showMessage("Nothing to copy in this field.", "error");
        return;
      }
      try {
        await navigator.clipboard.writeText(targetInput.value);
        showMessage(`Copied ${targetInput.previousElementSibling?.textContent || 'value'} to clipboard.`, "success");
      } catch {
        targetInput.select();
        document.execCommand("copy");
        showMessage("Copied to clipboard.", "success");
      }
    });
  });

  /* Client Auto-Fill Search */
  const clientIdInput = document.getElementById("clientId");
  const clientNameInput = document.getElementById("clientName");
  const clientIdList = document.getElementById("clientIdList");
  const clientNameList = document.getElementById("clientNameList");

  let clientsCache = [];
  let clientsLoaded = false;

  const normalize = value => String(value || "").trim().toLowerCase();

  function fillClient(client) {
    if (!client) return;
    clientIdInput.value = client.clientId || client.id || "";
    clientNameInput.value = client.clientName || "";
    clientIdInput.classList.remove("client-loading");
    clientNameInput.classList.remove("client-loading");
  }

  function findClientById(value) {
    const id = String(value || "").trim().toUpperCase();
    return clientsCache.find(client => String(client.clientId || client.id || "").trim().toUpperCase() === id);
  }

  function findClientByName(value) {
    const name = normalize(value);
    return clientsCache.find(client => normalize(client.clientName) === name);
  }

  async function loadClients() {
    const cacheKey = "bizodit_clients_cache_v3";
    try {
      const cached = JSON.parse(localStorage.getItem(cacheKey) || "[]");
      if (Array.isArray(cached) && cached.length) {
        clientsCache = cached;
        clientsLoaded = true;
        populateClientLists();
      }
    } catch (error) {
      console.warn("Client cache read failed:", error);
    }

    try {
      const snapshot = await getDocs(query(collection(db, "clients"), limit(500)));
      clientsCache = snapshot.docs.map(item => ({
        id: item.id,
        ...item.data()
      })).filter(client => client.clientId && client.clientName);

      localStorage.setItem(cacheKey, JSON.stringify(clientsCache));
      clientsLoaded = true;
      populateClientLists();
    } catch (error) {
      console.error("Unable to refresh client lookup:", error);
    }
  }

  function populateClientLists() {
    clientIdList.innerHTML = "";
    clientNameList.innerHTML = "";
    clientsCache.forEach(client => {
      const idOption = document.createElement("option");
      idOption.value = client.clientId || client.id;
      clientIdList.appendChild(idOption);

      const nameOption = document.createElement("option");
      nameOption.value = client.clientName;
      clientNameList.appendChild(nameOption);
    });
  }

  clientIdInput.addEventListener("input", () => {
    if (!clientsLoaded) return;
    const client = findClientById(clientIdInput.value);
    if (client) fillClient(client);
  });

  clientNameInput.addEventListener("input", () => {
    if (!clientsLoaded) return;
    const client = findClientByName(clientNameInput.value);
    if (client) fillClient(client);
  });

  clientIdInput.addEventListener("change", () => {
    const client = findClientById(clientIdInput.value);
    if (client) fillClient(client);
  });

  clientNameInput.addEventListener("change", () => {
    const client = findClientByName(clientNameInput.value);
    if (client) fillClient(client);
  });

  /* Auto-generate CR-0001 series */
  async function getNextCredentialId(transaction) {
    const counterRef = doc(db, "counters", "credentialCounter");
    const counterSnap = await transaction.get(counterRef);
    let nextNumber = 1;

    if (counterSnap.exists()) {
      const lastNumber = Number(counterSnap.data().lastNumber);
      if (Number.isFinite(lastNumber) && lastNumber >= 0) {
        nextNumber = lastNumber + 1;
      }
    }

    while (true) {
      const candidateId = `CR-${String(nextNumber).padStart(4, "0")}`;
      const candidateRef = doc(db, "credentials", candidateId);
      const candidateSnap = await transaction.get(candidateRef);

      if (!candidateSnap.exists()) {
        return { id: candidateId, counterRef, nextNumber };
      }
      nextNumber++;
    }
  }

  function formData() {
    return {
      credentialID: clean(idInput.value),
      clientId: upper(clientIdInput.value),
      clientName: clean(clientNameInput.value),
      portalName: clean(document.getElementById("portalName").value),
      portalNo: clean(document.getElementById("portalNo").value),
      userName: clean(document.getElementById("userName").value),
      password: clean(document.getElementById("password").value),
      createdBy: clean(document.getElementById("createdBy").value) || "Admin",
      narration: clean(document.getElementById("narration").value)
    };
  }

  function fillForm(c) {
    currentId = c.credentialID || c.id;
    idInput.value = currentId || "";
    clientIdInput.value = c.clientId || "";
    clientNameInput.value = c.clientName || "";
    document.getElementById("portalName").value = c.portalName || "";
    document.getElementById("portalNo").value = c.portalNo || "";
    document.getElementById("userName").value = c.userName || "";
    document.getElementById("password").value = c.password || "";
    document.getElementById("createdBy").value = c.createdBy || "Admin";
    document.getElementById("narration").value = c.narration || "";
  }

  function setInputs(disabled) {
    form.querySelectorAll("input,select,textarea").forEach(x => x.disabled = disabled);
    idInput.readOnly = true;
    saveBtn.disabled = disabled;
  }

  function viewMode() {
    mode = "view";
    form.classList.add("view-mode");
    document.getElementById("credentialFormTitle").textContent = "Credential Details";
    editCredentialBtn.classList.remove("hidden");
    deleteCredentialBtn.classList.remove("hidden");
    setInputs(true);
    cancelFormBtn.textContent = "Back";
    clearMessage();
  }

  function editMode() {
    mode = "edit";
    form.classList.remove("view-mode");
    document.getElementById("credentialFormTitle").textContent = "Edit Credential";
    editCredentialBtn.classList.add("hidden");
    deleteCredentialBtn.classList.remove("hidden");
    setInputs(false);
    cancelFormBtn.textContent = "Cancel";
    clearMessage();
  }

  function newMode() {
    mode = "new";
    currentId = null;
    form.classList.remove("view-mode");
    document.getElementById("credentialFormTitle").textContent = "Credential Entry";
    editCredentialBtn.classList.add("hidden");
    deleteCredentialBtn.classList.add("hidden");
    form.reset();
    document.getElementById("createdBy").value = "Admin";
    idInput.value = "";
    idStatus.textContent = "";
    setInputs(false);
    cancelFormBtn.textContent = "Cancel";
    passwordInput.type = "password";
    clearMessage();
  }

  const credentialListPanel = document.getElementById("credentialListPanel");
  const addCredentialBtn = document.getElementById("addCredentialBtn");
  const credentialSearch = document.getElementById("credentialSearch");
  const credentialSortBtn = document.getElementById("credentialSortBtn");
  const credentialFilterBtn = document.getElementById("credentialFilterBtn");
  const credentialSortMenu = document.getElementById("credentialSortMenu");
  const credentialFilterPanel = document.getElementById("credentialFilterPanel");
  const credentialPortalFilter = document.getElementById("credentialPortalFilter");
  const credentialRefreshBtn = document.getElementById("credentialRefreshBtn");
  const credentialList = document.getElementById("credentialList");

  let credentialSort = "id";

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function whatsappClean(n) {
    let x = String(n || "").replace(/\D/g, "");
    if (x.length === 10) x = "91" + x;
    if (x.length === 11 && x.startsWith("0")) x = "91" + x.slice(1);
    return x;
  }

  async function loadCredentialList() {
    try {
      const cached = JSON.parse(localStorage.getItem(CACHE) || "[]");
      if (Array.isArray(cached) && cached.length) {
        credentials = cached;
        renderCredentialList();
      }
    } catch (error) {
      console.warn("Credential cache read failed:", error);
    }

    try {
      const snapshot = await getDocs(query(collection(db, "credentials"), limit(500)));
      credentials = snapshot.docs.map(item => ({ id: item.id, ...item.data() }));
      localStorage.setItem(CACHE, JSON.stringify(credentials));
      renderCredentialList();
    } catch (error) {
      console.error("Credential list load failed:", error);
      if (!credentials.length) {
        credentialList.innerHTML = '<div class="empty-list">Unable to load credentials. Tap Refresh to try again.</div>';
      }
    }
  }

  function renderCredentialList() {
    const term = clean(credentialSearch.value).toLowerCase();
    const portal = clean(credentialPortalFilter.value);

    let rows = credentials.filter(row => {
      const idVal = row.credentialID || row.id || "";
      const text = `${idVal} ${row.clientId || ""} ${row.clientName || ""} ${row.portalName || ""} ${row.userName || ""}`.toLowerCase();
      return (!term || text.includes(term)) && (!portal || row.portalName === portal);
    });

    rows.sort((a, b) => {
      if (credentialSort === "id") return String(a.credentialID || a.id || "").localeCompare(String(b.credentialID || b.id || ""), undefined, { numeric: true });
      if (credentialSort === "client") return String(a.clientName || "").localeCompare(String(b.clientName || ""));
      if (credentialSort === "portal") return String(a.portalName || "").localeCompare(String(b.portalName || ""));
      if (credentialSort === "newest") return String(b.createdAt || "").localeCompare(String(a.createdAt || ""));
      return 0;
    });

    if (!rows.length) {
      credentialList.innerHTML = '<div class="empty-list">No credential records found.</div>';
      return;
    }

    credentialList.innerHTML = rows.map(row => {
      const id = String(row.credentialID || row.id);
      const client = findClientById(row.clientId);
      const phone = clean(client?.mobile || "");
      const wa = whatsappClean(phone);
      const portalLabel = row.portalName || "Portal";
      const loginUser = row.userName || "No Username";

      return `
      <div class="data-row">
        <div class="data-row-main">
          <div class="data-row-content" data-open="${escapeHtml(id)}">
            <div class="data-row-title">${escapeHtml(row.clientName || row.clientId || "Client")}</div>
            <div class="data-row-sub">${escapeHtml(id)} · ${escapeHtml(loginUser)} ${row.portalNo ? `(${escapeHtml(row.portalNo)})` : ''}</div>
          </div>
          <div class="data-row-meta">
            <span class="portal-badge">${escapeHtml(portalLabel)}</span>
          </div>
        </div>
        <div class="credential-row-actions">
          ${phone ? `<a class="credential-action-btn call" href="tel:${escapeHtml(phone)}" title="Call Client"><i data-lucide="phone"></i></a>` : ""}
          ${phone ? `<a class="credential-action-btn whatsapp" href="https://wa.me/${escapeHtml(wa)}" target="_blank" rel="noopener" title="WhatsApp"><i data-lucide="message-circle"></i></a>` : ""}
          <button class="credential-action-btn open-btn" data-open="${escapeHtml(id)}" type="button" title="View Details"><i data-lucide="arrow-up-right"></i></button>
        </div>
      </div>`;
    }).join("");

    window.lucide?.createIcons();

    credentialList.querySelectorAll("[data-open]").forEach(b => {
      b.addEventListener("click", e => {
        e.stopPropagation();
        openView(b.dataset.open);
      });
    });
  }

  function findCredential(id) {
    return credentials.find(c => String(c.credentialID || c.id) === String(id));
  }

  async function openView(id) {
    const cached = findCredential(id);
    if (cached) {
      fillForm(cached);
      credentialListPanel.classList.add("hidden");
      form.classList.remove("hidden");
      viewMode();
      window.scrollTo(0, 0);
    }
    try {
      const s = await getDoc(doc(db, "credentials", id));
      if (!s.exists()) throw new Error("Credential record no longer exists.");
      fillForm({ id: s.id, ...s.data() });
      viewMode();
    } catch (e) {
      if (!cached) showMessage(e.message || "Unable to open credential.");
    }
  }

  function openList() {
    form.classList.add("hidden");
    credentialListPanel.classList.remove("hidden");
    newMode();
    renderCredentialList();
    window.scrollTo(0, 0);
  }

  function openNew() {
    newMode();
    credentialListPanel.classList.add("hidden");
    form.classList.remove("hidden");
    window.scrollTo(0, 0);
  }

  /* CSV Download/Export/Import Utilities */
  function downloadBlob(content, filename, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById("downloadTemplateBtn").addEventListener("click", () => {
    const template = "Client ID,Client Name,Portal Name,Portal No,User Name,Password,Created By,Narration\n" +
                     "C40001,Acme Corp,GST,27ABCDE1234F1Z5,acme_gst,Secret@123,Admin,Official GST login";
    downloadBlob(template, "credentials_template.csv", "text/csv;charset=utf-8;");
  });

  document.getElementById("exportCredentialBtn").addEventListener("click", () => {
    if (!credentials.length) { alert("No credentials to export."); return; }
    const headers = ["Credential ID","Client ID","Client Name","Portal Name","Portal No","User Name","Password","Created By","Narration","Created At"];
    const rows = credentials.map(c => [
      `"${c.credentialID||c.id||""}"`, `"${c.clientId||""}"`, `"${(c.clientName||"").replace(/"/g,'""')}"`,
      `"${(c.portalName||"").replace(/"/g,'""')}"`, `"${(c.portalNo||"").replace(/"/g,'""')}"`,
      `"${(c.userName||"").replace(/"/g,'""')}"`, `"${(c.password||"").replace(/"/g,'""')}"`,
      `"${c.createdBy||"Admin"}"`, `"${(c.narration||"").replace(/"/g,'""')}"`, `"${c.createdAt||""}"`
    ]);
    const csv = [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
    downloadBlob(csv, `credentials_export_${new Date().toISOString().slice(0,10)}.csv`, "text/csv;charset=utf-8;");
  });

  document.getElementById("importCredentialBtn").addEventListener("click", () => document.getElementById("csvFileInput").click());

  document.getElementById("csvFileInput").addEventListener("change", async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const text = await file.text();
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (lines.length < 2) { alert("CSV file has no data rows."); return; }

    const parseRow = row => {
      const res = []; let inQ = false, val = "";
      for (let i = 0; i < row.length; i++) {
        const c = row[i];
        if (c === '"') { if (inQ && row[i+1] === '"') { val += '"'; i++; } else inQ = !inQ; }
        else if (c === ',' && !inQ) { res.push(val.trim()); val = ""; }
        else val += c;
      }
      res.push(val.trim());
      return res;
    };

    const rows = lines.slice(1).map(parseRow);
    if (!confirm(`Import ${rows.length} credential record(s)?`)) { e.target.value = ""; return; }

    credentialRefreshBtn.classList.add("spinning");
    try {
      let imported = 0;
      const now = new Date().toISOString();
      for (const r of rows) {
        const cId = upper(r[0]), cName = clean(r[1]), portal = clean(r[2]), uName = clean(r[4]), pwd = clean(r[5]);
        if (!cId || !portal || !uName || !pwd) continue;

        await runTransaction(db, async tx => {
          const result = await getNextCredentialId(tx);
          const credRef = doc(db, "credentials", result.id);
          const record = {
            credentialID: result.id,
            clientId: cId,
            clientName: cName,
            portalName: portal,
            portalNo: clean(r[3]),
            userName: uName,
            password: pwd,
            createdBy: clean(r[6]) || "Admin",
            narration: clean(r[7]) || "",
            createdAt: now,
            updatedAt: now
          };
          tx.set(result.counterRef, { lastNumber: result.nextNumber, updatedAt: now }, { merge: true });
          tx.set(credRef, record);
        });
        imported++;
      }
      localStorage.removeItem(CACHE);
      await loadCredentialList();
      alert(`Successfully imported ${imported} credential(s).`);
    } catch (err) {
      console.error(err);
      alert("Error during credential import: " + err.message);
    } finally {
      credentialRefreshBtn.classList.remove("spinning");
      e.target.value = "";
    }
  });

  addCredentialBtn.addEventListener("click", openNew);
  cancelFormBtn.addEventListener("click", openList);
  editCredentialBtn.addEventListener("click", editMode);

  deleteCredentialBtn.addEventListener("click", async () => {
    if (!currentId) return;
    if (!confirm(`Delete credential (${currentId})?\n\nThis action cannot be undone.`)) return;
    deleteCredentialBtn.disabled = true;
    try {
      await deleteDoc(doc(db, "credentials", currentId));
      credentials = credentials.filter(x => String(x.credentialID || x.id) !== String(currentId));
      localStorage.setItem(CACHE, JSON.stringify(credentials));
      showMessage("Credential deleted successfully.", "success");
      setTimeout(openList, 450);
    } catch (e) {
      showMessage(e.message || "Unable to delete credential.");
    } finally {
      deleteCredentialBtn.disabled = false;
    }
  });

  credentialSearch.addEventListener("input", renderCredentialList);
  credentialPortalFilter.addEventListener("change", renderCredentialList);

  credentialRefreshBtn.addEventListener("click", async () => {
    credentialRefreshBtn.classList.add("spinning");
    try {
      localStorage.removeItem(CACHE);
      await loadCredentialList();
    } finally {
      credentialRefreshBtn.classList.remove("spinning");
    }
  });

  credentialSortBtn.addEventListener("click", () => credentialSortMenu.classList.toggle("show"));
  credentialFilterBtn.addEventListener("click", () => credentialFilterPanel.classList.toggle("show"));

  credentialSortMenu.querySelectorAll(".sort-option").forEach(option => {
    option.addEventListener("click", () => {
      credentialSort = option.dataset.sort;
      credentialSortMenu.querySelectorAll(".sort-option").forEach(x => x.classList.remove("active"));
      option.classList.add("active");
      credentialSortMenu.classList.remove("show");
      renderCredentialList();
    });
  });

  document.getElementById("pageBackBtn").addEventListener("click", () => {
    if (!form.classList.contains("hidden")) {
      openList();
    } else {
      history.back();
    }
  });

  /* Create new credential via transaction */
  async function createCredential() {
    const d = formData();
    if (!d.clientId) { showMessage("Client ID is required."); clientIdInput.focus(); return; }
    if (!d.clientName) { showMessage("Client Name is required."); clientNameInput.focus(); return; }

    const selectedClient = findClientById(d.clientId);
    if (!selectedClient || normalize(selectedClient.clientName) !== normalize(d.clientName)) {
      showMessage("Please select a valid Client ID or Client Name from the list.");
      clientIdInput.focus();
      return;
    }

    if (!d.portalName) { showMessage("Portal Name is required."); document.getElementById("portalName").focus(); return; }
    if (!d.userName) { showMessage("Username is required."); document.getElementById("userName").focus(); return; }
    if (!d.password) { showMessage("Password is required."); document.getElementById("password").focus(); return; }

    saveBtn.disabled = true;
    form.classList.add("saving");
    saveBtn.querySelector(".save-text").textContent = "Saving...";
    idStatus.textContent = "…";

    try {
      const now = new Date().toISOString();
      let generatedId = "";

      await runTransaction(db, async (transaction) => {
        const result = await getNextCredentialId(transaction);
        generatedId = result.id;
        const credRef = doc(db, "credentials", generatedId);
        const data = {
          ...d,
          credentialID: generatedId,
          createdAt: now,
          updatedAt: now
        };
        transaction.set(result.counterRef, { lastNumber: result.nextNumber, updatedAt: now }, { merge: true });
        transaction.set(credRef, data);
      });

      idInput.value = generatedId;
      idStatus.textContent = "✓";
      showMessage(`Credential ${generatedId} saved successfully.`, "success");
      localStorage.removeItem(CACHE);

      setTimeout(() => {
        openList();
        loadCredentialList();
      }, 450);
    } catch (error) {
      console.error("Credential save error:", error);
      idStatus.textContent = "";
      showMessage(error?.message || "Unable to save credential. Please try again.");
    } finally {
      saveBtn.disabled = false;
      form.classList.remove("saving");
      saveBtn.querySelector(".save-text").textContent = "Save Credential";
    }
  }

  /* Update existing credential without generating a duplicate */
  async function updateCredential() {
    if (!currentId) return;
    const d = formData();
    if (!d.portalName || !d.userName || !d.password) {
      showMessage("Portal Name, Username, and Password are required.");
      return;
    }

    saveBtn.disabled = true;
    form.classList.add("saving");
    saveBtn.querySelector(".save-text").textContent = "Updating...";

    try {
      const now = new Date().toISOString();
      await updateDoc(doc(db, "credentials", currentId), {
        clientId: d.clientId,
        clientName: d.clientName,
        portalName: d.portalName,
        portalNo: d.portalNo,
        userName: d.userName,
        password: d.password,
        createdBy: d.createdBy,
        narration: d.narration,
        updatedAt: now
      });

      const idx = credentials.findIndex(c => String(c.credentialID || c.id) === String(currentId));
      if (idx >= 0) {
        credentials[idx] = { ...credentials[idx], ...d, credentialID: currentId, updatedAt: now };
        localStorage.setItem(CACHE, JSON.stringify(credentials));
      }

      showMessage("Credential updated successfully.", "success");
      setTimeout(() => {
        openList();
      }, 450);
    } catch (error) {
      console.error("Credential update error:", error);
      showMessage(error?.message || "Unable to update credential.");
    } finally {
      saveBtn.disabled = false;
      form.classList.remove("saving");
      saveBtn.querySelector(".save-text").textContent = "Save Credential";
    }
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    clearMessage();
    if (saveBtn.disabled) return;

    if (mode === "edit") {
      await updateCredential();
    } else {
      await createCredential();
    }
  });

  document.getElementById("menuToggle")?.addEventListener("click", () => document.body.classList.toggle("sidebar-open"));

  window.lucide.createIcons();
  loadClients().then(loadCredentialList);
</script>

</body>
</html>
