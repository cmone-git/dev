<style>

.add-form-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:72px;height:40px;padding:0 12px}.import-export-tools{display:flex;gap:6px;flex-wrap:wrap}.tool-btn{width:40px}.tool-btn.import{color:#0b3b66}.tool-btn.export{color:#26784d}.tool-btn.template{color:#6b7280}.hidden-file{display:none!important}
.list-panel{display:block}.list-panel.hidden,.entry-panel.hidden{display:none}.data-list{display:flex;flex-direction:column;gap:7px}.data-row{border:1px solid #e0e3e7;border-radius:10px;padding:10px 12px;background:#fff}.data-row-main{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.data-row-content{min-width:0;flex:1;cursor:pointer}.data-row-title{font-weight:600;font-size:15px;color:#25313d}.data-row-sub{margin-top:3px;color:#727983;font-size:12px;line-height:1.4}.data-row-meta{text-align:right;font-size:12px;white-space:nowrap}.status-active{color:#287a4e}.status-inactive{color:#a14b4b}.client-row-actions{display:flex;align-items:center;justify-content:flex-end;gap:5px;margin-top:7px;padding-top:6px;border-top:1px solid #edf0f2}.client-action-btn{width:32px;height:32px;color:#5c6975;text-decoration:none;border-radius:7px}.client-action-btn.whatsapp{color:#238b55}.client-action-btn.call{color:#0b3b66}.client-action-btn.contact{color:#7b5a18}.client-action-btn.delete{color:#b42318}.empty-list{padding:28px 12px;text-align:center;color:#777;font-size:13px}
.filter-panel{display:none;margin-bottom:10px;padding:11px;border:1px solid #e0e3e7;border-radius:10px;background:#fafbfc}.filter-panel.show{display:block}.filter-panel .field{margin-bottom:8px}.date-range{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-top:8px}.date-range .field{flex:1 1 140px;min-width:130px;margin-bottom:0}.date-range .field label{display:block;margin-bottom:5px}.sort-menu{display:none}.sort-menu.show{display:block;margin-bottom:9px}.sort-options{display:flex;gap:6px;flex-wrap:wrap}.sort-option{border:1px solid #d7dce2;background:#fff;border-radius:7px;padding:7px 10px;font-size:12px;cursor:pointer}.sort-option.active{background:#eef2f5;font-weight:600}
.form-message{display:none;margin:0 0 14px;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.4}.form-message.show{display:block}.form-message.error{background:#fff1f1;color:#a33b3b;border:1px solid #efcccc}.form-message.success{background:#eff8f2;color:#287a4e;border:1px solid #c9e3d2}.form-view-actions{display:flex;justify-content:flex-end;gap:6px;width:auto;height:auto;border:0;background:transparent;margin:-4px 0 10px}.form-view-action{width:38px;height:38px}.form-view-action.delete{color:#b42318}.form-view-action.hidden{display:none}.view-mode input:not([readonly]),.view-mode select,.view-mode textarea{background:#f7f8f9;color:#33404c;pointer-events:none}.view-mode .form-actions{display:none}.form-mode-label{display:none;margin:-7px 0 14px;font-size:11px;color:#7b8791}.view-mode .form-mode-label{display:block}.contact-picker-hidden{display:none!important}.contact-help{font-size:11px;color:#7b8791;margin-top:5px}.saving .save-icon{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:650px){.list-toolbar{gap:6px}.list-search{flex:1 1 calc(100% - 142px)}.import-export-tools{width:100%;order:5}.import-export-tools .tool-btn{width:38px;height:38px}.add-form-btn{margin-left:auto}.data-row{padding:9px 11px}.client-row-actions{margin-top:6px;padding-top:5px}}
</style>
</head>
<body>
<header class="cm-header"><div class="cm-header-inner"><div class="cm-header-left"><button class="menu-toggle" id="menuToggle" type="button"><i data-lucide="menu"></i></button><div class="cm-brand"><div class="cm-logo">CM</div><div class="cm-brand-title">CM | BIZODIT</div></div></div></div></header>
<main class="main"><div class="page"><div class="form-page">
<section class="module-header"><div class="module-header-left"><button class="back-btn" id="pageBackBtn" type="button"><i data-lucide="arrow-left"></i></button><div class="module-title"><h1>Clients</h1><p>Create and manage client records</p><div class="report-as-on">Date : <strong id="presentDate">--</strong></div></div></div></section>

<div id="clientListPanel" class="form-section list-panel">
<div class="list-toolbar">
<input id="clientSearch" class="list-search" type="search" placeholder="Search clients..." autocomplete="off">
<button id="clientSortBtn" class="list-icon-btn" type="button" title="Sort"><i data-lucide="arrow-up-down"></i></button>
<button id="clientFilterBtn" class="list-icon-btn" type="button" title="Filter"><i data-lucide="list-filter"></i></button>
<button id="clientRefreshBtn" class="refresh-btn" type="button" title="Refresh"><i data-lucide="refresh-cw"></i></button>
<div class="import-export-tools">
<button id="downloadTemplateBtn" class="tool-btn template" type="button" title="Download import format"><i data-lucide="file-down"></i></button>
<button id="importClientBtn" class="tool-btn import" type="button" title="Import clients"><i data-lucide="upload"></i></button>
<button id="exportClientBtn" class="tool-btn export" type="button" title="Export clients"><i data-lucide="download"></i></button>
<input id="clientImportFile" class="hidden-file" type="file" accept=".csv,text/csv">
</div>
<button id="addClientBtn" class="btn btn-primary add-form-btn" type="button"><i data-lucide="plus"></i>Add</button>
</div>
<div id="clientSortMenu" class="sort-menu"><div class="sort-options"><button class="sort-option active" data-sort="name">Name A–Z</button><button class="sort-option" data-sort="name-desc">Name Z–A</button><button class="sort-option" data-sort="id">Client ID</button><button class="sort-option" data-sort="newest">Newest</button></div></div>
<div id="clientFilterPanel" class="filter-panel"><div class="field"><label>Status</label><select id="clientStatusFilter"><option value="">All Status</option><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div><div class="date-range"><div class="field"><label>From Date</label><input id="clientFromDate" type="date"></div><div class="field"><label>To Date</label><input id="clientToDate" type="date"></div></div></div>
<div id="clientList" class="data-list"><div class="empty-list">Loading clients...</div></div>
</div>

<form class="form-section entry-panel hidden" id="clientForm">
<div class="form-view-actions"><button id="editClientBtn" class="form-view-action" type="button" title="Edit client"><i data-lucide="pencil"></i></button><button id="deleteClientBtn" class="form-view-action delete" type="button" title="Delete client"><i data-lucide="trash-2"></i></button></div>
<h2 id="clientFormTitle">Client Entry</h2><div id="formModeLabel" class="form-mode-label">View mode — tap Edit to modify this client.</div><div id="formMessage" class="form-message"></div>
<div class="form-grid">
<div class="field"><label>Client ID</label><div class="client-id-box"><input id="clientId" type="text" readonly placeholder="Generating..."><span id="idStatus" class="id-status"></span></div></div>
<div class="field"><label>Client Name <span class="required">*</span></label><input id="clientName" type="text" required placeholder="Enter client name" autocomplete="organization"></div>
<div class="field"><label>Legal Name</label><input id="legalName" type="text" placeholder="Legal / registered name"></div>
<div class="field"><label>Constitution</label><select id="constitution"><option value="">Select Constitution...</option><option>Proprietorship</option><option>Partnership</option><option>LLP</option><option>Private Limited</option><option>Public Limited</option><option>OPC</option><option>HUF</option><option>Trust</option><option>Society</option><option>Individual</option><option>Other</option></select></div>
<div class="field"><label>Mobile</label><div style="display:flex;gap:6px"><input id="mobile" type="tel" inputmode="numeric" maxlength="10" placeholder="10 digit mobile number" style="flex:1"><button id="contactPickerBtn" class="list-icon-btn contact-picker-hidden" type="button" title="Add from phone contacts"><i data-lucide="contact-round"></i></button></div><div id="contactHelp" class="contact-help"></div></div>
<div class="field"><label>Email</label><input id="email" type="email" placeholder="client@example.com"></div><div class="field"><label>PAN</label><input id="pan" type="text" maxlength="10" placeholder="ABCDE1234F" style="text-transform:uppercase"></div><div class="field"><label>Aadhaar</label><input id="adhar" type="text" inputmode="numeric" maxlength="12" placeholder="12 digit Aadhaar"></div><div class="field"><label>GSTIN</label><input id="gstin" type="text" maxlength="15" placeholder="15 digit GSTIN" style="text-transform:uppercase"></div><div class="field"><label>Branch ID</label><input id="branchId" type="text" placeholder="Branch ID"></div><div class="field full"><label>Address</label><textarea id="address" rows="3" placeholder="Complete address"></textarea></div><div class="field"><label>Status</label><select id="status"><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div><div class="field"><label>Client Folder URL</label><input id="clientFolderUrl" type="url" placeholder="Google Drive / client folder URL"></div><div class="field full"><label>Notes</label><textarea id="notes" rows="3" placeholder="Additional client information..."></textarea></div>
</div><div class="form-actions"><button type="button" class="btn btn-secondary" id="cancelFormBtn">Cancel</button><button id="saveBtn" class="btn btn-primary" type="submit"><i class="save-icon" data-lucide="save"></i><span class="save-text">Save Client</span></button></div>
</form>
</div></div></main>
<nav class="bottom-nav"><div class="bottom-nav-inner"><a class="bottom-item" href="../../../index.html"><i data-lucide="house"></i><span>HOME</span></a><a class="bottom-item" href="../../crm/crm.html"><i data-lucide="users-round"></i><span>CRM</span></a><a class="bottom-item" href="../../accounts/accounts.html"><i data-lucide="wallet"></i><span>ACCOUNTS</span></a><a class="bottom-item" href="../../settings/settings.html"><i data-lucide="settings-2"></i><span>SETTINGS</span></a></div></nav>

<script type="module">
import { db } from "../../../js/firebase-config.js";
import { doc,getDoc,getDocs,updateDoc,deleteDoc,collection,query,where,limit,runTransaction } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const $=id=>document.getElementById(id),form=$("clientForm"),listPanel=$("clientListPanel"),list=$("clientList"),msg=$("formMessage"),save=$("saveBtn");
const CACHE="bizodit_clients_cache_v4";let clients=[],sortMode="name",currentId=null,mode="new";
$("presentDate").textContent=new Intl.DateTimeFormat("en-IN",{day:"2-digit",month:"2-digit",year:"numeric"}).format(new Date());
const clean=v=>String(v||"").trim(),upper=v=>clean(v).toUpperCase(),esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const show=(t,type="error")=>{msg.textContent=t;msg.className=`form-message show ${type}`},clear=()=>{msg.textContent="";msg.className="form-message"};
function data(){return{clientId:clean($("clientId").value),clientName:clean($("clientName").value),legalName:clean($("legalName").value),constitution:clean($("constitution").value),address:clean($("address").value),mobile:clean($("mobile").value),email:clean($("email").value).toLowerCase(),pan:upper($("pan").value),adhar:clean($("adhar").value),gstin:upper($("gstin").value),branchId:clean($("branchId").value),clientFolderUrl:clean($("clientFolderUrl").value),notes:clean($("notes").value),status:clean($("status").value)||"Active"}}
function fill(c){currentId=c.clientId||c.id;$("clientId").value=c.clientId||c.id||"";$("clientName").value=c.clientName||"";$("legalName").value=c.legalName||"";$("constitution").value=c.constitution||"";$("address").value=c.address||"";$("mobile").value=c.mobile||"";$("email").value=c.email||"";$("pan").value=c.pan||"";$("adhar").value=c.adhar||"";$("gstin").value=c.gstin||"";$("branchId").value=c.branchId||"";$("clientFolderUrl").value=c.clientFolderUrl||"";$("notes").value=c.notes||"";$("status").value=c.status||"Active"}
function setInputs(disabled){form.querySelectorAll("input,select,textarea").forEach(x=>x.disabled=disabled);$("clientId").readOnly=true;save.disabled=disabled}
function viewMode(){mode="view";form.classList.add("view-mode");$("clientFormTitle").textContent="Client Details";$("editClientBtn").classList.remove("hidden");$("deleteClientBtn").classList.remove("hidden");setInputs(true);$("cancelFormBtn").textContent="Back";$("contactPickerBtn").classList.add("contact-picker-hidden");clear()}
function editMode(){mode="edit";form.classList.remove("view-mode");$("clientFormTitle").textContent="Edit Client";$("editClientBtn").classList.add("hidden");$("deleteClientBtn").classList.remove("hidden");setInputs(false);$("cancelFormBtn").textContent="Cancel";updateContactPicker();clear()}
function newMode(){mode="new";currentId=null;form.classList.remove("view-mode");$("clientFormTitle").textContent="Client Entry";$("editClientBtn").classList.add("hidden");$("deleteClientBtn").classList.add("hidden");form.reset();$("status").value="Active";$("clientId").value="";$("idStatus").textContent="";setInputs(false);$("cancelFormBtn").textContent="Cancel";clear();updateContactPicker()}
async function load(){try{const c=JSON.parse(localStorage.getItem(CACHE)||"[]");if(Array.isArray(c)&&c.length){clients=c;render()}}catch{}try{const s=await getDocs(query(collection(db,"clients"),limit(500)));clients=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.clientId&&c.clientName);clients.sort((a,b)=>String(a.clientName).localeCompare(String(b.clientName)));localStorage.setItem(CACHE,JSON.stringify(clients));render()}catch(e){console.error(e);if(!clients.length)list.innerHTML='<div class="empty-list">Unable to load clients. Tap Refresh to try again.</div>'}}
function whatsapp(n){let x=String(n||"").replace(/\D/g,"");if(x.length===10)x="91"+x;if(x.length===11&&x.startsWith("0"))x="91"+x.slice(1);return x}
function render(){const term=clean($("clientSearch").value).toLowerCase(),status=clean($("clientStatusFilter").value);let rows=clients.filter(c=>{const search=!term||[c.clientId,c.clientName,c.mobile,c.gstin].some(v=>String(v||"").toLowerCase().includes(term));const st=!status||String(c.status||"")==status,created=String(c.createdAt||"").slice(0,10);return search&&st&&(!$("clientFromDate").value||created>=$("clientFromDate").value)&&(!$("clientToDate").value||created<=$("clientToDate").value)});rows.sort((a,b)=>{if(sortMode==="name")return String(a.clientName||"").localeCompare(String(b.clientName||""));if(sortMode==="name-desc")return String(b.clientName||"").localeCompare(String(a.clientName||""));if(sortMode==="id")return String(a.clientId||"").localeCompare(String(b.clientId||""),undefined,{numeric:true});return String(b.createdAt||"").localeCompare(String(a.createdAt||""))});if(!rows.length){list.innerHTML='<div class="empty-list">No clients found.</div>';return}list.innerHTML=rows.map(c=>{const id=String(c.clientId||c.id||""),phone=clean(c.mobile),wa=whatsapp(phone),statusClass=String(c.status||"Active").toLowerCase()==="active"?"status-active":"status-inactive";return `<div class="data-row"><div class="data-row-main"><div class="data-row-content" data-open="${esc(id)}"><div class="data-row-title">${esc(c.clientName||"Unnamed Client")}</div><div class="data-row-sub">${esc(id)} · ${phone?`<span class="client-phone">${esc(phone)}</span>`:"No mobile number"}</div></div><div class="data-row-meta ${statusClass}">${esc(c.status||"Active")}</div></div><div class="client-row-actions">${phone?`<a class="client-action-btn call" href="tel:${esc(phone)}" title="Call"><i data-lucide="phone"></i></a><a class="client-action-btn whatsapp" href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener" title="WhatsApp"><i data-lucide="message-circle"></i></a>`:`<button class="client-action-btn contact" data-contact="${esc(id)}" type="button" title="Add from phone contacts"><i data-lucide="contact-round"></i></button>`}<button class="client-action-btn" data-open="${esc(id)}" type="button" title="Open full client"><i data-lucide="arrow-up-right"></i></button></div></div>`}).join("");window.lucide?.createIcons();list.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();openView(b.dataset.open)}));list.querySelectorAll("[data-contact]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();contactForClient(b.dataset.contact)}))}
function find(id){return clients.find(c=>String(c.clientId||c.id||"")===String(id))}
async function openView(id){const cached=find(id);if(cached){fill(cached);listPanel.classList.add("hidden");form.classList.remove("hidden");viewMode();scrollTo(0,0)}try{const s=await getDoc(doc(db,"clients",id));if(!s.exists())throw Error("Client record no longer exists.");fill({id:s.id,...s.data()});viewMode()}catch(e){if(!cached)show(e.message||"Unable to open client.")}}
function openList(){form.classList.add("hidden");listPanel.classList.remove("hidden");newMode();render();scrollTo(0,0)}function openNew(){newMode();listPanel.classList.add("hidden");form.classList.remove("hidden");scrollTo(0,0)}
function contactSupported(){return "contacts" in navigator&&"ContactsManager" in window}function updateContactPicker(){$("contactPickerBtn").classList.toggle("contact-picker-hidden",!contactSupported()||mode==="view");$("contactHelp").textContent=contactSupported()&&mode!=="view"?"Tap the contact icon to select a phone contact.":""}
async function pickContact(){if(!contactSupported()){show("Phone contact selection is not supported by this browser. Please enter the mobile number manually.");return}try{const a=await navigator.contacts.select(["name","tel"],{multiple:false});if(!a?.length)return;const phone=(a[0].tel||[])[0];if(!phone){show("The selected contact has no phone number.");return}let n=String(phone).replace(/\D/g,"");if(n.startsWith("91")&&n.length===12)n=n.slice(2);if(n.startsWith("0")&&n.length===11)n=n.slice(1);if(n.length!==10){show("The selected contact does not have a valid 10 digit Indian mobile number.");return}$("mobile").value=n;if(mode==="new"&&!clean($("clientName").value)&&a[0].name?.[0])$("clientName").value=a[0].name[0];show("Mobile number added from phone contact.","success")}catch(e){if(e?.name!=="AbortError")show("Unable to access phone contacts. Please enter the mobile number manually.")}}
async function contactForClient(id){await openView(id);editMode();await pickContact();if(clean($("mobile").value)&&currentId)await updateClient(true)}
async function duplicate(field,value,exclude){if(!value)return false;const s=await getDocs(query(collection(db,"clients"),where(field,"==",value),limit(5)));return s.docs.some(d=>String(d.id)!==String(exclude||""))}
async function validate(exclude=null){const d=data();if(!d.clientName)return"Client Name is required.";if(d.mobile&&!/^[0-9]{10}$/.test(d.mobile))return"Enter a valid 10 digit mobile number.";if(d.pan&&!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(d.pan))return"Enter a valid PAN.";if(d.gstin&&!/^[0-9A-Z]{15}$/.test(d.gstin))return"Enter a valid 15 digit GSTIN.";if(await duplicate("pan",d.pan,exclude))return"A client with this PAN already exists.";if(await duplicate("gstin",d.gstin,exclude))return"A client with this GSTIN already exists.";if(await duplicate("mobile",d.mobile,exclude))return"A client with this mobile number already exists.";if(await duplicate("email",d.email,exclude))return"A client with this email already exists.";return""}
async function nextId(tx){const counter=doc(db,"counters","clientCounter"),snap=await tx.get(counter);let n=40001;if(snap.exists()){const x=Number(snap.data().lastNumber);if(Number.isFinite(x)&&x>=40000)n=x+1}while(true){const id=`C${String(n).padStart(5,"0")}`,s=await tx.get(doc(db,"clients",id));if(!s.exists())return{counter,id,n};n++}}
async function createClient(){const err=await validate();if(err){show(err);return}save.disabled=true;form.classList.add("saving");$("saveBtn").querySelector(".save-text").textContent="Saving...";$("idStatus").textContent="…";try{const d=data(),now=new Date().toISOString();let made="";await runTransaction(db,async tx=>{const r=await nextId(tx);made=r.id;tx.set(r.counter,{lastNumber:r.n,updatedAt:now},{merge:true});tx.set(doc(db,"clients",made),{...d,clientId:made,createdAt:now,updatedAt:now})});$("idStatus").textContent="✓";show(`Client ${made} saved successfully.`,"success");localStorage.removeItem(CACHE);setTimeout(()=>{openList();load()},450)}catch(e){console.error(e);show(e.message||"Unable to save client. Please try again.");$("idStatus").textContent=""}finally{save.disabled=false;form.classList.remove("saving");$("saveBtn").querySelector(".save-text").textContent="Save Client"}}
async function updateClient(silent=false){if(!currentId)return;const err=await validate(currentId);if(err){if(!silent)show(err);return false}const d=data(),updatedAt=new Date().toISOString();save.disabled=true;form.classList.add("saving");try{await updateDoc(doc(db,"clients",currentId),{...d,clientId:currentId,updatedAt});const i=clients.findIndex(c=>String(c.clientId||c.id)===String(currentId));if(i>=0)clients[i]={...clients[i],...d,clientId:currentId,updatedAt};localStorage.setItem(CACHE,JSON.stringify(clients));if(!silent)show("Client updated successfully.","success");return true}catch(e){console.error(e);if(!silent)show(e.message||"Unable to update client.");return false}finally{save.disabled=false;form.classList.remove("saving")}}

function csvEscape(v){const s=String(v??"");return /[",\n\r]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}
const IMPORT_FIELDS=["clientName","legalName","constitution","address","mobile","email","pan","adhar","gstin","branchId","clientFolderUrl","notes","status"];
const IMPORT_HEADERS=["Client Name","Legal Name","Constitution","Address","Mobile","Email","PAN","Aadhaar","GSTIN","Branch ID","Client Folder URL","Notes","Status"];
function downloadCSV(filename,rows){const blob=new Blob(["\ufeff"+rows.map(r=>r.map(csvEscape).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function downloadTemplate(){downloadCSV("clients-import-format.csv",[IMPORT_HEADERS,IMPORT_FIELDS.map(k=>k==="status"?"Active":"")]);show("Import format downloaded.","success")}
function exportClients(){const rows=[IMPORT_HEADERS];const term=clean($("clientSearch").value).toLowerCase(),status=clean($("clientStatusFilter").value);const source=clients.filter(c=>{const search=!term||[c.clientId,c.clientName,c.mobile,c.gstin].some(v=>String(v||"").toLowerCase().includes(term));return search&&(!status||String(c.status||"")===status)});source.forEach(c=>rows.push(IMPORT_FIELDS.map(k=>c[k]||"")));downloadCSV(`clients-export-${new Date().toISOString().slice(0,10)}.csv`,rows);show(`${source.length} client${source.length===1?"":"s"} exported.","success")}
function parseCSV(text){const rows=[];let row=[],cell="",quoted=false;for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'){if(quoted&&next==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(cell);cell=""}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&next==='\n')i++;row.push(cell);if(row.some(x=>clean(x)))rows.push(row);row=[];cell=""}else cell+=ch}if(cell||row.length){row.push(cell);if(row.some(x=>clean(x)))rows.push(row)}return rows}
async function importClients(file){const text=await file.text(),rows=parseCSV(text);if(rows.length<2)throw Error("The CSV file has no client records.");const headers=rows[0].map(x=>clean(x).toLowerCase());const map=Object.fromEntries(IMPORT_FIELDS.map((f,i)=>[IMPORT_HEADERS[i].toLowerCase(),f]));const records=rows.slice(1).map(r=>{const o={};headers.forEach((h,i)=>{if(map[h])o[map[h]]=clean(r[i]||"")});return o}).filter(r=>r.clientName);if(!records.length)throw Error("No valid Client Name rows were found.");let imported=0,skipped=0;for(const r of records){try{const err=await validateImportRecord(r);if(err){skipped++;continue}const now=new Date().toISOString();await runTransaction(db,async tx=>{const x=await nextId(tx);tx.set(x.counter,{lastNumber:x.n,updatedAt:now},{merge:true});tx.set(doc(db,"clients",x.id),{...r,clientId:x.id,status:r.status||"Active",createdAt:now,updatedAt:now})});imported++}catch(e){console.warn("Skipped import row",e);skipped++}}localStorage.removeItem(CACHE);await load();show(`${imported} client${imported===1?"":"s"} imported${skipped?`; ${skipped} skipped due to validation/duplicates.`"."}`,imported?"success":"error")}
async function validateImportRecord(r){if(r.mobile&&!/^[0-9]{10}$/.test(r.mobile))return"Invalid mobile";if(r.pan&&!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(upper(r.pan)))return"Invalid PAN";if(r.gstin&&!/^[0-9A-Z]{15}$/.test(upper(r.gstin)))return"Invalid GSTIN";if(await duplicate("pan",upper(r.pan)))return"Duplicate PAN";if(await duplicate("gstin",upper(r.gstin)))return"Duplicate GSTIN";if(await duplicate("mobile",r.mobile))return"Duplicate mobile";if(await duplicate("email",r.email.toLowerCase()))return"Duplicate email";return""}

$("downloadTemplateBtn").addEventListener("click",downloadTemplate);$("exportClientBtn").addEventListener("click",exportClients);$("importClientBtn").addEventListener("click",()=>$("clientImportFile").click());$("clientImportFile").addEventListener("change",async e=>{const f=e.target.files?.[0];if(!f)return;try{show("Importing clients...","success");await importClients(f)}catch(err){console.error(err);show(err.message||"Unable to import CSV.")}finally{e.target.value=""}});
$("editClientBtn").addEventListener("click",editMode);$("deleteClientBtn").addEventListener("click",async()=>{if(!currentId)return;const c=find(currentId);if(!confirm(`Delete client "${c?.clientName||currentId}" (${currentId})?\n\nThis action cannot be undone.`))return;$("deleteClientBtn").disabled=true;try{await deleteDoc(doc(db,"clients",currentId));clients=clients.filter(x=>String(x.clientId||x.id)!==String(currentId));localStorage.setItem(CACHE,JSON.stringify(clients));show("Client deleted successfully.","success");setTimeout(openList,450)}catch(e){show(e.message||"Unable to delete client.")}finally{$("deleteClientBtn").disabled=false}});
form.addEventListener("submit",async e=>{e.preventDefault();if(mode==="new")await createClient();else if(mode==="edit"){if(await updateClient())setTimeout(openList,450)}});$("addClientBtn").addEventListener("click",openNew);$("cancelFormBtn").addEventListener("click",openList);$("pageBackBtn").addEventListener("click",()=>form.classList.contains("hidden")?history.back():openList());$("clientSearch").addEventListener("input",render);$("clientStatusFilter").addEventListener("change",render);$("clientFromDate").addEventListener("change",render);$("clientToDate").addEventListener("change",render);$("clientSortBtn").addEventListener("click",()=>$("clientSortMenu").classList.toggle("show"));$("clientFilterBtn").addEventListener("click",()=>$("clientFilterPanel").classList.toggle("show"));document.querySelectorAll(".sort-option").forEach(b=>b.addEventListener("click",()=>{sortMode=b.dataset.sort;document.querySelectorAll(".sort-option").forEach(x=>x.classList.remove("active"));b.classList.add("active");$("clientSortMenu").classList.remove("show");render()}));$("clientRefreshBtn").addEventListener("click",async()=>{$("clientRefreshBtn").classList.add("spinning");try{localStorage.removeItem(CACHE);await load()}finally{$("clientRefreshBtn").classList.remove("spinning")}});$("contactPickerBtn").addEventListener("click",pickContact);$("mobile").addEventListener("input",e=>e.target.value=e.target.value.replace(/\D/g,"").slice(0,10));$("pan").addEventListener("input",e=>e.target.value=e.target.value.toUpperCase());$("gstin").addEventListener("input",e=>e.target.value=e.target.value.toUpperCase());$("menuToggle")?.addEventListener("click",()=>document.body.classList.toggle("sidebar-open"));window.lucide?.createIcons();updateContactPicker();load();
</script>
</body>
</html>
