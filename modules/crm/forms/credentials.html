<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="../../../css/cm.css">
<link rel="stylesheet" href="../../../css/forms.css">
<link rel="stylesheet" href="../../../css/responsive.css">

<script src="https://unpkg.com/lucide@latest"></script>

<title>Credentials — CM | BIZODIT</title>

<style>
/* =========================================================
   CREDENTIALS
   Same compact style as Clients
   ========================================================= */

.credentials-page .form-section{margin-bottom:12px}

.list-toolbar{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:10px;
  flex-wrap:wrap
}

.list-search{
  flex:1 1 190px;
  min-width:150px;
  height:40px!important;
  border:1px solid #d7dce2!important;
  border-radius:8px!important;
  box-sizing:border-box
}

.list-icon-btn,.refresh-btn,.credential-action-btn,.form-view-action{
  width:40px;
  height:40px;
  border:1px solid #d7dce2;
  background:#fff;
  border-radius:8px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex:0 0 auto;
  box-sizing:border-box;
  color:#52606d
}

.list-icon-btn:hover,.refresh-btn:hover,
.credential-action-btn:hover,.form-view-action:hover{
  background:#f5f7f8
}

.refresh-btn.spinning svg{
  animation:spin .8s linear infinite
}

.add-form-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-width:72px;
  height:40px;
  padding:0 12px
}

.list-panel{display:block}
.list-panel.hidden,.entry-panel.hidden{display:none}

.data-list{
  display:flex;
  flex-direction:column;
  gap:7px
}

.data-row{
  border:1px solid #e0e3e7;
  border-radius:10px;
  padding:10px 12px;
  background:#fff
}

.data-row-main{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px
}

.data-row-content{
  min-width:0;
  flex:1;
  cursor:pointer
}

.data-row-title{
  font-weight:600;
  font-size:15px;
  color:#25313d
}

.data-row-sub{
  margin-top:3px;
  color:#727983;
  font-size:12px;
  line-height:1.45
}

.data-row-meta{
  text-align:right;
  font-size:12px;
  white-space:nowrap
}

.credential-id{
  color:#0b3b66;
  font-weight:600
}

.credential-portal{
  color:#25313d;
  font-weight:600
}

.credential-user{
  display:inline-flex;
  align-items:center;
  gap:5px;
  color:#465361
}

.credential-row-actions{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:5px;
  margin-top:7px;
  padding-top:6px;
  border-top:1px solid #edf0f2
}

.credential-action-btn{
  width:32px;
  height:32px;
  border-radius:7px;
  color:#5c6975
}

.credential-action-btn.copy{color:#0b3b66}
.credential-action-btn.edit{color:#52606d}
.credential-action-btn.delete{color:#b42318}

.empty-list{
  padding:28px 12px;
  text-align:center;
  color:#777;
  font-size:13px
}

/* Search / client dropdown */
.client-picker{
  position:relative
}

.client-picker-input-wrap{
  position:relative;
  display:flex;
  align-items:center
}

.client-picker-input{
  width:100%;
  padding-right:38px!important
}

.client-picker-icon{
  position:absolute;
  right:10px;
  color:#7b8791;
  pointer-events:none
}

.client-options{
  display:none;
  position:absolute;
  left:0;
  right:0;
  top:calc(100% + 4px);
  z-index:100;
  max-height:230px;
  overflow-y:auto;
  background:#fff;
  border:1px solid #d7dce2;
  border-radius:8px;
  box-shadow:0 8px 22px rgba(16,32,57,.12)
}

.client-options.show{display:block}

.client-option{
  padding:9px 11px;
  cursor:pointer;
  border-bottom:1px solid #f0f2f4
}

.client-option:last-child{border-bottom:0}

.client-option:hover{
  background:#f5f7f8
}

.client-option-name{
  font-size:13px;
  font-weight:600;
  color:#25313d
}

.client-option-sub{
  margin-top:2px;
  font-size:11px;
  color:#727983
}

.selected-client{
  display:none;
  margin-top:6px;
  padding:7px 9px;
  border:1px solid #dfe4e8;
  border-radius:7px;
  background:#f7f9fa;
  font-size:11px;
  color:#596571
}

.selected-client.show{display:block}

.copy-field{
  display:flex;
  align-items:center;
  gap:6px
}

.copy-field input{
  flex:1;
  min-width:0
}

.copy-field button{
  width:40px;
  height:40px;
  flex:0 0 40px;
  border:1px solid #d7dce2;
  border-radius:8px;
  background:#fff;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  color:#0b3b66
}

.copy-field button:hover{background:#f5f7f8}

.password-wrap{
  position:relative;
  display:flex;
  align-items:center
}

.password-wrap input{
  width:100%;
  padding-right:82px!important
}

.password-actions{
  position:absolute;
  right:4px;
  display:flex;
  gap:2px
}

.password-actions button{
  width:34px;
  height:34px;
  border:0;
  background:transparent;
  color:#697681;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center
}

.form-message{
  display:none;
  margin:0 0 14px;
  padding:10px 12px;
  border-radius:8px;
  font-size:13px;
  line-height:1.4
}

.form-message.show{display:block}
.form-message.error{
  background:#fff1f1;
  color:#a33b3b;
  border:1px solid #efcccc
}

.form-message.success{
  background:#eff8f2;
  color:#287a4e;
  border:1px solid #c9e3d2
}

.form-view-actions{
  display:flex;
  justify-content:flex-end;
  gap:6px;
  width:auto;
  height:auto;
  border:0;
  background:transparent;
  margin:-4px 0 10px
}

.form-view-action{
  width:38px;
  height:38px
}

.form-view-action.delete{color:#b42318}
.form-view-action.hidden{display:none}

.view-mode input:not([readonly]),
.view-mode select,
.view-mode textarea{
  background:#f7f8f9;
  color:#33404c;
  pointer-events:none
}

.view-mode .form-actions{display:none}

.form-mode-label{
  display:none;
  margin:-7px 0 14px;
  font-size:11px;
  color:#7b8791
}

.view-mode .form-mode-label{display:block}

.saving .save-icon{
  animation:spin .8s linear infinite
}

.secret-note{
  font-size:11px;
  color:#7b8791;
  margin-top:5px
}

.detail-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px
}

.detail-box{
  border:1px solid #e3e7ea;
  border-radius:8px;
  padding:9px;
  background:#fafbfc
}

.detail-label{
  display:block;
  font-size:10px;
  color:#7b8791;
  margin-bottom:3px
}

.detail-value{
  font-size:13px;
  font-weight:600;
  color:#25313d;
  word-break:break-word
}

@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:650px){
  .list-toolbar{gap:6px}
  .list-search{flex:1 1 calc(100% - 95px)}
  .add-form-btn{margin-left:auto}
  .data-row{padding:9px 11px}
  .detail-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header class="cm-header">
  <div class="cm-header-inner">
    <div class="cm-header-left">
      <button class="menu-toggle" id="menuToggle" type="button">
        <i data-lucide="menu"></i>
      </button>
      <div class="cm-brand">
        <div class="cm-logo">CM</div>
        <div class="cm-brand-title">CM | BIZODIT</div>
      </div>
    </div>
  </div>
</header>

<main class="main">
<div class="page">
<div class="form-page credentials-page">

<section class="module-header">
  <div class="module-header-left">
    <button class="back-btn" id="pageBackBtn" type="button">
      <i data-lucide="arrow-left"></i>
    </button>

    <div class="module-title">
      <h1>Credentials</h1>
      <p>Manage client portal credentials securely</p>
      <div class="report-as-on">
        Date : <strong id="presentDate">--</strong>
      </div>
    </div>
  </div>
</section>

<!-- =======================================================
     LIST
     ======================================================= -->
<div id="credentialListPanel" class="form-section list-panel">

  <div class="list-toolbar">

    <input
      id="credentialSearch"
      class="list-search"
      type="search"
      placeholder="Search client, ID, portal, username..."
      autocomplete="off"
    >

    <button
      id="credentialRefreshBtn"
      class="refresh-btn"
      type="button"
      title="Refresh"
    >
      <i data-lucide="refresh-cw"></i>
    </button>

    <button
      id="addCredentialBtn"
      class="btn btn-primary add-form-btn"
      type="button"
    >
      <i data-lucide="plus"></i>Add
    </button>

  </div>

  <div id="credentialList" class="data-list">
    <div class="empty-list">Loading credentials...</div>
  </div>

</div>

<!-- =======================================================
     ENTRY
     ======================================================= -->
<form
  class="form-section entry-panel hidden"
  id="credentialForm"
>

  <div class="form-view-actions">

    <button
      id="editCredentialBtn"
      class="form-view-action hidden"
      type="button"
      title="Edit credential"
    >
      <i data-lucide="pencil"></i>
    </button>

    <button
      id="deleteCredentialBtn"
      class="form-view-action delete hidden"
      type="button"
      title="Delete credential"
    >
      <i data-lucide="trash-2"></i>
    </button>

  </div>

  <h2 id="credentialFormTitle">Credential Entry</h2>

  <div id="formModeLabel" class="form-mode-label">
    View mode — tap Edit to modify this credential.
  </div>

  <div id="formMessage" class="form-message"></div>

  <div class="form-grid">

    <!-- Document ID -->
    <div class="field">
      <label>Credential ID / Doc ID</label>

      <div class="client-id-box">
        <input
          id="credentialId"
          type="text"
          readonly
          placeholder="CR-0001"
        >
        <span id="idStatus" class="id-status"></span>
      </div>
    </div>

    <!-- Client picker -->
    <div class="field full">
      <label>Client <span class="required">*</span></label>

      <div class="client-picker">

        <div class="client-picker-input-wrap">

          <input
            id="clientSearchInput"
            class="client-picker-input"
            type="text"
            placeholder="Search client name or Client ID..."
            autocomplete="off"
          >

          <span class="client-picker-icon">
            <i data-lucide="search" width="16" height="16"></i>
          </span>

        </div>

        <div id="clientOptions" class="client-options"></div>

      </div>

      <input id="clientId" type="hidden">

      <div id="selectedClient" class="selected-client"></div>

    </div>

    <!-- Portal -->
    <div class="field">
      <label>Portal Name <span class="required">*</span></label>
      <input
        id="portalName"
        type="text"
        placeholder="GST / Income Tax / MCA..."
      >
    </div>

    <!-- Portal No -->
    <div class="field">
      <label>Portal No</label>

      <div class="copy-field">
        <input
          id="portalNo"
          type="text"
          placeholder="Portal / registration number"
        >

        <button
          id="copyPortalNoBtn"
          type="button"
          title="Copy Portal No"
        >
          <i data-lucide="copy"></i>
        </button>
      </div>
    </div>

    <!-- Username -->
    <div class="field">
      <label>User Name <span class="required">*</span></label>

      <div class="copy-field">
        <input
          id="userName"
          type="text"
          placeholder="Portal username / login ID"
          autocomplete="off"
        >

        <button
          id="copyUserNameBtn"
          type="button"
          title="Copy User Name"
        >
          <i data-lucide="copy"></i>
        </button>
      </div>
    </div>

    <!-- Password -->
    <div class="field">
      <label>Password <span class="required">*</span></label>

      <div class="password-wrap">

        <input
          id="password"
          type="password"
          placeholder="Portal password"
          autocomplete="new-password"
        >

        <div class="password-actions">

          <button
            id="togglePasswordBtn"
            type="button"
            title="Show / hide password"
          >
            <i data-lucide="eye"></i>
          </button>

          <button
            id="copyPasswordBtn"
            type="button"
            title="Copy Password"
          >
            <i data-lucide="copy"></i>
          </button>

        </div>

      </div>

      <div class="secret-note">
        Password is stored in Firestore exactly as entered.
      </div>
    </div>

    <!-- Narration -->
    <div class="field full">
      <label>Narration</label>
      <textarea
        id="narration"
        rows="3"
        placeholder="Additional notes about this credential..."
      ></textarea>
    </div>

  </div>

  <div class="form-actions">

    <button
      type="button"
      class="btn btn-secondary"
      id="cancelFormBtn"
    >
      Cancel
    </button>

    <button
      id="saveBtn"
      class="btn btn-primary"
      type="submit"
    >
      <i class="save-icon" data-lucide="save"></i>
      <span class="save-text">Save Credential</span>
    </button>

  </div>

</form>

</div>
</div>
</main>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">

    <a class="bottom-item" href="../../../index.html">
      <i data-lucide="house"></i>
      <span>HOME</span>
    </a>

    <a class="bottom-item" href="../../crm/crm.html">
      <i data-lucide="users-round"></i>
      <span>CRM</span>
    </a>

    <a class="bottom-item" href="../../accounts/accounts.html">
      <i data-lucide="wallet"></i>
      <span>ACCOUNTS</span>
    </a>

    <a class="bottom-item" href="../../settings/settings.html">
      <i data-lucide="settings-2"></i>
      <span>SETTINGS</span>
    </a>

  </div>
</nav>

<script type="module">

/* =========================================================
   FIREBASE
   ========================================================= */

import {
  initializeApp,
  getApps,
  getApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  getDocs,
  setDoc,
  updateDoc,
  deleteDoc,
  collection,
  query,
  limit,
  runTransaction
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCXyKSTlmlzkYnH2LW408cVVWV1CPvlfBo",
  authDomain: "cmfilings-6a37c.firebaseapp.com",
  projectId: "cmfilings-6a37c",
  storageBucket: "cmfilings-6a37c.firebasestorage.app",
  messagingSenderId: "138705123778",
  appId: "1:138705123778:web:9561bff9f0f5d89bb6fe5b",
  measurementId: "G-09DM4NZF8D"
};

const firebaseApp =
  getApps().length
    ? getApp()
    : initializeApp(firebaseConfig);

const db = getFirestore(firebaseApp);

/* =========================================================
   STATE
   ========================================================= */

const $ = id => document.getElementById(id);

const form = $("credentialForm");
const listPanel = $("credentialListPanel");
const list = $("credentialList");
const msg = $("formMessage");
const save = $("saveBtn");

const CACHE = "bizodit_credentials_cache_v1";
const CLIENT_CACHE = "bizodit_clients_cache_v5";

let credentials = [];
let clients = [];
let currentId = null;
let mode = "new";

/* =========================================================
   DATE
   ========================================================= */

$("presentDate").textContent =
  new Intl.DateTimeFormat("en-IN", {
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  }).format(new Date());

/* =========================================================
   HELPERS
   ========================================================= */

const clean = v => String(v ?? "").trim();

const esc = v => String(v ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

function icons(){
  if(window.lucide){
    try{
      window.lucide.createIcons();
    }catch(e){}
  }
}

function showMessage(text,type="error"){
  msg.textContent = text;
  msg.className = `form-message show ${type}`;
}

function clearMessage(){
  msg.textContent = "";
  msg.className = "form-message";
}

function data(){

  return {
    credentialID: clean($("credentialId").value),

    clientId: clean($("clientId").value),

    clientName:
      clean($("clientSearchInput").value) ||
      clean($("selectedClient").dataset.clientName),

    portalName: clean($("portalName").value),

    portalNo: clean($("portalNo").value),

    userName: clean($("userName").value),

    password: $("password").value || "",

    narration: clean($("narration").value)
  };
}

/* =========================================================
   CLIENTS
   ========================================================= */

async function loadClients(){

  try{

    const cached =
      JSON.parse(
        localStorage.getItem(CLIENT_CACHE) || "[]"
      );

    if(Array.isArray(cached))
      clients = cached;

  }catch(e){}

  try{

    const snap = await getDocs(
      query(
        collection(db,"clients"),
        limit(500)
      )
    );

    clients = snap.docs
      .map(d => ({
        id:d.id,
        ...d.data()
      }))
      .filter(c =>
        c.clientId &&
        c.clientName
      );

    clients.sort((a,b) =>
      String(a.clientName || "")
        .localeCompare(
          String(b.clientName || "")
        )
    );

    localStorage.setItem(
      CLIENT_CACHE,
      JSON.stringify(clients)
    );

  }catch(e){

    console.error(
      "CLIENT LOAD ERROR",
      e
    );
  }
}

function findClient(id){

  return clients.find(c =>
    String(c.clientId || c.id) ===
    String(id)
  );
}

function showClientOptions(){

  if(mode === "view")
    return;

  const term =
    clean($("clientSearchInput").value)
      .toLowerCase();

  const options =
    clients.filter(c => {

      if(!term) return true;

      return [
        c.clientId,
        c.clientName,
        c.legalName,
        c.mobile,
        c.gstin,
        c.pan
      ].some(v =>
        String(v || "")
          .toLowerCase()
          .includes(term)
      );

    }).slice(0,30);

  if(!options.length){

    $("clientOptions").innerHTML =
      `<div class="client-option">
        <div class="client-option-name">
          No client found
        </div>
      </div>`;

  }else{

    $("clientOptions").innerHTML =
      options.map(c => `

        <div
          class="client-option"
          data-client-id="${esc(c.clientId || c.id)}"
        >

          <div class="client-option-name">
            ${esc(c.clientName)}
          </div>

          <div class="client-option-sub">
            ${esc(c.clientId || c.id)}
            ${c.mobile ? " · " + esc(c.mobile) : ""}
            ${c.gstin ? " · " + esc(c.gstin) : ""}
          </div>

        </div>

      `).join("");
  }

  $("clientOptions").classList.add("show");

  $("clientOptions")
    .querySelectorAll("[data-client-id]")
    .forEach(option => {

      option.addEventListener(
        "click",
        () => selectClient(
          option.dataset.clientId
        )
      );

    });

  icons();
}

function selectClient(id){

  const c = findClient(id);

  if(!c) return;

  $("clientId").value =
    c.clientId || c.id || "";

  $("clientSearchInput").value =
    c.clientName || "";

  $("selectedClient").dataset.clientName =
    c.clientName || "";

  $("selectedClient").innerHTML = `
    <strong>${esc(c.clientName || "")}</strong>
    · ${esc(c.clientId || c.id || "")}
    ${c.mobile ? " · " + esc(c.mobile) : ""}
  `;

  $("selectedClient").classList.add("show");

  $("clientOptions").classList.remove("show");

  /*
   * Auto-fill the available client master information
   * conceptually associated with the credential.
   *
   * The credential document stores clientId/clientName,
   * while client master remains in the clients collection.
   */
  $("clientSearchInput").setAttribute(
    "data-selected",
    c.clientId || c.id || ""
  );

  clearMessage();
}

$("clientSearchInput")
  .addEventListener(
    "focus",
    showClientOptions
  );

$("clientSearchInput")
  .addEventListener(
    "input",
    () => {

      /*
       * Changing the text clears the previous selection.
       * User must choose a client from the dropdown.
       */
      $("clientId").value = "";

      $("selectedClient")
        .classList.remove("show");

      showClientOptions();
    }
  );

document.addEventListener(
  "click",
  e => {

    if(
      !e.target.closest(".client-picker")
    ){
      $("clientOptions")
        .classList.remove("show");
    }

  }
);

/* =========================================================
   FORM MODES
   ========================================================= */

function setInputs(disabled){

  form
    .querySelectorAll(
      "input,select,textarea"
    )
    .forEach(x => {
      x.disabled = disabled;
    });

  $("credentialId").readOnly = true;

  save.disabled = disabled;
}

function viewMode(){

  mode = "view";

  form.classList.add("view-mode");

  $("credentialFormTitle").textContent =
    "Credential Details";

  $("editCredentialBtn")
    .classList.remove("hidden");

  $("deleteCredentialBtn")
    .classList.remove("hidden");

  setInputs(true);

  $("cancelFormBtn").textContent =
    "Back";

  clearMessage();
}

function editMode(){

  mode = "edit";

  form.classList.remove("view-mode");

  $("credentialFormTitle").textContent =
    "Edit Credential";

  $("editCredentialBtn")
    .classList.add("hidden");

  $("deleteCredentialBtn")
    .classList.remove("hidden");

  setInputs(false);

  $("cancelFormBtn").textContent =
    "Cancel";

  clearMessage();
}

function newMode(){

  mode = "new";
  currentId = null;

  form.classList.remove("view-mode");

  $("credentialFormTitle").textContent =
    "Credential Entry";

  $("editCredentialBtn")
    .classList.add("hidden");

  $("deleteCredentialBtn")
    .classList.add("hidden");

  form.reset();

  $("credentialId").value = "";
  $("clientId").value = "";

  $("selectedClient").innerHTML = "";
  $("selectedClient").classList.remove("show");
  $("selectedClient").dataset.clientName = "";

  $("clientSearchInput")
    .removeAttribute("data-selected");

  $("idStatus").textContent = "";

  setInputs(false);

  $("cancelFormBtn").textContent =
    "Cancel";

  clearMessage();

  $("password").type = "password";

  icons();
}

/* =========================================================
   FILL
   ========================================================= */

function fill(c){

  currentId =
    c.credentialID ||
    c.id ||
    "";

  $("credentialId").value =
    c.credentialID ||
    c.id ||
    "";

  $("clientId").value =
    c.clientId || "";

  $("clientSearchInput").value =
    c.clientName || "";

  $("selectedClient").dataset.clientName =
    c.clientName || "";

  if(c.clientName){

    $("selectedClient").innerHTML = `
      <strong>${esc(c.clientName)}</strong>
      · ${esc(c.clientId || "")}
    `;

    $("selectedClient")
      .classList.add("show");
  }

  $("portalName").value =
    c.portalName || "";

  $("portalNo").value =
    c.portalNo || "";

  $("userName").value =
    c.userName || "";

  $("password").value =
    c.password || "";

  $("narration").value =
    c.narration || "";

  $("password").type = "password";

  icons();
}

/* =========================================================
   LOAD CREDENTIALS
   ========================================================= */

async function load(){

  try{

    const cached =
      JSON.parse(
        localStorage.getItem(CACHE) || "[]"
      );

    if(Array.isArray(cached) && cached.length){

      credentials = cached;
      render();
    }

  }catch(e){}

  try{

    const snap = await getDocs(
      query(
        collection(db,"credentials"),
        limit(500)
      )
    );

    credentials = snap.docs
      .map(d => ({
        id:d.id,
        ...d.data()
      }));

    credentials.sort((a,b) =>
      String(b.createdAt || "")
        .localeCompare(
          String(a.createdAt || "")
        )
    );

    localStorage.setItem(
      CACHE,
      JSON.stringify(credentials)
    );

    render();

  }catch(e){

    console.error(
      "CREDENTIAL LOAD ERROR",
      e
    );

    if(!credentials.length){

      list.innerHTML = `
        <div class="empty-list">
          <strong>Unable to load credentials.</strong><br>
          <span style="font-size:11px">
            ${esc(
              e?.message ||
              "Firestore connection error"
            )}
          </span>
        </div>
      `;
    }
  }
}

/* =========================================================
   LIST
   ========================================================= */

function render(){

  const term =
    clean($("credentialSearch").value)
      .toLowerCase();

  let rows =
    credentials.filter(c => {

      return !term ||
        [
          c.credentialID,
          c.clientId,
          c.clientName,
          c.portalName,
          c.portalNo,
          c.userName
        ].some(v =>
          String(v || "")
            .toLowerCase()
            .includes(term)
        );

    });

  if(!rows.length){

    list.innerHTML =
      '<div class="empty-list">No credentials found.</div>';

    return;
  }

  list.innerHTML =
    rows.map(c => {

      const id =
        c.credentialID ||
        c.id ||
        "";

      const username =
        c.userName || "—";

      return `

        <div class="data-row">

          <div class="data-row-main">

            <div
              class="data-row-content"
              data-open="${esc(id)}"
            >

              <div class="data-row-title">

                <span class="credential-portal">
                  ${esc(c.portalName || "Portal")}
                </span>

                <span
                  class="credential-id"
                  style="font-size:12px;margin-left:5px"
                >
                  ${esc(id)}
                </span>

              </div>

              <div class="data-row-sub">

                ${esc(c.clientName || "No client")}
                ·
                ${esc(c.clientId || "—")}
                <br>

                <span class="credential-user">
                  <i data-lucide="user-round"
                     width="12" height="12"></i>
                  ${esc(username)}
                </span>

              </div>

            </div>

          </div>

          <div class="credential-row-actions">

            <button
              class="credential-action-btn copy"
              data-copy-user="${esc(id)}"
              type="button"
              title="Copy User Name"
            >
              <i data-lucide="copy"></i>
            </button>

            <button
              class="credential-action-btn copy"
              data-copy-password="${esc(id)}"
              type="button"
              title="Copy Password"
            >
              <i data-lucide="key-round"></i>
            </button>

            <button
              class="credential-action-btn copy"
              data-copy-portal="${esc(id)}"
              type="button"
              title="Copy Portal No"
            >
              <i data-lucide="hash"></i>
            </button>

            <button
              class="credential-action-btn edit"
              data-open="${esc(id)}"
              type="button"
              title="Open credential"
            >
              <i data-lucide="arrow-up-right"></i>
            </button>

          </div>

        </div>
      `;

    }).join("");

  icons();

  list.querySelectorAll("[data-open]")
    .forEach(btn => {

      btn.addEventListener(
        "click",
        e => {

          e.stopPropagation();

          openView(
            btn.dataset.open
          );
        }
      );

    });

  list.querySelectorAll("[data-copy-user]")
    .forEach(btn => {

      btn.addEventListener(
        "click",
        e => {

          e.stopPropagation();

          copyCredential(
            btn.dataset.copyUser,
            "userName"
          );
        }
      );

    });

  list.querySelectorAll("[data-copy-password]")
    .forEach(btn => {

      btn.addEventListener(
        "click",
        e => {

          e.stopPropagation();

          copyCredential(
            btn.dataset.copyPassword,
            "password"
          );
        }
      );

    });

  list.querySelectorAll("[data-copy-portal]")
    .forEach(btn => {

      btn.addEventListener(
        "click",
        e => {

          e.stopPropagation();

          copyCredential(
            btn.dataset.copyPortal,
            "portalNo"
          );
        }
      );

    });
}

function findCredential(id){

  return credentials.find(c =>
    String(
      c.credentialID || c.id || ""
    ) === String(id)
  );
}

/* =========================================================
   OPEN
   ========================================================= */

async function openView(id){

  const cached =
    findCredential(id);

  if(cached){

    fill(cached);

    listPanel.classList.add("hidden");
    form.classList.remove("hidden");

    viewMode();

    scrollTo(0,0);
  }

  try{

    const snap =
      await getDoc(
        doc(db,"credentials",id)
      );

    if(!snap.exists())
      throw Error(
        "Credential record no longer exists."
      );

    fill({
      id:snap.id,
      ...snap.data()
    });

    viewMode();

  }catch(e){

    if(!cached)
      showMessage(
        e.message ||
        "Unable to open credential."
      );
  }
}

function openList(){

  form.classList.add("hidden");
  listPanel.classList.remove("hidden");

  newMode();
  render();

  scrollTo(0,0);
}

function openNew(){

  newMode();

  listPanel.classList.add("hidden");
  form.classList.remove("hidden");

  scrollTo(0,0);
}

/* =========================================================
   AUTO DOCUMENT ID
   CR-0001, CR-0002...
   ========================================================= */

async function nextCredentialId(tx){

  const counter =
    doc(
      db,
      "counters",
      "credentialCounter"
    );

  const snap =
    await tx.get(counter);

  let n = 1;

  if(snap.exists()){

    const last =
      Number(
        snap.data().lastNumber
      );

    if(
      Number.isFinite(last) &&
      last >= 1
    ){
      n = last + 1;
    }
  }

  while(true){

    const id =
      `CR-${String(n).padStart(4,"0")}`;

    const existing =
      await tx.get(
        doc(
          db,
          "credentials",
          id
        )
      );

    if(!existing.exists()){

      return {
        counter,
        id,
        n
      };
    }

    n++;
  }
}

/* =========================================================
   VALIDATION
   ========================================================= */

function validate(){

  if(!clean($("clientId").value))
    return "Please select a client.";

  if(!clean($("portalName").value))
    return "Portal Name is required.";

  if(!clean($("userName").value))
    return "User Name is required.";

  if(!$("password").value)
    return "Password is required.";

  return "";
}

/* =========================================================
   CREATE
   ========================================================= */

async function createCredential(){

  const error =
    validate();

  if(error){

    showMessage(error);
    return;
  }

  save.disabled = true;

  form.classList.add("saving");

  $("saveBtn")
    .querySelector(".save-text")
    .textContent = "Saving...";

  $("idStatus").textContent = "…";

  try{

    const selected =
      findClient(
        $("clientId").value
      );

    if(!selected)
      throw Error(
        "Selected client was not found in Clients."
      );

    const now =
      new Date().toISOString();

    let made = "";

    await runTransaction(
      db,
      async tx => {

        const r =
          await nextCredentialId(tx);

        made = r.id;

        tx.set(
          r.counter,
          {
            lastNumber:r.n,
            updatedAt:now
          },
          {merge:true}
        );

        tx.set(
          doc(
            db,
            "credentials",
            made
          ),
          {
            credentialID:made,

            clientId:
              selected.clientId ||
              selected.id,

            clientName:
              selected.clientName || "",

            portalName:
              clean($("portalName").value),

            portalNo:
              clean($("portalNo").value),

            userName:
              clean($("userName").value),

            password:
              $("password").value || "",

            narration:
              clean($("narration").value),

            createdAt:now,
            updatedAt:now
          }
        );

      }
    );

    $("credentialId").value = made;

    $("idStatus").textContent = "✓";

    showMessage(
      `Credential ${made} saved successfully.`,
      "success"
    );

    localStorage.removeItem(CACHE);

    setTimeout(() => {

      openList();
      load();

    },500);

  }catch(e){

    console.error(e);

    showMessage(
      e.message ||
      "Unable to save credential."
    );

    $("idStatus").textContent = "";

  }finally{

    save.disabled = false;

    form.classList.remove("saving");

    $("saveBtn")
      .querySelector(".save-text")
      .textContent =
        "Save Credential";
  }
}

/* =========================================================
   UPDATE
   ========================================================= */

async function updateCredential(){

  if(!currentId)
    return false;

  const error =
    validate();

  if(error){

    showMessage(error);
    return false;
  }

  const selected =
    findClient(
      $("clientId").value
    );

  if(!selected){

    showMessage(
      "Please select a valid client."
    );

    return false;
  }

  const now =
    new Date().toISOString();

  save.disabled = true;

  form.classList.add("saving");

  try{

    await updateDoc(
      doc(
        db,
        "credentials",
        currentId
      ),
      {
        credentialID:currentId,

        clientId:
          selected.clientId ||
          selected.id,

        clientName:
          selected.clientName || "",

        portalName:
          clean($("portalName").value),

        portalNo:
          clean($("portalNo").value),

        userName:
          clean($("userName").value),

        password:
          $("password").value || "",

        narration:
          clean($("narration").value),

        updatedAt:now
      }
    );

    const index =
      credentials.findIndex(
        c =>
          String(
            c.credentialID || c.id
          ) === String(currentId)
      );

    const updated = {
      ...(index >= 0
        ? credentials[index]
        : {}),
      credentialID:currentId,
      clientId:
        selected.clientId ||
        selected.id,
      clientName:
        selected.clientName || "",
      portalName:
        clean($("portalName").value),
      portalNo:
        clean($("portalNo").value),
      userName:
        clean($("userName").value),
      password:
        $("password").value || "",
      narration:
        clean($("narration").value),
      updatedAt:now
    };

    if(index >= 0)
      credentials[index] = updated;
    else
      credentials.push(updated);

    localStorage.setItem(
      CACHE,
      JSON.stringify(credentials)
    );

    showMessage(
      "Credential updated successfully.",
      "success"
    );

    return true;

  }catch(e){

    console.error(e);

    showMessage(
      e.message ||
      "Unable to update credential."
    );

    return false;

  }finally{

    save.disabled = false;
    form.classList.remove("saving");
  }
}

/* =========================================================
   DELETE
   ========================================================= */

$("deleteCredentialBtn")
  .addEventListener(
    "click",
    async () => {

      if(!currentId)
        return;

      const c =
        findCredential(currentId);

      if(!confirm(
        `Delete credential "${currentId}" for "${c?.clientName || "client"}"?\n\nThis action cannot be undone.`
      )){
        return;
      }

      $("deleteCredentialBtn")
        .disabled = true;

      try{

        await deleteDoc(
          doc(
            db,
            "credentials",
            currentId
          )
        );

        credentials =
          credentials.filter(
            x =>
              String(
                x.credentialID || x.id
              ) !== String(currentId)
          );

        localStorage.setItem(
          CACHE,
          JSON.stringify(credentials)
        );

        openList();

      }catch(e){

        showMessage(
          e.message ||
          "Unable to delete credential."
        );

      }finally{

        $("deleteCredentialBtn")
          .disabled = false;
      }

    }
  );

/* =========================================================
   FORM EVENTS
   ========================================================= */

$("editCredentialBtn")
  .addEventListener(
    "click",
    editMode
  );

form.addEventListener(
  "submit",
  async e => {

    e.preventDefault();

    if(mode === "new"){

      await createCredential();

    }else if(mode === "edit"){

      if(await updateCredential())
        setTimeout(
          openList,
          500
        );
    }
  }
);

$("addCredentialBtn")
  .addEventListener(
    "click",
    openNew
  );

$("cancelFormBtn")
  .addEventListener(
    "click",
    openList
  );

$("pageBackBtn")
  .addEventListener(
    "click",
    () => {

      if(
        form.classList.contains("hidden")
      ){
        history.back();
      }else{
        openList();
      }
    }
  );

/* =========================================================
   COPY
   ========================================================= */

async function copyText(value){

  if(!value){

    showMessage(
      "Nothing to copy."
    );

    return;
  }

  try{

    await navigator.clipboard.writeText(
      String(value)
    );

    showMessage(
      "Copied to clipboard.",
      "success"
    );

  }catch(e){

    /*
     * Fallback for browsers where
     * navigator.clipboard is unavailable.
     */
    const ta =
      document.createElement("textarea");

    ta.value = String(value);

    document.body.appendChild(ta);

    ta.select();

    try{
      document.execCommand("copy");

      showMessage(
        "Copied to clipboard.",
        "success"
      );

    }catch(err){

      showMessage(
        "Unable to copy automatically."
      );

    }

    ta.remove();
  }
}

async function copyCredential(
  id,
  field
){

  const c =
    findCredential(id);

  if(!c){

    showMessage(
      "Credential not found."
    );

    return;
  }

  await copyText(
    c[field] || ""
  );
}

$("copyUserNameBtn")
  .addEventListener(
    "click",
    () =>
      copyText(
        $("userName").value
      )
  );

$("copyPasswordBtn")
  .addEventListener(
    "click",
    () =>
      copyText(
        $("password").value
      )
  );

$("copyPortalNoBtn")
  .addEventListener(
    "click",
    () =>
      copyText(
        $("portalNo").value
      )
  );

/* =========================================================
   PASSWORD VISIBILITY
   ========================================================= */

$("togglePasswordBtn")
  .addEventListener(
    "click",
    () => {

      const input =
        $("password");

      const visible =
        input.type === "text";

      input.type =
        visible
          ? "password"
          : "text";

      $("togglePasswordBtn")
        .innerHTML =
          `<i data-lucide="${
            visible
              ? "eye"
              : "eye-off"
          }"></i>`;

      icons();
    }
  );

/* =========================================================
   REFRESH / MENU
   ========================================================= */

$("credentialRefreshBtn")
  .addEventListener(
    "click",
    async () => {

      $("credentialRefreshBtn")
        .classList.add("spinning");

      try{

        localStorage.removeItem(CACHE);

        await Promise.all([
          loadClients(),
          load()
        ]);

      }finally{

        $("credentialRefreshBtn")
          .classList.remove("spinning");
      }
    }
  );

$("credentialSearch")
  .addEventListener(
    "input",
    render
  );

$("menuToggle")?.addEventListener(
  "click",
  () =>
    document.body.classList.toggle(
      "sidebar-open"
    )
);

/* =========================================================
   START
   ========================================================= */

newMode();

icons();

await loadClients();

await load();

</script>
