<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="stylesheet" href="../../../css/cm.css">
  <link rel="stylesheet" href="../../../css/forms.css">
  <link rel="stylesheet" href="../../../css/responsive.css">

  <script src="https://unpkg.com/lucide@latest"></script>

  <title>Credentials — CM | BIZODIT</title>

  <style>
    .id-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .id-box input {
      flex: 1;
    }

    .id-status {
      min-width: 24px;
      text-align: center;
      font-size: 14px;
    }

    /* Toolbar matching compliance.html and clients.html */
    .list-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .list-search {
      flex: 1 1 160px;
      min-width: 140px;
      height: 38px;
      border: 1px solid #d7dce2;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 13px;
      outline: none;
      background: #fff;
      box-sizing: border-box;
      transition: border-color .15s;
    }

    .list-search:focus {
      border-color: #0b3b66;
    }

    .refresh-btn,
    .list-icon-btn,
    .form-view-action {
      width: 38px;
      height: 38px;
      border: 1px solid #d7dce2;
      background: #fff;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex: 0 0 auto;
      color: #4b5563;
      box-sizing: border-box;
    }

    .refresh-btn.spinning svg {
      animation: spin .8s linear infinite;
    }

    .list-icon-btn.active {
      background: #f1f4f7;
    }

    .add-form-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-width: 68px;
      height: 38px;
      padding: 0 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      box-sizing: border-box;
    }

    .list-panel {
      display: block;
    }

    .list-panel.hidden,
    .entry-panel.hidden {
      display: none;
    }

    .data-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Card Item */
    .data-row {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
    }

    .data-row-main {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .data-row-content {
      min-width: 0;
      flex: 1;
      cursor: pointer;
    }

    .data-row-title {
      font-weight: 600;
      font-size: 14px;
      color: #1e293b;
    }

    .data-row-sub {
      margin-top: 3px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.4;
    }

    .data-row-meta {
      text-align: right;
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    /* Badges */
    .portal-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 500;
      background: #eff6ff;
      color: #1e40af;
      border: 1px solid #dbeafe;
    }

    /* Action Toolbar */
    .credential-row-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px solid #f1f5f9;
    }

    .credential-action-btn {
      width: 30px;
      height: 30px;
      border: 1px solid #e2e8f0;
      background: #fafafa;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      text-decoration: none;
      cursor: pointer;
    }

    .credential-action-btn svg {
      width: 15px;
      height: 15px;
    }

    .credential-action-btn.call {
      color: #0b3b66;
    }

    .credential-action-btn.whatsapp {
      color: #15803d;
    }

    .credential-action-btn.open-btn {
      color: #334155;
    }

    .empty-list {
      padding: 28px 12px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    .filter-panel {
      display: none;
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid #e0e3e7;
      border-radius: 10px;
      background: #fafbfc;
    }

    .filter-panel.show {
      display: block;
    }

    .filter-panel .field {
      margin-bottom: 8px;
    }

    .sort-menu {
      display: none;
      position: relative;
    }

    .sort-menu.show {
      display: block;
      margin-bottom: 10px;
    }

    .sort-options {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .sort-option {
      border: 1px solid #d7dce2;
      background: #fff;
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .sort-option.active {
      background: #eef2f5;
      font-weight: 600;
    }

    .password-toggle-box {
      display: flex;
      gap: 6px;
    }

    .password-toggle-box input {
      flex: 1;
    }

    .form-message {
      display: none;
      margin: 0 0 14px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
    }

    .form-message.show {
      display: block;
    }

    .form-message.error {
      background: #fff1f1;
      color: #b42318;
      border: 1px solid #f3c2c2;
    }

    .form-message.success {
      background: #effaf3;
      color: #16723a;
      border: 1px solid #b9e4c7;
    }

    .client-loading {
      opacity: .65;
    }

    .saving .save-icon {
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<header class="cm-header">
  <div class="cm-header-inner">
    <div class="cm-header-left">
      <button class="menu-toggle" id="menuToggle" type="button">
        <i data-lucide="menu"></i>
      </button>

      <div class="cm-brand">
        <div class="cm-logo">CM</div>
        <div class="cm-brand-title">CM | BIZODIT</div>
      </div>
    </div>
  </div>
</header>

<main class="main">
  <div class="page">
    <div class="form-page">

      <section class="module-header">
        <div class="module-header-left">
          <button class="back-btn" id="pageBackBtn" type="button">
            <i data-lucide="arrow-left"></i>
          </button>

          <div class="module-title">
            <h1>Credentials</h1>
            <p>Track client login & portal credentials</p>
            <div class="report-as-on">
              Date : <strong id="presentDate">--</strong>
            </div>
          </div>
        </div>
      </section>

      <div id="credentialListPanel" class="form-section list-panel">
        <div class="list-toolbar">
          <input id="credentialSearch" class="list-search" type="search" placeholder="Search credentials..." autocomplete="off">
          <button id="credentialSortBtn" class="list-icon-btn" type="button" title="Sort"><i data-lucide="arrow-up-down"></i></button>
          <button id="credentialFilterBtn" class="list-icon-btn" type="button" title="Filter"><i data-lucide="list-filter"></i></button>
          <button id="credentialRefreshBtn" class="refresh-btn" type="button" title="Refresh"><i data-lucide="refresh-cw"></i></button>
          <button id="exportCredentialBtn" class="list-icon-btn" type="button" title="Export CSV"><i data-lucide="download"></i></button>
          <button id="importCredentialBtn" class="list-icon-btn" type="button" title="Import CSV"><i data-lucide="upload"></i></button>
          <button id="downloadTemplateBtn" class="list-icon-btn" type="button" title="Download Template"><i data-lucide="file-spreadsheet"></i></button>
          <input type="file" id="csvFileInput" accept=".csv" style="display:none">
          <button id="addCredentialBtn" class="btn btn-primary add-form-btn" type="button"><i data-lucide="plus"></i>Add</button>
        </div>

        <div id="credentialSortMenu" class="sort-menu">
          <div class="sort-options">
            <button class="sort-option active" data-sort="id">ID (Auto)</button>
            <button class="sort-option" data-sort="client">Client Name</button>
            <button class="sort-option" data-sort="portal">Portal Name</button>
            <button class="sort-option" data-sort="newest">Newest</button>
          </div>
        </div>

        <div id="credentialFilterPanel" class="filter-panel">
          <div class="field">
            <label>Portal</label>
            <select id="credentialPortalFilter">
              <option value="">All Portals</option>
              <option value="GST">GST</option>
              <option value="Income Tax">Income Tax</option>
              <option value="MCA">MCA</option>
              <option value="TRACES">TRACES</option>
              <option value="EPFO">EPFO</option>
              <option value="ESIC">ESIC</option>
              <option value="Tally">Tally</option>
              <option value="Bank">Bank</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div id="credentialList" class="data-list"><div class="empty-list">Loading credentials...</div></div>
      </div>

      <form class="form-section entry-panel hidden" id="credentialForm">
        <h2>Credential Entry</h2>
        <div id="formMessage" class="form-message"></div>

        <div class="form-grid">
          <div class="field">
            <label>Credential ID</label>
            <div class="id-box">
              <input id="credentialID" type="text" readonly placeholder="Generated on save (CR-0001)">
              <span id="idStatus" class="id-status"></span>
            </div>
          </div>

          <div class="field">
            <label>Client ID <span class="required">*</span></label>
            <input id="clientId" type="text" required list="clientIdList" placeholder="Search / select Client ID" autocomplete="off" style="text-transform:uppercase">
            <datalist id="clientIdList"></datalist>
          </div>

          <div class="field">
            <label>Client Name <span class="required">*</span></label>
            <input id="clientName" type="text" required list="clientNameList" placeholder="Search / select Client Name" autocomplete="off">
            <datalist id="clientNameList"></datalist>
          </div>

          <div class="field">
            <label>Portal Name <span class="required">*</span></label>
            <input id="portalName" type="text" required placeholder="e.g. GST, Income Tax, MCA" list="portalSuggestions">
            <datalist id="portalSuggestions">
              <option value="GST">
              <option value="Income Tax">
              <option value="MCA">
              <option value="TRACES">
              <option value="EPFO">
              <option value="ESIC">
            </datalist>
          </div>

          <div class="field">
            <label>Portal / Registration No.</label>
            <input id="portalNo" type="text" placeholder="GSTIN / PAN / Registration No.">
          </div>

          <div class="field">
            <label>User Name / Login ID <span class="required">*</span></label>
            <input id="userName" type="text" required placeholder="Enter username / ID" autocomplete="off">
          </div>

          <div class="field">
            <label>Password <span class="required">*</span></label>
            <div class="password-toggle-box">
              <input id="password" type="password" required placeholder="Enter password" autocomplete="new-password">
              <button id="togglePasswordBtn" class="list-icon-btn" type="button" title="Show/Hide Password"><i data-lucide="eye"></i></button>
            </div>
          </div>

          <div class="field">
            <label>Created By</label>
            <input id="createdBy" type="text" value="Admin" placeholder="Created by">
          </div>

          <div class="field full">
            <label>Narration</label>
            <textarea id="narration" rows="3" placeholder="Additional details, recovery email/phone, security notes..."></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelFormBtn">Cancel</button>
          <button id="saveBtn" class="btn btn-primary" type="submit">
            <i class="save-icon" data-lucide="save"></i>
            <span class="save-text">Save Credential</span>
          </button>
        </div>
      </form>

    </div>
  </div>
</main>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a class="bottom-item" href="../../../index.html">
      <i data-lucide="house"></i>
      <span>HOME</span>
    </a>

    <a class="bottom-item" href="../../crm/crm.html">
      <i data-lucide="users-round"></i>
      <span>CRM</span>
    </a>

    <a class="bottom-item" href="../../accounts/accounts.html">
      <i data-lucide="wallet"></i>
      <span>ACCOUNTS</span>
    </a>

    <a class="bottom-item" href="../../settings/settings.html">
      <i data-lucide="settings-2"></i>
      <span>SETTINGS</span>
    </a>
  </div>
</nav>

<script type="module">
  import { formatIndianDate } from "../../../js/date.js";
  import { db } from "../../../js/firebase-config.js";
  import {
    doc,
    runTransaction,
    collection,
    getDocs,
    query,
    limit
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  const form = document.getElementById("credentialForm");
  const saveBtn = document.getElementById("saveBtn");
  const message = document.getElementById("formMessage");
  const idInput = document.getElementById("credentialID");
  const idStatus = document.getElementById("idStatus");
  const passwordInput = document.getElementById("password");
  const togglePasswordBtn = document.getElementById("togglePasswordBtn");

  document.getElementById("presentDate").textContent = formatIndianDate(new Date());

  const clean = value => String(value || "").trim();
  const upper = value => clean(value).toUpperCase();

  const showMessage = (text, type = "error") => {
    message.textContent = text;
    message.className = `form-message show ${type}`;
  };

  const clearMessage = () => {
    message.textContent = "";
    message.className = "form-message";
  };

  togglePasswordBtn.addEventListener("click", () => {
    const isPassword = passwordInput.type === "password";
    passwordInput.type = isPassword ? "text" : "password";
    togglePasswordBtn.innerHTML = `<i data-lucide="${isPassword ? 'eye-off' : 'eye'}"></i>`;
    window.lucide?.createIcons();
  });

  const clientIdInput = document.getElementById("clientId");
  const clientNameInput = document.getElementById("clientName");
  const clientIdList = document.getElementById("clientIdList");
  const clientNameList = document.getElementById("clientNameList");

  let clientsCache = [];
  let clientsLoaded = false;

  const normalize = value => String(value || "").trim().toLowerCase();

  function fillClient(client) {
    if (!client) return;
    clientIdInput.value = client.clientId || client.id || "";
    clientNameInput.value = client.clientName || "";
    clientIdInput.classList.remove("client-loading");
    clientNameInput.classList.remove("client-loading");
  }

  function findClientById(value) {
    const id = String(value || "").trim().toUpperCase();
    return clientsCache.find(client => String(client.clientId || client.id || "").trim().toUpperCase() === id);
  }

  function findClientByName(value) {
    const name = normalize(value);
    return clientsCache.find(client => normalize(client.clientName) === name);
  }

  async function loadClients() {
    const cacheKey = "bizodit_clients_cache_v3";
    try {
      const cached = JSON.parse(localStorage.getItem(cacheKey) || "[]");
      if (Array.isArray(cached) && cached.length) {
        clientsCache = cached;
        clientsLoaded = true;
        populateClientLists();
      }
    } catch (error) {
      console.warn("Client cache read failed:", error);
    }

    try {
      const snapshot = await getDocs(query(collection(db, "clients"), limit(500)));
      clientsCache = snapshot.docs.map(item => ({
        id: item.id,
        ...item.data()
      })).filter(client => client.clientId && client.clientName);

      localStorage.setItem(cacheKey, JSON.stringify(clientsCache));
      clientsLoaded = true;
      populateClientLists();
    } catch (error) {
      console.error("Unable to refresh client lookup:", error);
    }
  }

  function populateClientLists() {
    clientIdList.innerHTML = "";
    clientNameList.innerHTML = "";
    clientsCache.forEach(client => {
      const idOption = document.createElement("option");
      idOption.value = client.clientId || client.id;
      clientIdList.appendChild(idOption);

      const nameOption = document.createElement("option");
      nameOption.value = client.clientName;
      clientNameList.appendChild(nameOption);
    });
  }

  clientIdInput.addEventListener("input", () => {
    if (!clientsLoaded) return;
    const client = findClientById(clientIdInput.value);
    if (client) fillClient(client);
  });

  clientNameInput.addEventListener("input", () => {
    if (!clientsLoaded) return;
    const client = findClientByName(clientNameInput.value);
    if (client) fillClient(client);
  });

  clientIdInput.addEventListener("change", () => {
    const client = findClientById(clientIdInput.value);
    if (client) fillClient(client);
  });

  clientNameInput.addEventListener("change", () => {
    const client = findClientByName(clientNameInput.value);
    if (client) fillClient(client);
  });

  /*
   * AUTO ID GENERATION (CR-0001, CR-0002...)
   * Firestore Transaction Counter: counters/credentialCounter
   * Document ID stored in collection 'credentials'
   */
  async function getNextCredentialId(transaction) {
    const counterRef = doc(db, "counters", "credentialCounter");
    const counterSnap = await transaction.get(counterRef);
    let nextNumber = 1;

    if (counterSnap.exists()) {
      const lastNumber = Number(counterSnap.data().lastNumber);
      if (Number.isFinite(lastNumber) && lastNumber >= 0) {
        nextNumber = lastNumber + 1;
      }
    }

    while (true) {
      const candidateId = `CR-${String(nextNumber).padStart(4, "0")}`;
      const candidateRef = doc(db, "credentials", candidateId);
      const candidateSnap = await transaction.get(candidateRef);

      if (!candidateSnap.exists()) {
        return { id: candidateId, counterRef, nextNumber };
      }
      nextNumber++;
    }
  }

  const credentialListPanel = document.getElementById("credentialListPanel");
  const addCredentialBtn = document.getElementById("addCredentialBtn");
  const credentialSearch = document.getElementById("credentialSearch");
  const credentialSortBtn = document.getElementById("credentialSortBtn");
  const credentialFilterBtn = document.getElementById("credentialFilterBtn");
  const credentialSortMenu = document.getElementById("credentialSortMenu");
  const credentialFilterPanel = document.getElementById("credentialFilterPanel");
  const credentialPortalFilter = document.getElementById("credentialPortalFilter");
  const credentialRefreshBtn = document.getElementById("credentialRefreshBtn");
  const credentialList = document.getElementById("credentialList");

  let credentialRows = [];
  let credentialSort = "id";

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function whatsappClean(n) {
    let x = String(n || "").replace(/\D/g, "");
    if (x.length === 10) x = "91" + x;
    if (x.length === 11 && x.startsWith("0")) x = "91" + x.slice(1);
    return x;
  }

  async function loadCredentialList() {
    const cacheKey = "bizodit_credentials_cache_v1";
    try {
      const cached = JSON.parse(localStorage.getItem(cacheKey) || "[]");
      if (Array.isArray(cached) && cached.length) {
        credentialRows = cached;
        renderCredentialList();
      }
    } catch (error) {
      console.warn("Credential cache read failed:", error);
    }

    try {
      const snapshot = await getDocs(query(collection(db, "credentials"), limit(500)));
      credentialRows = snapshot.docs.map(item => ({ id: item.id, ...item.data() }));
      localStorage.setItem(cacheKey, JSON.stringify(credentialRows));
      renderCredentialList();
    } catch (error) {
      console.error("Credential list load failed:", error);
      if (!credentialRows.length) {
        credentialList.innerHTML = '<div class="empty-list">Unable to load credentials. Tap Refresh to try again.</div>';
      }
    }
  }

  function renderCredentialList() {
    const term = clean(credentialSearch.value).toLowerCase();
    const portal = clean(credentialPortalFilter.value);

    let rows = credentialRows.filter(row => {
      const idVal = row.credentialID || row.id || "";
      const text = `${idVal} ${row.clientId || ""} ${row.clientName || ""} ${row.portalName || ""} ${row.userName || ""}`.toLowerCase();
      return (!term || text.includes(term)) && (!portal || row.portalName === portal);
    });

    rows.sort((a, b) => {
      if (credentialSort === "id") return String(a.credentialID || a.id || "").localeCompare(String(b.credentialID || b.id || ""), undefined, { numeric: true });
      if (credentialSort === "client") return String(a.clientName || "").localeCompare(String(b.clientName || ""));
      if (credentialSort === "portal") return String(a.portalName || "").localeCompare(String(b.portalName || ""));
      if (credentialSort === "newest") return String(b.createdAt || "").localeCompare(String(a.createdAt || ""));
      return 0;
    });

    if (!rows.length) {
      credentialList.innerHTML = '<div class="empty-list">No credential records found.</div>';
      return;
    }

    credentialList.innerHTML = rows.map(row => {
      const id = row.credentialID || row.id;
      const client = findClientById(row.clientId);
      const phone = clean(client?.mobile || "");
      const wa = whatsappClean(phone);
      const portalLabel = row.portalName || "Portal";
      const loginUser = row.userName || "No Username";

      return `
      <div class="data-row">
        <div class="data-row-main">
          <div class="data-row-content" data-credential-id="${escapeHtml(id)}">
            <div class="data-row-title">${escapeHtml(row.clientName || row.clientId || "Client")}</div>
            <div class="data-row-sub">${escapeHtml(id)} · ${escapeHtml(loginUser)} ${row.portalNo ? `(${escapeHtml(row.portalNo)})` : ''}</div>
          </div>
          <div class="data-row-meta">
            <span class="portal-badge">${escapeHtml(portalLabel)}</span>
          </div>
        </div>
        <div class="credential-row-actions">
          ${phone ? `<a class="credential-action-btn call" href="tel:${escapeHtml(phone)}" title="Call Client"><i data-lucide="phone"></i></a>` : ""}
          ${phone ? `<a class="credential-action-btn whatsapp" href="https://wa.me/${escapeHtml(wa)}" target="_blank" rel="noopener" title="WhatsApp"><i data-lucide="message-circle"></i></a>` : ""}
          <button class="credential-action-btn open-btn" data-credential-id="${escapeHtml(id)}" type="button" title="View Details"><i data-lucide="arrow-up-right"></i></button>
        </div>
      </div>`;
    }).join("");

    window.lucide?.createIcons();

    credentialList.querySelectorAll("[data-credential-id]").forEach(b => {
      b.addEventListener("click", e => {
        e.stopPropagation();
        const cid = b.dataset.credentialId;
        const record = credentialRows.find(x => (x.credentialID || x.id) === cid);
        if (record) openCredentialForm(record);
      });
    });
  }

  function openCredentialForm(record = null) {
    form.reset();
    clearMessage();
    passwordInput.type = "password";

    if (record) {
      idInput.value = record.credentialID || record.id || "";
      clientIdInput.value = record.clientId || "";
      clientNameInput.value = record.clientName || "";
      document.getElementById("portalName").value = record.portalName || "";
      document.getElementById("portalNo").value = record.portalNo || "";
      document.getElementById("userName").value = record.userName || "";
      document.getElementById("password").value = record.password || "";
      document.getElementById("createdBy").value = record.createdBy || "Admin";
      document.getElementById("narration").value = record.narration || "";
    } else {
      document.getElementById("createdBy").value = "Admin";
      idInput.value = "";
    }

    credentialListPanel.classList.add("hidden");
    form.classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function openCredentialList() {
    form.classList.add("hidden");
    credentialListPanel.classList.remove("hidden");
    loadCredentialList();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* CSV Download/Export/Import Utilities */
  function downloadBlob(content, filename, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById("downloadTemplateBtn").addEventListener("click", () => {
    const template = "Client ID,Client Name,Portal Name,Portal No,User Name,Password,Created By,Narration\n" +
                     "C40001,Acme Corp,GST,27ABCDE1234F1Z5,acme_gst,Secret@123,Admin,Official GST login";
    downloadBlob(template, "credentials_template.csv", "text/csv;charset=utf-8;");
  });

  document.getElementById("exportCredentialBtn").addEventListener("click", () => {
    if (!credentialRows.length) { alert("No credentials to export."); return; }
    const headers = ["Credential ID","Client ID","Client Name","Portal Name","Portal No","User Name","Password","Created By","Narration","Created At"];
    const rows = credentialRows.map(c => [
      `"${c.credentialID||c.id||""}"`, `"${c.clientId||""}"`, `"${(c.clientName||"").replace(/"/g,'""')}"`,
      `"${(c.portalName||"").replace(/"/g,'""')}"`, `"${(c.portalNo||"").replace(/"/g,'""')}"`,
      `"${(c.userName||"").replace(/"/g,'""')}"`, `"${(c.password||"").replace(/"/g,'""')}"`,
      `"${c.createdBy||"Admin"}"`, `"${(c.narration||"").replace(/"/g,'""')}"`, `"${c.createdAt||""}"`
    ]);
    const csv = [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
    downloadBlob(csv, `credentials_export_${new Date().toISOString().slice(0,10)}.csv`, "text/csv;charset=utf-8;");
  });

  document.getElementById("importCredentialBtn").addEventListener("click", () => document.getElementById("csvFileInput").click());

  document.getElementById("csvFileInput").addEventListener("change", async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const text = await file.text();
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    if (lines.length < 2) { alert("CSV file has no data rows."); return; }

    const parseRow = row => {
      const res = []; let inQ = false, val = "";
      for (let i = 0; i < row.length; i++) {
        const c = row[i];
        if (c === '"') { if (inQ && row[i+1] === '"') { val += '"'; i++; } else inQ = !inQ; }
        else if (c === ',' && !inQ) { res.push(val.trim()); val = ""; }
        else val += c;
      }
      res.push(val.trim());
      return res;
    };

    const rows = lines.slice(1).map(parseRow);
    if (!confirm(`Import ${rows.length} credential record(s)?`)) { e.target.value = ""; return; }

    credentialRefreshBtn.classList.add("spinning");
    try {
      let imported = 0;
      const now = new Date().toISOString();
      for (const r of rows) {
        const cId = upper(r[0]), cName = clean(r[1]), portal = clean(r[2]), uName = clean(r[4]), pwd = clean(r[5]);
        if (!cId || !portal || !uName || !pwd) continue;

        await runTransaction(db, async tx => {
          const result = await getNextCredentialId(tx);
          const credRef = doc(db, "credentials", result.id);
          const record = {
            credentialID: result.id,
            clientId: cId,
            clientName: cName,
            portalName: portal,
            portalNo: clean(r[3]),
            userName: uName,
            password: pwd,
            createdBy: clean(r[6]) || "Admin",
            narration: clean(r[7]) || "",
            createdAt: now,
            updatedAt: now
          };
          tx.set(result.counterRef, { lastNumber: result.nextNumber, updatedAt: now }, { merge: true });
          tx.set(credRef, record);
        });
        imported++;
      }
      localStorage.removeItem("bizodit_credentials_cache_v1");
      await loadCredentialList();
      alert(`Successfully imported ${imported} credential(s).`);
    } catch (err) {
      console.error(err);
      alert("Error during credential import: " + err.message);
    } finally {
      credentialRefreshBtn.classList.remove("spinning");
      e.target.value = "";
    }
  });

  addCredentialBtn.addEventListener("click", () => openCredentialForm());
  document.getElementById("cancelFormBtn").addEventListener("click", openCredentialList);
  credentialSearch.addEventListener("input", renderCredentialList);
  credentialPortalFilter.addEventListener("change", renderCredentialList);

  credentialRefreshBtn.addEventListener("click", async () => {
    credentialRefreshBtn.classList.add("spinning");
    try {
      localStorage.removeItem("bizodit_credentials_cache_v1");
      await loadCredentialList();
    } finally {
      credentialRefreshBtn.classList.remove("spinning");
    }
  });

  credentialSortBtn.addEventListener("click", () => credentialSortMenu.classList.toggle("show"));
  credentialFilterBtn.addEventListener("click", () => credentialFilterPanel.classList.toggle("show"));

  credentialSortMenu.querySelectorAll(".sort-option").forEach(option => {
    option.addEventListener("click", () => {
      credentialSort = option.dataset.sort;
      credentialSortMenu.querySelectorAll(".sort-option").forEach(x => x.classList.remove("active"));
      option.classList.add("active");
      credentialSortMenu.classList.remove("show");
      renderCredentialList();
    });
  });

  document.getElementById("pageBackBtn").addEventListener("click", () => {
    if (!form.classList.contains("hidden")) {
      openCredentialList();
    } else {
      history.back();
    }
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    clearMessage();
    if (saveBtn.disabled) return;

    const clientId = upper(document.getElementById("clientId").value);
    const clientName = clean(document.getElementById("clientName").value);
    const portalName = clean(document.getElementById("portalName").value);
    const portalNo = clean(document.getElementById("portalNo").value);
    const userName = clean(document.getElementById("userName").value);
    const password = clean(document.getElementById("password").value);
    const createdBy = clean(document.getElementById("createdBy").value) || "Admin";
    const narration = clean(document.getElementById("narration").value);

    if (!clientId) { showMessage("Client ID is required."); document.getElementById("clientId").focus(); return; }
    if (!clientName) { showMessage("Client Name is required."); document.getElementById("clientName").focus(); return; }

    const selectedClient = findClientById(clientId);
    if (!selectedClient || normalize(selectedClient.clientName) !== normalize(clientName)) {
      showMessage("Please select a valid Client ID or Client Name from the client list.");
      document.getElementById("clientId").focus();
      return;
    }

    if (!portalName) { showMessage("Portal Name is required."); document.getElementById("portalName").focus(); return; }
    if (!userName) { showMessage("Username is required."); document.getElementById("userName").focus(); return; }
    if (!password) { showMessage("Password is required."); document.getElementById("password").focus(); return; }

    saveBtn.disabled = true;
    form.classList.add("saving");
    saveBtn.querySelector(".save-text").textContent = "Saving...";
    idStatus.textContent = "…";

    try {
      const now = new Date().toISOString();
      let generatedId = "";

      await runTransaction(db, async (transaction) => {
        const result = await getNextCredentialId(transaction);
        generatedId = result.id;
        const credRef = doc(db, "credentials", generatedId);
        const data = {
          credentialID: generatedId,
          clientId,
          clientName,
          portalName,
          portalNo,
          userName,
          password,
          createdBy,
          narration,
          createdAt: now,
          updatedAt: now
        };

        transaction.set(result.counterRef, { lastNumber: result.nextNumber, updatedAt: now }, { merge: true });
        transaction.set(credRef, data);
      });

      idInput.value = generatedId;
      idStatus.textContent = "✓";
      showMessage(`Credential ${generatedId} saved successfully.`, "success");

      setTimeout(() => {
        openCredentialList();
      }, 450);
    } catch (error) {
      console.error("Credential save error:", error);
      idStatus.textContent = "";
      showMessage(error?.message || "Unable to save credential. Please try again.");
    } finally {
      saveBtn.disabled = false;
      form.classList.remove("saving");
      saveBtn.querySelector(".save-text").textContent = "Save Credential";
    }
  });

  document.getElementById("menuToggle")?.addEventListener("click", () => document.body.classList.toggle("sidebar-open"));

  window.lucide.createIcons();
  loadClients().then(loadCredentialList);
</script>

</body>
