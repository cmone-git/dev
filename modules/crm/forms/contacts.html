<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="stylesheet" href="../../../css/cm.css">
  <link rel="stylesheet" href="../../../css/forms.css">
  <link rel="stylesheet" href="../../../css/responsive.css">

  <script src="https://unpkg.com/lucide@latest"></script>

  <title>Contacts — CM | BIZODIT</title>

  <style>
    .contact-container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* Standard Toolbar */
    .list-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .list-search {
      flex: 1 1 160px;
      min-width: 140px;
      height: 38px;
      border: 1px solid #d7dce2;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 13px;
      outline: none;
      background: #fff;
      box-sizing: border-box;
      transition: border-color .15s;
    }

    .list-search:focus {
      border-color: #0b3b66;
    }

    .refresh-btn,
    .list-icon-btn {
      width: 38px;
      height: 38px;
      border: 1px solid #d7dce2;
      background: #fff;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex: 0 0 auto;
      color: #4b5563;
      box-sizing: border-box;
    }

    .refresh-btn.spinning svg {
      animation: spin .8s linear infinite;
    }

    .list-icon-btn.active {
      background: #f1f4f7;
    }

    /* Sort Menu & Filter Panel */
    .sort-menu {
      display: none;
      position: relative;
    }

    .sort-menu.show {
      display: block;
      margin-bottom: 10px;
    }

    .sort-options {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .sort-option {
      border: 1px solid #d7dce2;
      background: #fff;
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .sort-option.active {
      background: #eef2f5;
      font-weight: 600;
    }

    .filter-panel {
      display: none;
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid #e0e3e7;
      border-radius: 10px;
      background: #fafbfc;
    }

    .filter-panel.show {
      display: block;
    }

    .filter-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-grid .field {
      flex: 1 1 160px;
      min-width: 140px;
      margin-bottom: 0;
    }

    .filter-grid label {
      display: block;
      font-size: 11px;
      color: #64748b;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .filter-grid select {
      width: 100%;
      height: 34px;
      border: 1px solid #d7dce2;
      border-radius: 6px;
      background: #fff;
      font-size: 12px;
      padding: 0 8px;
    }

    /* Status / Toast Notification */
    .toast-msg {
      display: none;
      margin-bottom: 10px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
    }

    .toast-msg.show {
      display: block;
    }

    .toast-msg.success {
      background: #effaf3;
      color: #16723a;
      border: 1px solid #b9e4c7;
    }

    .toast-msg.error {
      background: #fff1f1;
      color: #b42318;
      border: 1px solid #f3c2c2;
    }

    /* Google Contacts Mobile Style List */
    .contact-list {
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
    }

    .contact-card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid #f1f5f9;
      transition: background .15s ease;
    }

    .contact-card-row:last-child {
      border-bottom: none;
    }

    .contact-card-row:hover {
      background: #f8fafc;
    }

    .contact-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      text-transform: uppercase;
      user-select: none;
    }

    .contact-main {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .contact-name {
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .contact-meta {
      font-size: 12px;
      color: #64748b;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .contact-tag {
      display: inline-block;
      padding: 1px 5px;
      font-size: 10px;
      border-radius: 4px;
      background: #f1f5f9;
      color: #475569;
    }

    .contact-tag.missing {
      background: #fff1f1;
      color: #b42318;
      border: 1px solid #fed7d7;
    }

    /* Single-Row Action Buttons */
    .contact-action-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .contact-action-btn {
      width: 30px;
      height: 30px;
      border: 1px solid #e2e8f0;
      background: #fafafa;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      text-decoration: none;
      cursor: pointer;
      transition: all .15s ease;
    }

    .contact-action-btn svg {
      width: 14px;
      height: 14px;
    }

    .contact-action-btn.call {
      color: #0b3b66;
    }

    .contact-action-btn.whatsapp {
      color: #15803d;
    }

    .contact-action-btn.attach-contact {
      color: #b45309;
      background: #fefce8;
      border-color: #fef08a;
    }

    .contact-action-btn.email {
      color: #4f46e5;
    }

    .contact-action-btn.open-btn {
      color: #334155;
    }

    .contact-action-btn:hover {
      background: #f1f5f9;
    }

    .alphabet-divider {
      background: #f8fafc;
      padding: 4px 14px;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      border-bottom: 1px solid #e2e8f0;
      border-top: 1px solid #e2e8f0;
    }

    .alphabet-divider:first-child {
      border-top: none;
    }

    .empty-list {
      padding: 32px 14px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<header class="cm-header">
  <div class="cm-header-inner">
    <div class="cm-header-left">
      <button class="menu-toggle" id="menuToggle" type="button">
        <i data-lucide="menu"></i>
      </button>

      <div class="cm-brand">
        <div class="cm-logo">CM</div>
        <div class="cm-brand-title">CM | BIZODIT</div>
      </div>
    </div>
  </div>
</header>

<main class="main">
  <div class="page">
    <div class="form-page contact-container">

      <section class="module-header">
        <div class="module-header-left">
          <button class="back-btn" onclick="history.back()" type="button">
            <i data-lucide="arrow-left"></i>
          </button>

          <div class="module-title">
            <h1>Contacts</h1>
            <p>Google contacts view of all client records</p>
            <div class="report-as-on">
              Total Contacts : <strong id="contactCount">0</strong>
            </div>
          </div>
        </div>
      </section>

      <div id="toastMessage" class="toast-msg"></div>

      <!-- Toolbar -->
      <div class="list-toolbar">
        <input id="contactSearch" class="list-search" type="search" placeholder="Search by name, ID, mobile, email..." autocomplete="off">
        <button id="contactSortBtn" class="list-icon-btn" type="button" title="Sort Contacts"><i data-lucide="arrow-up-down"></i></button>
        <button id="contactFilterBtn" class="list-icon-btn" type="button" title="Filter Contacts"><i data-lucide="list-filter"></i></button>
        <button id="exportVCardBtn" class="list-icon-btn" type="button" title="Export Contacts (VCF)"><i data-lucide="download"></i></button>
        <button id="contactRefreshBtn" class="refresh-btn" type="button" title="Refresh"><i data-lucide="refresh-cw"></i></button>
      </div>

      <!-- Sort Menu -->
      <div id="contactSortMenu" class="sort-menu">
        <div class="sort-options">
          <button class="sort-option active" data-sort="name">Name A–Z</button>
          <button class="sort-option" data-sort="name-desc">Name Z–A</button>
          <button class="sort-option" data-sort="id">Client ID (Asc)</button>
          <button class="sort-option" data-sort="id-desc">Client ID (Desc)</button>
        </div>
      </div>

      <!-- Filter Panel -->
      <div id="contactFilterPanel" class="filter-panel">
        <div class="filter-grid">
          <div class="field">
            <label>Constitution</label>
            <select id="constitutionFilter">
              <option value="">All Constitutions</option>
              <option value="Proprietorship">Proprietorship</option>
              <option value="Partnership">Partnership</option>
              <option value="LLP">LLP</option>
              <option value="Private Limited">Private Limited</option>
              <option value="Public Limited">Public Limited</option>
              <option value="OPC">OPC</option>
              <option value="HUF">HUF</option>
              <option value="Individual">Individual</option>
              <option value="Trust">Trust</option>
              <option value="Society">Society</option>
            </select>
          </div>

          <div class="field">
            <label>Mobile Number Availability</label>
            <select id="phoneStatusFilter">
              <option value="">All (With & Without Phone)</option>
              <option value="has-phone">Has Mobile Number</option>
              <option value="no-phone">Missing Mobile Number</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Contact List -->
      <div id="contactList" class="contact-list">
        <div class="empty-list">Loading contacts...</div>
      </div>

    </div>
  </div>
</main>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a class="bottom-item" href="../../../index.html">
      <i data-lucide="house"></i>
      <span>HOME</span>
    </a>

    <a class="bottom-item active" href="../../crm/crm.html">
      <i data-lucide="users-round"></i>
      <span>CRM</span>
    </a>

    <a class="bottom-item" href="../../accounts/accounts.html">
      <i data-lucide="wallet"></i>
      <span>ACCOUNTS</span>
    </a>

    <a class="bottom-item" href="../../settings/settings.html">
      <i data-lucide="settings-2"></i>
      <span>SETTINGS</span>
    </a>
  </div>
</nav>

<script type="module">
  import { db } from "../../../js/firebase-config.js";
  import {
    doc,
    updateDoc,
    collection,
    getDocs,
    query,
    limit
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  const contactList = document.getElementById("contactList");
  const contactSearch = document.getElementById("contactSearch");
  const contactRefreshBtn = document.getElementById("contactRefreshBtn");
  const contactCount = document.getElementById("contactCount");
  const toastMsg = document.getElementById("toastMessage");

  const contactSortBtn = document.getElementById("contactSortBtn");
  const contactFilterBtn = document.getElementById("contactFilterBtn");
  const contactSortMenu = document.getElementById("contactSortMenu");
  const contactFilterPanel = document.getElementById("contactFilterPanel");
  const constitutionFilter = document.getElementById("constitutionFilter");
  const phoneStatusFilter = document.getElementById("phoneStatusFilter");

  const CACHE = "bizodit_clients_cache_v3";
  let clients = [];
  let sortMode = "name";

  const clean = v => String(v || "").trim();

  function showToast(text, type = "success") {
    toastMsg.textContent = text;
    toastMsg.className = `toast-msg show ${type}`;
    setTimeout(() => {
      toastMsg.className = "toast-msg";
    }, 3500);
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function whatsappClean(n) {
    let x = String(n || "").replace(/\D/g, "");
    if (x.length === 10) x = "91" + x;
    if (x.length === 11 && x.startsWith("0")) x = "91" + x.slice(1);
    return x;
  }

  function getInitials(name) {
    const parts = clean(name).split(" ").filter(Boolean);
    if (!parts.length) return "C";
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }

  const AVATAR_COLORS = [
    { bg: "#e0f2fe", text: "#0369a1" },
    { bg: "#fef3c7", text: "#b45309" },
    { bg: "#dcfce7", text: "#15803d" },
    { bg: "#f3e8ff", text: "#7e22ce" },
    { bg: "#fee2e2", text: "#b91c1c" },
    { bg: "#ffedd5", text: "#c2410c" }
  ];

  function getColorForName(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
  }

  function contactPickerSupported() {
    return "contacts" in navigator && "ContactsManager" in window;
  }

  /* Attach mobile number directly from device phonebook */
  async function attachContactFromPhone(clientId) {
    if (!contactPickerSupported()) {
      showToast("Phonebook picker not supported by this browser. Please edit in Clients module.", "error");
      return;
    }

    try {
      const selected = await navigator.contacts.select(["name", "tel"], { multiple: false });
      if (!selected || !selected.length) return;

      const phone = (selected[0].tel || [])[0];
      if (!phone) {
        showToast("The selected contact does not contain a phone number.", "error");
        return;
      }

      let n = String(phone).replace(/\D/g, "");
      if (n.startsWith("91") && n.length === 12) n = n.slice(2);
      if (n.startsWith("0") && n.length === 11) n = n.slice(1);

      if (n.length !== 10) {
        showToast("Please select a contact with a valid 10-digit mobile number.", "error");
        return;
      }

      const clientRef = doc(db, "clients", clientId);
      const now = new Date().toISOString();
      await updateDoc(clientRef, { mobile: n, updatedAt: now });

      const idx = clients.findIndex(c => String(c.clientId || c.id) === String(clientId));
      if (idx >= 0) {
        clients[idx].mobile = n;
        clients[idx].updatedAt = now;
        localStorage.setItem(CACHE, JSON.stringify(clients));
      }

      showToast(`Attached mobile ${n} to ${clients[idx]?.clientName || clientId}.`, "success");
      renderContacts();
    } catch (err) {
      if (err?.name !== "AbortError") {
        console.error(err);
        showToast("Unable to access phone contacts.", "error");
      }
    }
  }

  async function loadContacts() {
    try {
      const cached = JSON.parse(localStorage.getItem(CACHE) || "[]");
      if (Array.isArray(cached) && cached.length) {
        clients = cached;
        renderContacts();
      }
    } catch (e) {
      console.warn(e);
    }

    try {
      const snapshot = await getDocs(query(collection(db, "clients"), limit(500)));
      clients = snapshot.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(c => c.clientId && c.clientName);

      localStorage.setItem(CACHE, JSON.stringify(clients));
      renderContacts();
    } catch (err) {
      console.error("Failed to load contacts:", err);
      if (!clients.length) {
        contactList.innerHTML = `<div class="empty-list">Unable to load contacts. Tap Refresh to retry.</div>`;
      }
    }
  }

  function renderContacts() {
    const term = clean(contactSearch.value).toLowerCase();
    const constFilter = clean(constitutionFilter.value);
    const phFilter = clean(phoneStatusFilter.value);

    let filtered = clients.filter(c => {
      const id = String(c.clientId || c.id || "").toLowerCase();
      const name = String(c.clientName || "").toLowerCase();
      const mobile = clean(c.mobile);
      const email = String(c.email || "").toLowerCase();

      const matchesSearch = !term || id.includes(term) || name.includes(term) || mobile.includes(term) || email.includes(term);
      const matchesConst = !constFilter || String(c.constitution || "") === constFilter;
      const matchesPhone = !phFilter || (phFilter === "has-phone" ? !!mobile : !mobile);

      return matchesSearch && matchesConst && matchesPhone;
    });

    // Sorting Engine
    filtered.sort((a, b) => {
      if (sortMode === "name") return String(a.clientName || "").localeCompare(String(b.clientName || ""));
      if (sortMode === "name-desc") return String(b.clientName || "").localeCompare(String(a.clientName || ""));
      if (sortMode === "id") return String(a.clientId || a.id || "").localeCompare(String(b.clientId || b.id || ""), undefined, { numeric: true });
      if (sortMode === "id-desc") return String(b.clientId || b.id || "").localeCompare(String(a.clientId || a.id || ""), undefined, { numeric: true });
      return 0;
    });

    contactCount.textContent = filtered.length;

    if (!filtered.length) {
      contactList.innerHTML = `<div class="empty-list">No contacts found matching criteria.</div>`;
      return;
    }

    let currentLetter = "";
    let html = "";

    filtered.forEach(c => {
      const name = c.clientName || "Unnamed Client";
      const firstChar = name.charAt(0).toUpperCase();
      const groupLetter = /^[A-Z]/.test(firstChar) ? firstChar : "#";

      if (sortMode.startsWith("name") && groupLetter !== currentLetter) {
        currentLetter = groupLetter;
        html += `<div class="alphabet-divider">${escapeHtml(currentLetter)}</div>`;
      }

      const id = String(c.clientId || c.id);
      const phone = clean(c.mobile);
      const email = clean(c.email);
      const wa = whatsappClean(phone);
      const colors = getColorForName(name);
      const initials = getInitials(name);

      html += `
        <div class="contact-card-row">
          <div class="contact-avatar" style="background:${colors.bg}; color:${colors.text};">
            ${escapeHtml(initials)}
          </div>
          
          <div class="contact-main" onclick="location.href='clients.html'">
            <div class="contact-name">${escapeHtml(name)}</div>
            <div class="contact-meta">
              ${phone ? `<span>${escapeHtml(phone)}</span>` : `<span class="contact-tag missing">No Mobile</span>`}
              <span class="contact-tag">${escapeHtml(id)}</span>
              ${c.constitution ? `<span class="contact-tag">${escapeHtml(c.constitution)}</span>` : ''}
            </div>
          </div>

          <div class="contact-action-group">
            ${phone ? `<a class="contact-action-btn call" href="tel:${escapeHtml(phone)}" title="Call Client"><i data-lucide="phone"></i></a>` : ""}
            ${phone ? `<a class="contact-action-btn whatsapp" href="https://wa.me/${escapeHtml(wa)}" target="_blank" rel="noopener" title="WhatsApp"><i data-lucide="message-circle"></i></a>` : ""}
            ${!phone ? `<button class="contact-action-btn attach-contact" data-attach-id="${escapeHtml(id)}" type="button" title="Attach Mobile from Phonebook"><i data-lucide="user-plus"></i></button>` : ""}
            ${email ? `<a class="contact-action-btn email" href="mailto:${escapeHtml(email)}" title="Send Email"><i data-lucide="mail"></i></a>` : ""}
            <a class="contact-action-btn open-btn" href="clients.html" title="Open Full Client"><i data-lucide="arrow-up-right"></i></a>
          </div>
        </div>
      `;
    });

    contactList.innerHTML = html;
    window.lucide?.createIcons();

    contactList.querySelectorAll("[data-attach-id]").forEach(btn => {
      btn.addEventListener("click", e => {
        e.stopPropagation();
        attachContactFromPhone(btn.dataset.attachId);
      });
    });
  }

  // Export Contacts to .VCF
  document.getElementById("exportVCardBtn").addEventListener("click", () => {
    if (!clients.length) {
      alert("No contacts available to export.");
      return;
    }

    let vcardData = "";
    clients.forEach(c => {
      vcardData += "BEGIN:VCARD\n";
      vcardData += "VERSION:3.0\n";
      vcardData += `FN:${c.clientName || 'Client'}\n`;
      if (c.mobile) vcardData += `TEL;TYPE=CELL:${c.mobile}\n`;
      if (c.email) vcardData += `EMAIL;TYPE=WORK:${c.email}\n`;
      if (c.address) vcardData += `ADR;TYPE=WORK:;;${c.address.replace(/\n/g, ' ')};;;;\n`;
      if (c.clientId) vcardData += `NOTE:Client ID: ${c.clientId}\n`;
      vcardData += "END:VCARD\n";
    });

    const blob = new Blob([vcardData], { type: "text/vcard;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `contacts_${new Date().toISOString().slice(0, 10)}.vcf`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  contactSortBtn.addEventListener("click", () => contactSortMenu.classList.toggle("show"));
  contactFilterBtn.addEventListener("click", () => contactFilterPanel.classList.toggle("show"));

  contactSortMenu.querySelectorAll(".sort-option").forEach(btn => {
    btn.addEventListener("click", () => {
      sortMode = btn.dataset.sort;
      contactSortMenu.querySelectorAll(".sort-option").forEach(x => x.classList.remove("active"));
      btn.classList.add("active");
      contactSortMenu.classList.remove("show");
      renderContacts();
    });
  });

  contactSearch.addEventListener("input", renderContacts);
  constitutionFilter.addEventListener("change", renderContacts);
  phoneStatusFilter.addEventListener("change", renderContacts);

  contactRefreshBtn.addEventListener("click", async () => {
    contactRefreshBtn.classList.add("spinning");
    try {
      localStorage.removeItem(CACHE);
      await loadContacts();
    } finally {
      contactRefreshBtn.classList.remove("spinning");
    }
  });

  document.getElementById("menuToggle")?.addEventListener("click", () => document.body.classList.toggle("sidebar-open"));

  window.lucide?.createIcons();
  loadContacts();
</script>

</body>
</html>
