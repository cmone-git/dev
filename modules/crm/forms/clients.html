<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../../css/cm.css">
<link rel="stylesheet" href="../../../css/forms.css">
<link rel="stylesheet" href="../../../css/responsive.css">
<script src="https://unpkg.com/lucide@latest"></script>
<title>Clients — CM | BIZODIT</title>
<style>
.client-id-box{display:flex;align-items:center;gap:8px}.client-id-box input{flex:1}.id-status{min-width:24px;text-align:center}

/* Toolbar adjustments */
.list-toolbar{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.list-search{flex:1 1 160px;min-width:140px;height:38px;border:1px solid #d7dce2;border-radius:8px;padding:0 12px;font-size:13px;outline:none;background:#fff;box-sizing:border-box;transition:border-color .15s}
.list-search:focus{border-color:#0b3b66}
.refresh-btn,.list-icon-btn,.form-view-action{width:38px;height:38px;border:1px solid #d7dce2;background:#fff;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;color:#4b5563;box-sizing:border-box}
.refresh-btn.spinning svg{animation:spin .8s linear infinite}.list-icon-btn.active{background:#f1f4f7}
.add-form-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:68px;height:38px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:500;box-sizing:border-box}

/* Panels */
.list-panel{display:block}.list-panel.hidden,.entry-panel.hidden{display:none}
.data-list{display:flex;flex-direction:column;gap:8px}

/* Client Card & Actions */
.data-row{border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;background:#fff}
.data-row-main{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.data-row-content{min-width:0;flex:1;cursor:pointer}
.data-row-title{font-weight:600;font-size:14px;color:#1e293b}
.data-row-sub{margin-top:3px;color:#64748b;font-size:12px;line-height:1.4}
.data-row-meta{text-align:right;white-space:nowrap}

/* Status Badges - Minimal Subtle Palette */
.status-badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:500}
.status-badge.active{background:#f0fdf4;color:#166534;border:1px solid #dcfce7}
.status-badge.inactive{background:#f8fafc;color:#64748b;border:1px solid #e2e8f0}

/* Reduced height action bar inside card */
.client-row-actions{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:7px;padding-top:7px;border-top:1px solid #f1f5f9}
.client-action-btn{width:30px;height:30px;border:1px solid #e2e8f0;background:#fafafa;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#475569;text-decoration:none;cursor:pointer}
.client-action-btn svg{width:15px;height:15px}
.client-action-btn.call{color:#0b3b66}
.client-action-btn.whatsapp{color:#15803d}
.client-action-btn.contact{color:#6b7280}
.client-action-btn.open-btn{color:#334155}

.empty-list{padding:28px 12px;text-align:center;color:#777;font-size:13px}
.filter-panel{display:none;margin-bottom:12px;padding:12px;border:1px solid #e0e3e7;border-radius:10px;background:#fafbfc}.filter-panel.show{display:block}
.filter-panel .field{margin-bottom:8px}.date-range{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-top:8px}.date-range .field{flex:1 1 140px;min-width:130px;margin-bottom:0}.date-range .field label{display:block;margin-bottom:5px}
.sort-menu{display:none}.sort-menu.show{display:block;margin-bottom:10px}.sort-options{display:flex;gap:6px;flex-wrap:wrap}
.sort-option{border:1px solid #d7dce2;background:#fff;border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer}.sort-option.active{background:#eef2f5;font-weight:600}
.form-message{display:none;margin:0 0 14px;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.4}.form-message.show{display:block}.form-message.error{background:#fff1f1;color:#b42318;border:1px solid #f3c2c2}.form-message.success{background:#effaf3;color:#16723a;border:1px solid #b9e4c7}
.form-view-actions{display:flex;justify-content:flex-end;gap:6px;width:auto;height:auto;border:0;background:transparent;margin:-4px 0 10px}.form-view-action.delete{color:#b42318}.form-view-action.hidden{display:none}
.view-mode input:not([readonly]),.view-mode select,.view-mode textarea{background:#f7f8f9;color:#33404c;pointer-events:none}.view-mode .form-actions{display:none}
.form-mode-label{display:none;margin:-7px 0 14px;font-size:11px;color:#7b8791}.view-mode .form-mode-label{display:block}
.contact-picker-hidden{display:none!important}.contact-help{font-size:11px;color:#7b8791;margin-top:5px}
.saving .save-icon{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="cm-header"><div class="cm-header-inner"><div class="cm-header-left">
<button class="menu-toggle" id="menuToggle" type="button"><i data-lucide="menu"></i></button>
<div class="cm-brand"><div class="cm-logo">CM</div><div class="cm-brand-title">CM | BIZODIT</div></div>
</div></div></header>

<main class="main"><div class="page"><div class="form-page">

<section class="module-header"><div class="module-header-left">
<button class="back-btn" id="pageBackBtn" type="button"><i data-lucide="arrow-left"></i></button>
<div class="module-title"><h1>Clients</h1><p>Create and manage client records</p><div class="report-as-on">Date : <strong id="presentDate">--</strong></div></div>
</div></section>

<div id="clientListPanel" class="form-section list-panel">
<div class="list-toolbar">
  <input id="clientSearch" class="list-search" type="search" placeholder="Search clients..." autocomplete="off">
  <button id="clientSortBtn" class="list-icon-btn" type="button" title="Sort"><i data-lucide="arrow-up-down"></i></button>
  <button id="clientFilterBtn" class="list-icon-btn" type="button" title="Filter"><i data-lucide="list-filter"></i></button>
  <button id="clientRefreshBtn" class="refresh-btn" type="button" title="Refresh"><i data-lucide="refresh-cw"></i></button>
  <button id="exportClientsBtn" class="list-icon-btn" type="button" title="Export CSV"><i data-lucide="download"></i></button>
  <button id="importClientsBtn" class="list-icon-btn" type="button" title="Import CSV"><i data-lucide="upload"></i></button>
  <button id="downloadTemplateBtn" class="list-icon-btn" type="button" title="Download Import Template"><i data-lucide="file-spreadsheet"></i></button>
  <input type="file" id="csvFileInput" accept=".csv" style="display:none">
  <button id="addClientBtn" class="btn btn-primary add-form-btn" type="button"><i data-lucide="plus"></i>Add</button>
</div>

<div id="clientSortMenu" class="sort-menu"><div class="sort-options">
<button class="sort-option active" data-sort="name">Name A–Z</button>
<button class="sort-option" data-sort="name-desc">Name Z–A</button>
<button class="sort-option" data-sort="id">Client ID</button>
<button class="sort-option" data-sort="newest">Newest</button>
</div></div>

<div id="clientFilterPanel" class="filter-panel">
<div class="field"><label>Status</label><select id="clientStatusFilter"><option value="">All Status</option><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div>
<div class="date-range">
<div class="field"><label>From Date</label><input id="clientFromDate" type="date"></div>
<div class="field"><label>To Date</label><input id="clientToDate" type="date"></div>
</div>
</div>

<div id="clientList" class="data-list"><div class="empty-list">Loading clients...</div></div>
</div>

<form class="form-section entry-panel hidden" id="clientForm">
<div class="form-view-actions">
<button id="editClientBtn" class="form-view-action" type="button" title="Edit client"><i data-lucide="pencil"></i></button>
<button id="deleteClientBtn" class="form-view-action delete" type="button" title="Delete client"><i data-lucide="trash-2"></i></button>
</div>
<h2 id="clientFormTitle">Client Entry</h2>
<div id="formModeLabel" class="form-mode-label">View mode — tap Edit to modify this client.</div>
<div id="formMessage" class="form-message"></div>

<div class="form-grid">
<div class="field"><label>Client ID</label><div class="client-id-box"><input id="clientId" type="text" readonly placeholder="Generating..."><span id="idStatus" class="id-status"></span></div></div>
<div class="field"><label>Client Name <span class="required">*</span></label><input id="clientName" type="text" required placeholder="Enter client name" autocomplete="organization"></div>
<div class="field"><label>Legal Name</label><input id="legalName" type="text" placeholder="Legal / registered name"></div>
<div class="field"><label>Constitution</label><select id="constitution"><option value="">Select Constitution...</option><option>Proprietorship</option><option>Partnership</option><option>LLP</option><option>Private Limited</option><option>Public Limited</option><option>OPC</option><option>HUF</option><option>Trust</option><option>Society</option><option>Individual</option><option>Other</option></select></div>

<div class="field"><label>Mobile</label><div style="display:flex;gap:6px"><input id="mobile" type="tel" inputmode="numeric" maxlength="10" placeholder="10 digit mobile number" style="flex:1"><button id="contactPickerBtn" class="list-icon-btn contact-picker-hidden" type="button" title="Add from phone contacts"><i data-lucide="contact-round"></i></button></div><div id="contactHelp" class="contact-help"></div></div>
<div class="field"><label>Email</label><input id="email" type="email" placeholder="client@example.com"></div>
<div class="field"><label>PAN</label><input id="pan" type="text" maxlength="10" placeholder="ABCDE1234F" style="text-transform:uppercase"></div>
<div class="field"><label>Aadhaar</label><input id="adhar" type="text" inputmode="numeric" maxlength="12" placeholder="12 digit Aadhaar"></div>
<div class="field"><label>GSTIN</label><input id="gstin" type="text" maxlength="15" placeholder="15 digit GSTIN" style="text-transform:uppercase"></div>
<div class="field"><label>Branch ID</label><input id="branchId" type="text" placeholder="Branch ID"></div>
<div class="field full"><label>Address</label><textarea id="address" rows="3" placeholder="Complete address"></textarea></div>
<div class="field"><label>Status</label><select id="status"><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div>
<div class="field"><label>Client Folder URL</label><input id="clientFolderUrl" type="url" placeholder="Google Drive / client folder URL"></div>
<div class="field full"><label>Notes</label><textarea id="notes" rows="3" placeholder="Additional client information..."></textarea></div>
</div>

<div class="form-actions">
<button type="button" class="btn btn-secondary" id="cancelFormBtn">Cancel</button>
<button id="saveBtn" class="btn btn-primary" type="submit"><i class="save-icon" data-lucide="save"></i><span class="save-text">Save Client</span></button>
</div>
</form>

</div></div></main>

</div></nav>

<script type="module">
import { db } from "../../../js/firebase-config.js";
import { doc,getDoc,getDocs,updateDoc,deleteDoc,collection,query,where,limit,runTransaction,writeBatch } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const $=id=>document.getElementById(id);
const form=$("clientForm"), listPanel=$("clientListPanel"), list=$("clientList"), msg=$("formMessage"), save=$("saveBtn");
const CACHE="bizodit_clients_cache_v3";
let clients=[],sortMode="name",currentId=null,mode="new";

$("presentDate").textContent=new Intl.DateTimeFormat("en-IN",{day:"2-digit",month:"2-digit",year:"numeric"}).format(new Date());

const clean=v=>String(v||"").trim();
const upper=v=>clean(v).toUpperCase();
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const show=(t,type="error")=>{msg.textContent=t;msg.className=`form-message show ${type}`};
const clear=()=>{msg.textContent="";msg.className="form-message"};

function data(){
return {
clientId:clean($("clientId").value),clientName:clean($("clientName").value),legalName:clean($("legalName").value),
constitution:clean($("constitution").value),address:clean($("address").value),mobile:clean($("mobile").value),
email:clean($("email").value).toLowerCase(),pan:upper($("pan").value),adhar:clean($("adhar").value),gstin:upper($("gstin").value),
branchId:clean($("branchId").value),clientFolderUrl:clean($("clientFolderUrl").value),notes:clean($("notes").value),
status:clean($("status").value)||"Active"
}}

function fill(c){
currentId=c.clientId||c.id;
$("clientId").value=c.clientId||c.id||"";$("clientName").value=c.clientName||"";$("legalName").value=c.legalName||"";
$("constitution").value=c.constitution||"";$("address").value=c.address||"";$("mobile").value=c.mobile||"";
$("email").value=c.email||"";$("pan").value=c.pan||"";$("adhar").value=c.adhar||"";$("gstin").value=c.gstin||"";
$("branchId").value=c.branchId||"";$("clientFolderUrl").value=c.clientFolderUrl||"";$("notes").value=c.notes||"";$("status").value=c.status||"Active";
}

function setInputs(disabled){
form.querySelectorAll("input,select,textarea").forEach(x=>x.disabled=disabled);
$("clientId").readOnly=true;
save.disabled=disabled;
}

function viewMode(){
mode="view";form.classList.add("view-mode");$("clientFormTitle").textContent="Client Details";
$("editClientBtn").classList.remove("hidden");$("deleteClientBtn").classList.remove("hidden");setInputs(true);
$("cancelFormBtn").textContent="Back";$("contactPickerBtn").classList.add("contact-picker-hidden");clear();
}

function editMode(){
mode="edit";form.classList.remove("view-mode");$("clientFormTitle").textContent="Edit Client";
$("editClientBtn").classList.add("hidden");$("deleteClientBtn").classList.remove("hidden");setInputs(false);
$("cancelFormBtn").textContent="Cancel";updateContactPicker();clear();
}

function newMode(){
mode="new";currentId=null;form.classList.remove("view-mode");$("clientFormTitle").textContent="Client Entry";
$("editClientBtn").classList.add("hidden");$("deleteClientBtn").classList.add("hidden");form.reset();$("status").value="Active";
$("clientId").value="";$("idStatus").textContent="";setInputs(false);$("cancelFormBtn").textContent="Cancel";clear();updateContactPicker();
}

async function load(){
try{const c=JSON.parse(localStorage.getItem(CACHE)||"[]");if(Array.isArray(c)&&c.length){clients=c;render()}}catch{}
try{
const s=await getDocs(query(collection(db,"clients"),limit(500)));
clients=s.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.clientId&&c.clientName);
clients.sort((a,b)=>String(a.clientName).localeCompare(String(b.clientName)));
localStorage.setItem(CACHE,JSON.stringify(clients));render();
}catch(e){console.error(e);if(!clients.length)list.innerHTML='<div class="empty-list">Unable to load clients. Tap Refresh to try again.</div>'}
}

function whatsapp(n){
let x=String(n||"").replace(/\D/g,"");if(x.length===10)x="91"+x;if(x.length===11&&x.startsWith("0"))x="91"+x.slice(1);return x;
}

function render(){
const term=clean($("clientSearch").value).toLowerCase(),status=clean($("clientStatusFilter").value);
let rows=clients.filter(c=>{
const search=!term||[c.clientId,c.clientName,c.mobile,c.gstin].some(v=>String(v||"").toLowerCase().includes(term));
const st=!status||String(c.status||"")==status,created=String(c.createdAt||"").slice(0,10);
return search&&st&&(!$("clientFromDate").value||created>=$("clientFromDate").value)&&(!$("clientToDate").value||created<=$("clientToDate").value);
});
rows.sort((a,b)=>{
if(sortMode==="name")return String(a.clientName||"").localeCompare(String(b.clientName||""));
if(sortMode==="name-desc")return String(b.clientName||"").localeCompare(String(a.clientName||""));
if(sortMode==="id")return String(a.clientId||"").localeCompare(String(b.clientId||""),undefined,{numeric:true});
return String(b.createdAt||"").localeCompare(String(a.createdAt||""));
});
if(!rows.length){list.innerHTML='<div class="empty-list">No clients found.</div>';return}
list.innerHTML=rows.map(c=>{
const id=String(c.clientId||c.id||""),phone=clean(c.mobile),wa=whatsapp(phone),st=(c.status||"Active");
return `<div class="data-row">
<div class="data-row-main">
  <div class="data-row-content" data-open="${esc(id)}">
    <div class="data-row-title">${esc(c.clientName||"Unnamed Client")}</div>
    <div class="data-row-sub">${esc(id)} · ${phone?`<span class="client-phone">${esc(phone)}</span>`:"No mobile number"}</div>
  </div>
  <div class="data-row-meta"><span class="status-badge ${st.toLowerCase()}">${esc(st)}</span></div>
</div>
<div class="client-row-actions">
  ${phone?`<a class="client-action-btn call" href="tel:${esc(phone)}" title="Call"><i data-lucide="phone"></i></a>`:""}
  ${phone?`<a class="client-action-btn whatsapp" href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener" title="WhatsApp"><i data-lucide="message-circle"></i></a>`:""}
  <button class="client-action-btn contact" data-contact="${esc(id)}" type="button" title="Phone Contacts"><i data-lucide="contact-round"></i></button>
  <button class="client-action-btn open-btn" data-open="${esc(id)}" type="button" title="Open Client"><i data-lucide="arrow-up-right"></i></button>
</div></div>`;
}).join("");
window.lucide?.createIcons();
list.querySelectorAll("[data-open]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();openView(b.dataset.open)}));
list.querySelectorAll("[data-contact]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();contactForClient(b.dataset.contact)}));
}

function find(id){return clients.find(c=>String(c.clientId||c.id||"")===String(id))}

async function openView(id){
const cached=find(id);if(cached){fill(cached);listPanel.classList.add("hidden");form.classList.remove("hidden");viewMode();scrollTo(0,0)}
try{const s=await getDoc(doc(db,"clients",id));if(!s.exists())throw Error("Client record no longer exists.");fill({id:s.id,...s.data()});viewMode()}catch(e){if(!cached)show(e.message||"Unable to open client.")}
}

function openList(){form.classList.add("hidden");listPanel.classList.remove("hidden");newMode();render();scrollTo(0,0)}
function openNew(){newMode();listPanel.classList.add("hidden");form.classList.remove("hidden");scrollTo(0,0)}

function contactSupported(){return "contacts" in navigator && "ContactsManager" in window}
function updateContactPicker(){
$("contactPickerBtn").classList.toggle("contact-picker-hidden",!contactSupported()||mode==="view");
$("contactHelp").textContent=contactSupported()&&mode!=="view"?"Tap the contact icon to select a phone contact.":"";
}

async function pickContact(){
if(!contactSupported()){show("Phone contact selection is not supported by this browser. Please enter manually.");return}
try{
const a=await navigator.contacts.select(["name","tel"],{multiple:false});if(!a?.length)return;
const phone=(a[0].tel||[])[0];if(!phone){show("The selected contact has no phone number.");return}
let n=String(phone).replace(/\D/g,"");if(n.startsWith("91")&&n.length===12)n=n.slice(2);if(n.startsWith("0")&&n.length===11)n=n.slice(1);
if(n.length!==10){show("The selected contact does not have a valid 10 digit Indian mobile number.");return}
$("mobile").value=n;if(mode==="new"&&!clean($("clientName").value)&&a[0].name?.[0])$("clientName").value=a[0].name[0];
show("Mobile number added from phone contact.","success");
}catch(e){if(e?.name!=="AbortError")show("Unable to access phone contacts.")}
}

async function contactForClient(id){
await openView(id);editMode();await pickContact();if(clean($("mobile").value)&&currentId)await updateClient(true);
}

async function duplicate(field,value,exclude){
if(!value)return false;const s=await getDocs(query(collection(db,"clients"),where(field,"==",value),limit(5)));return s.docs.some(d=>String(d.id)!==String(exclude||""))
}
async function validate(exclude=null){
const d=data();
if(!d.clientName)return"Client Name is required.";
if(d.mobile&&!/^[0-9]{10}$/.test(d.mobile))return"Enter a valid 10 digit mobile number.";
if(d.pan&&!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(d.pan))return"Enter a valid PAN.";
if(d.gstin&&!/^[0-9A-Z]{15}$/.test(d.gstin))return"Enter a valid 15 digit GSTIN.";
if(await duplicate("pan",d.pan,exclude))return"A client with this PAN already exists.";
if(await duplicate("gstin",d.gstin,exclude))return"A client with this GSTIN already exists.";
if(await duplicate("mobile",d.mobile,exclude))return"A client with this mobile number already exists.";
if(await duplicate("email",d.email,exclude))return"A client with this email already exists.";
return"";
}

async function nextId(tx){
const counter=doc(db,"counters","clientCounter"),snap=await tx.get(counter);let n=40001;
if(snap.exists()){const x=Number(snap.data().lastNumber);if(Number.isFinite(x)&&x>=40000)n=x+1}
while(true){const id=`C${String(n).padStart(5,"0")}`,s=await tx.get(doc(db,"clients",id));if(!s.exists())return{counter,id,n};n++}
}

async function createClient(){
const err=await validate();if(err){show(err);return}
save.disabled=true;form.classList.add("saving");$("saveBtn").querySelector(".save-text").textContent="Saving...";$("idStatus").textContent="…";
try{
const d=data(),now=new Date().toISOString();let made="";
await runTransaction(db,async tx=>{
const r=await nextId(tx);made=r.id;
tx.set(r.counter,{lastNumber:r.n,updatedAt:now},{merge:true});
tx.set(doc(db,"clients",made),{...d,clientId:made,createdAt:now,updatedAt:now});
});
$("idStatus").textContent="✓";show(`Client ${made} saved successfully.`,"success");localStorage.removeItem(CACHE);
setTimeout(()=>{openList();load()},450);
}catch(e){console.error(e);show(e.message||"Unable to save client.");$("idStatus").textContent=""}
finally{save.disabled=false;form.classList.remove("saving");$("saveBtn").querySelector(".save-text").textContent="Save Client"}
}

async function updateClient(silent=false){
if(!currentId)return;
const err=await validate(currentId);if(err){if(!silent)show(err);return false}
const d=data(),updatedAt=new Date().toISOString();save.disabled=true;form.classList.add("saving");
try{
await updateDoc(doc(db,"clients",currentId),{...d,clientId:currentId,updatedAt});
const i=clients.findIndex(c=>String(c.clientId||c.id)===String(currentId));if(i>=0)clients[i]={...clients[i],...d,clientId:currentId,updatedAt};
localStorage.setItem(CACHE,JSON.stringify(clients));if(!silent)show("Client updated successfully.","success");return true;
}catch(e){console.error(e);if(!silent)show(e.message||"Unable to update client.");return false}
finally{save.disabled=false;form.classList.remove("saving")}
}

/* CSV Export, Import & Template Download */
function downloadBlob(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

$("exportClientsBtn").addEventListener("click", () => {
  if (!clients.length) { alert("No clients to export."); return; }
  const headers = ["Client ID","Client Name","Legal Name","Constitution","Mobile","Email","PAN","Aadhaar","GSTIN","Branch ID","Address","Status","Notes","Created At"];
  const rows = clients.map(c => [
    `"${c.clientId||c.id||""}"`, `"${(c.clientName||"").replace(/"/g,'""')}"`, `"${(c.legalName||"").replace(/"/g,'""')}"`,
    `"${c.constitution||""}"`, `"${c.mobile||""}"`, `"${c.email||""}"`, `"${c.pan||""}"`, `"${c.adhar||""}"`,
    `"${c.gstin||""}"`, `"${c.branchId||""}"`, `"${(c.address||"").replace(/"/g,'""')}"`, `"${c.status||"Active"}"`,
    `"${(c.notes||"").replace(/"/g,'""')}"`, `"${c.createdAt||""}"`
  ]);
  const csv = [headers.join(","), ...rows.map(r => r.join(","))].join("\n");

});

$("importClientsBtn").addEventListener("click", () => $("csvFileInput").click());

$("csvFileInput").addEventListener("change", async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  const text = await file.text();
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (lines.length < 2) { alert("CSV is empty or missing data rows."); return; }

  const parseRow = row => {
    const res = []; let inQ = false, val = "";
    for (let i = 0; i < row.length; i++) {
      const c = row[i];
      if (c === '"') { if (inQ && row[i+1] === '"') { val += '"'; i++; } else inQ = !inQ; }
      else if (c === ',' && !inQ) { res.push(val.trim()); val = ""; }
      else val += c;
    }
    res.push(val.trim());
    return res;
  };

  const rows = lines.slice(1).map(parseRow);
  if (!confirm(`Import ${rows.length} client(s)?`)) { e.target.value = ""; return; }

  $("clientRefreshBtn").classList.add("spinning");
  try {
    let imported = 0;
    const now = new Date().toISOString();
    for (const r of rows) {
      const name = r[0]; if (!name) continue;
      await runTransaction(db, async tx => {
        const next = await nextId(tx);
        const record = {
          clientId: next.id, clientName: name, legalName: r[1]||"", constitution: r[2]||"",
          mobile: clean(r[3]), email: clean(r[4]).toLowerCase(), pan: upper(r[5]),
          adhar: clean(r[6]), gstin: upper(r[7]), branchId: clean(r[8]),
          address: r[9]||"", status: clean(r[10])||"Active", notes: r[11]||"",
          createdAt: now, updatedAt: now
        };
        tx.set(next.counter, { lastNumber: next.n, updatedAt: now }, { merge: true });
        tx.set(doc(db, "clients", next.id), record);
      });
      imported++;
    }
    localStorage.removeItem(CACHE);
    await load();
    alert(`Successfully imported ${imported} client(s).`);
  } catch (err) {
    console.error(err);
    alert("Error during import: " + err.message);
  } finally {
    $("clientRefreshBtn").classList.remove("spinning");
    e.target.value = "";
  }
});
