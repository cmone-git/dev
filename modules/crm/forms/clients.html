<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="stylesheet" href="../../../css/cm.css">
  <link rel="stylesheet" href="../../../css/forms.css">
  <link rel="stylesheet" href="../../../css/responsive.css">

  <script src="https://unpkg.com/lucide@latest"></script>

  <title>Clients — CM | BIZODIT</title>

  <style>
    .client-id-box {
      display:flex;
      align-items:center;
      gap:8px;
    }

    .client-id-box input {
      flex:1;
    }

    .id-status {
      min-width:24px;
      font-size:14px;
      text-align:center;
    }

    .list-toolbar {
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:12px;
      flex-wrap:wrap;
    }

    .list-search {
      flex:1 1 180px;
      min-width:150px;
    }

    .list-icon-btn {
      width:40px;
      height:40px;
      border:1px solid #d7dce2;
      background:#fff;
      border-radius:8px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }

    .list-icon-btn.active {
      background:#f1f4f7;
    }

    .add-form-btn {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      min-width:72px;
      height:40px;
      padding:0 12px;
    }

    .list-panel {
      display:block;
    }

    .list-panel.hidden,
    .entry-panel.hidden {
      display:none;
    }

    .data-list {
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .data-row {
      border:1px solid #e0e3e7;
      border-radius:10px;
      padding:12px 14px;
      background:#fff;
      cursor:pointer;
    }

    .data-row-main {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }

    .data-row-title {
      font-weight:600;
      font-size:15px;
    }

    .data-row-sub {
      margin-top:4px;
      color:#727983;
      font-size:12px;
    }

    .data-row-meta {
      text-align:right;
      font-size:12px;
      color:#727983;
      white-space:nowrap;
    }

    .empty-list {
      padding:28px 12px;
      text-align:center;
      color:#777;
      font-size:13px;
    }

    .filter-panel {
      display:none;
      margin-bottom:12px;
      padding:12px;
      border:1px solid #e0e3e7;
      border-radius:10px;
      background:#fafbfc;
    }

    .filter-panel.show {
      display:block;
    }

    .filter-panel .field {
      margin-bottom:8px;
    }

    .sort-menu {
      display:none;
      position:relative;
    }

    .sort-menu.show {
      display:block;
      margin-bottom:10px;
    }

    .sort-options {
      display:flex;
      gap:6px;
      flex-wrap:wrap;
    }

    .sort-option {
      border:1px solid #d7dce2;
      background:#fff;
      border-radius:7px;
      padding:7px 10px;
      font-size:12px;
      cursor:pointer;
    }

    .sort-option.active {
      background:#eef2f5;
      font-weight:600;
    }

    .form-message {
      display:none;
      margin:0 0 14px;
      padding:10px 12px;
      border-radius:8px;
      font-size:13px;
      line-height:1.4;
    }

    .form-message.show {
      display:block;
    }

    .form-message.error {
      background:#fff1f1;
      color:#b42318;
      border:1px solid #f3c2c2;
    }

    .form-message.success {
      background:#effaf3;
      color:#16723a;
      border:1px solid #b9e4c7;
    }

    .saving .save-text {
      opacity:.7;
    }

    .saving .save-icon {
      animation:spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform:rotate(360deg); }
    }
  </style>
</head>

<body>

<header class="cm-header">
  <div class="cm-header-inner">
    <div class="cm-header-left">
      <button class="menu-toggle" id="menuToggle" type="button">
        <i data-lucide="menu"></i>
      </button>

      <div class="cm-brand">
        <div class="cm-logo">CM</div>
        <div class="cm-brand-title">CM | BIZODIT</div>
      </div>
    </div>
  </div>
</header>

<main class="main">
  <div class="page">
    <div class="form-page">

      <section class="module-header">
        <div class="module-header-left">
          <button class="back-btn" onclick="history.back()" type="button">
            <i data-lucide="arrow-left"></i>
          </button>

          <div class="module-title">
            <h1>Clients</h1>
            <p>Create and manage client records</p>
            <div class="report-as-on">
              Date : <strong id="presentDate">--</strong>
            </div>
          </div>
        </div>
      </section>

      <div id="clientListPanel" class="form-section list-panel">
        <div class="list-toolbar">
          <input id="clientSearch" class="list-search" type="search" placeholder="Search clients...">
          <button id="clientSortBtn" class="list-icon-btn" type="button" title="Sort"><i data-lucide="arrow-up-down"></i></button>
          <button id="clientFilterBtn" class="list-icon-btn" type="button" title="Filter"><i data-lucide="list-filter"></i></button>
          <button id="addClientBtn" class="btn btn-primary add-form-btn" type="button"><i data-lucide="plus"></i>Add</button>
        </div>
        <div id="clientSortMenu" class="sort-menu">
          <div class="sort-options">
            <button class="sort-option active" data-sort="name">Name A–Z</button>
            <button class="sort-option" data-sort="name-desc">Name Z–A</button>
            <button class="sort-option" data-sort="id">Client ID</button>
            <button class="sort-option" data-sort="newest">Newest</button>
          </div>
        </div>
        <div id="clientFilterPanel" class="filter-panel">
          <div class="field">
            <label>Status</label>
            <select id="clientStatusFilter"><option value="">All Status</option><option value="Active">Active</option><option value="Inactive">Inactive</option></select>
          </div>
        </div>
        <div id="clientList" class="data-list"><div class="empty-list">Loading clients...</div></div>
      </div>

      <form class="form-section entry-panel hidden" id="clientForm">
        <h2>Client Entry</h2>

        <div id="formMessage" class="form-message"></div>

        <div class="form-grid">

          <div class="field">
            <label>Client ID</label>
            <div class="client-id-box">
              <input id="clientId" type="text" readonly placeholder="Generating...">
              <span id="idStatus" class="id-status"></span>
            </div>
          </div>

          <div class="field">
            <label>Client Name <span class="required">*</span></label>
            <input id="clientName" type="text" required
                   placeholder="Enter client name"
                   autocomplete="organization">
          </div>

          <div class="field">
            <label>Legal Name</label>
            <input id="legalName" type="text" placeholder="Legal / registered name">
          </div>

          <div class="field">
            <label>Constitution</label>
            <select id="constitution">
              <option value="">Select Constitution...</option>
              <option value="Proprietorship">Proprietorship</option>
              <option value="Partnership">Partnership</option>
              <option value="LLP">LLP</option>
              <option value="Private Limited">Private Limited</option>
              <option value="Public Limited">Public Limited</option>
              <option value="OPC">OPC</option>
              <option value="HUF">HUF</option>
              <option value="Trust">Trust</option>
              <option value="Society">Society</option>
              <option value="Individual">Individual</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="field">
            <label>Mobile</label>
            <input id="mobile" type="tel" inputmode="numeric"
                   maxlength="10" placeholder="10 digit mobile number">
          </div>

          <div class="field">
            <label>Email</label>
            <input id="email" type="email" placeholder="client@example.com">
          </div>

          <div class="field">
            <label>PAN</label>
            <input id="pan" type="text" maxlength="10"
                   placeholder="ABCDE1234F"
                   style="text-transform:uppercase">
          </div>

          <div class="field">
            <label>Aadhaar</label>
            <input id="adhar" type="text" inputmode="numeric"
                   maxlength="12" placeholder="12 digit Aadhaar">
          </div>

          <div class="field">
            <label>GSTIN</label>
            <input id="gstin" type="text" maxlength="15"
                   placeholder="15 digit GSTIN"
                   style="text-transform:uppercase">
          </div>

          <div class="field">
            <label>Branch ID</label>
            <input id="branchId" type="text" placeholder="Branch ID">
          </div>

          <div class="field full">
            <label>Address</label>
            <textarea id="address" rows="3"
                      placeholder="Complete address"></textarea>
          </div>

          <div class="field">
            <label>Status</label>
            <select id="status">
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>

          <div class="field">
            <label>Client Folder URL</label>
            <input id="clientFolderUrl" type="url"
                   placeholder="Google Drive / client folder URL">
          </div>

          <div class="field full">
            <label>Notes</label>
            <textarea id="notes" rows="3"
                      placeholder="Additional client information..."></textarea>
          </div>

        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="history.back()">
            Cancel
          </button>

          <button id="saveBtn" class="btn btn-primary" type="submit">
            <i class="save-icon" data-lucide="save"></i>
            <span class="save-text">Save Client</span>
          </button>
        </div>
      </form>

    </div>
  </div>
</main>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <a class="bottom-item" href="../../../index.html">
      <i data-lucide="house"></i>
      <span>HOME</span>
    </a>

    <a class="bottom-item" href="../../crm/crm.html">
      <i data-lucide="users-round"></i>
      <span>CRM</span>
    </a>

    <a class="bottom-item" href="../../accounts/accounts.html">
      <i data-lucide="wallet"></i>
      <span>ACCOUNTS</span>
    </a>

    <a class="bottom-item" href="../../settings/settings.html">
      <i data-lucide="settings-2"></i>
      <span>SETTINGS</span>
    </a>
  </div>
</nav>

<script type="module">
  import { formatIndianDate, todayISO } from "../../../js/date.js";

  /*
   * Firebase
   * ------------------------------------------------------------
   * This page expects your existing Firebase configuration.
   *
   * Firebase is loaded only from the shared js/firebase-config.js file.
   *
   * The Firestore structure used by this form is:
   *
   * clients/{clientId}
   * counters/clientCounter
   *
   * Client IDs are generated with a Firestore transaction on
   * counters/clientCounter, so two users saving at the same
   * time cannot receive the same Client ID.
   */

  import { db } from "../../../js/firebase-config.js";

  import {
    doc,
    runTransaction,
    collection,
    query,
    where,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

  const form = document.getElementById("clientForm");
  const saveBtn = document.getElementById("saveBtn");
  const clientIdInput = document.getElementById("clientId");
  const idStatus = document.getElementById("idStatus");
  const message = document.getElementById("formMessage");

  document.getElementById("presentDate").textContent =
    formatIndianDate(new Date());

  function showMessage(text, type = "error") {
    message.textContent = text;
    message.className = `form-message show ${type}`;
  }

  function clearMessage() {
    message.textContent = "";
    message.className = "form-message";
  }

  function clean(value) {
    return String(value || "").trim();
  }

  function upper(value) {
    return clean(value).toUpperCase();
  }

  /*
   * Generates the next Cxxxxx ID atomically.
   *
   * Example:
   * C40001
   * C40002
   * C40003
   *
   * The counter transaction is the important part:
   * it prevents duplicate IDs when two users save simultaneously.
   */
  async function getNextClientId(transaction) {
    const counterRef = doc(db, "counters", "clientCounter");
    const counterSnap = await transaction.get(counterRef);

    let nextNumber = 40001;

    if (counterSnap.exists()) {
      const current = Number(counterSnap.data().lastNumber);

      if (Number.isFinite(current) && current >= 40000) {
        nextNumber = current + 1;
      }
    }

    /*
     * IMPORTANT:
     * Every transaction READ must happen before any WRITE.
     *
     * We therefore only READ candidate client documents here.
     * The counter update and client document write happen later,
     * after all reads have completed.
     */
    while (true) {
      const candidateId =
        `C${String(nextNumber).padStart(5, "0")}`;

      const candidateRef =
        doc(db, "clients", candidateId);

      const candidateSnap =
        await transaction.get(candidateRef);

      if (!candidateSnap.exists()) {
        return {
          clientId: candidateId,
          counterRef,
          nextNumber
        };
      }

      nextNumber++;
    }
  }

  /*
   * Extra duplicate protection.
   *
   * Client ID itself is already protected by the counter
   * transaction. These checks stop accidental duplicate
   * records using the same PAN / GSTIN / mobile / email.
   */
  async function checkDuplicate(field, value) {
    if (!value) return false;

    const ref = collection(db, "clients");
    const q = query(ref, where(field, "==", value));
    const snap = await getDocs(q);

    return !snap.empty;
  }

  async function validateDuplicates() {
    const pan = upper(document.getElementById("pan").value);
    const gstin = upper(document.getElementById("gstin").value);
    const mobile = clean(document.getElementById("mobile").value);
    const email = clean(document.getElementById("email").value).toLowerCase();

    if (pan && await checkDuplicate("pan", pan)) {
      return "A client with this PAN already exists.";
    }

    if (gstin && await checkDuplicate("gstin", gstin)) {
      return "A client with this GSTIN already exists.";
    }

    if (mobile && await checkDuplicate("mobile", mobile)) {
      return "A client with this mobile number already exists.";
    }

    if (email && await checkDuplicate("email", email)) {
      return "A client with this email already exists.";
    }

    return "";
  }

  /*
   * ============================================================
   * CLIENT LIST VIEW
   * ============================================================
   */

  const clientListPanel = document.getElementById("clientListPanel");
  const addClientBtn = document.getElementById("addClientBtn");
  const clientSearch = document.getElementById("clientSearch");
  const clientSortBtn = document.getElementById("clientSortBtn");
  const clientFilterBtn = document.getElementById("clientFilterBtn");
  const clientSortMenu = document.getElementById("clientSortMenu");
  const clientFilterPanel = document.getElementById("clientFilterPanel");
  const clientStatusFilter = document.getElementById("clientStatusFilter");
  const clientList = document.getElementById("clientList");

  let clientSort = "name";

  function renderClientList() {
    const term = clean(clientSearch.value).toLowerCase();
    const status = clean(clientStatusFilter.value);

    let rows = [...clientsCache].filter(client => {
      const matchesSearch =
        !term ||
        String(client.clientId || "").toLowerCase().includes(term) ||
        String(client.clientName || "").toLowerCase().includes(term) ||
        String(client.mobile || "").toLowerCase().includes(term) ||
        String(client.gstin || "").toLowerCase().includes(term);

      const matchesStatus =
        !status || String(client.status || "") === status;

      return matchesSearch && matchesStatus;
    });

    rows.sort((a, b) => {
      if (clientSort === "name")
        return String(a.clientName || "").localeCompare(String(b.clientName || ""));
      if (clientSort === "name-desc")
        return String(b.clientName || "").localeCompare(String(a.clientName || ""));
      if (clientSort === "id")
        return String(a.clientId || "").localeCompare(String(b.clientId || ""), undefined, {numeric:true});
      if (clientSort === "newest")
        return String(b.createdAt || "").localeCompare(String(a.createdAt || ""));
      return 0;
    });

    if (!rows.length) {
      clientList.innerHTML = '<div class="empty-list">No clients found.</div>';
      return;
    }

    clientList.innerHTML = rows.map(client => `
      <div class="data-row" data-client-id="${String(client.clientId || client.id).replace(/"/g, '&quot;')}">
        <div class="data-row-main">
          <div>
            <div class="data-row-title">${escapeHtml(client.clientName || "Unnamed Client")}</div>
            <div class="data-row-sub">${escapeHtml(client.clientId || client.id || "")} · ${escapeHtml(client.mobile || client.email || "")}</div>
          </div>
          <div class="data-row-meta">${escapeHtml(client.status || "Active")}</div>
        </div>
      </div>
    `).join("");

    clientList.querySelectorAll(".data-row").forEach(row => {
      row.addEventListener("click", () => {
        const selected = findClientById(row.dataset.clientId);
        if (selected) fillClient(selected);
        clientListPanel.classList.add("hidden");
        form.classList.remove("hidden");
        window.scrollTo({top:0, behavior:"smooth"});
      });
    });
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function openClientForm() {
    form.reset();
    document.getElementById("status").value = "Active";
    clientIdInput.value = "";
    clientListPanel.classList.add("hidden");
    form.classList.remove("hidden");
    clearMessage();
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function openClientList() {
    form.classList.add("hidden");
    clientListPanel.classList.remove("hidden");
    renderClientList();
    window.scrollTo({top:0, behavior:"smooth"});
  }

  addClientBtn.addEventListener("click", openClientForm);
  clientSearch.addEventListener("input", renderClientList);
  clientStatusFilter.addEventListener("change", renderClientList);

  clientSortBtn.addEventListener("click", () => {
    clientSortMenu.classList.toggle("show");
  });

  clientFilterBtn.addEventListener("click", () => {
    clientFilterPanel.classList.toggle("show");
  });

  clientSortMenu.querySelectorAll(".sort-option").forEach(option => {
    option.addEventListener("click", () => {
      clientSort = option.dataset.sort;
      clientSortMenu.querySelectorAll(".sort-option").forEach(x => x.classList.remove("active"));
      option.classList.add("active");
      clientSortMenu.classList.remove("show");
      renderClientList();
    });
  });

  /*
   * Back button: list is the first view. If the entry form is open,
   * return to the list before leaving the page.
   */
  const originalBackButton = document.querySelector(".back-btn");
  if (originalBackButton) {
    originalBackButton.onclick = (event) => {
      event.preventDefault();
      if (!form.classList.contains("hidden")) {
        openClientList();
      } else {
        history.back();
      }
    };
  }

  /*
   * Form submit.
   *
   * Client ID generation and client document creation happen
   * inside ONE Firestore transaction.
   */
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    clearMessage();

    if (saveBtn.disabled) return;

    const clientName = clean(document.getElementById("clientName").value);

    if (!clientName) {
      showMessage("Client Name is required.");
      document.getElementById("clientName").focus();
      return;
    }

    const pan = upper(document.getElementById("pan").value);
    const gstin = upper(document.getElementById("gstin").value);
    const mobile = clean(document.getElementById("mobile").value);
    const email = clean(document.getElementById("email").value).toLowerCase();

    if (mobile && !/^[0-9]{10}$/.test(mobile)) {
      showMessage("Enter a valid 10 digit mobile number.");
      document.getElementById("mobile").focus();
      return;
    }

    if (pan && !/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(pan)) {
      showMessage("Enter a valid PAN.");
      document.getElementById("pan").focus();
      return;
    }

    if (gstin && !/^[0-9A-Z]{15}$/.test(gstin)) {
      showMessage("Enter a valid 15 digit GSTIN.");
      document.getElementById("gstin").focus();
      return;
    }

    saveBtn.disabled = true;
    form.classList.add("saving");
    saveBtn.querySelector(".save-text").textContent = "Saving...";
    idStatus.textContent = "…";

    try {
      const duplicateMessage = await validateDuplicates();

      if (duplicateMessage) {
        throw new Error(duplicateMessage);
      }

      const now = new Date().toISOString();

      await runTransaction(db, async (transaction) => {

        /*
         * ALL TRANSACTION READS happen first.
         */
        const result =
          await getNextClientId(transaction);

        const clientId =
          result.clientId;

        const clientRef =
          doc(db, "clients", clientId);

        /*
         * getNextClientId() has already read this candidate
         * document and confirmed that it does not exist.
         *
         * No further transaction.get() calls are made after
         * the first write.
         */

        const clientData = {
          clientId,
          clientName,
          legalName: clean(document.getElementById("legalName").value),
          constitution: clean(document.getElementById("constitution").value),
          address: clean(document.getElementById("address").value),
          mobile,
          email,
          pan,
          adhar: clean(document.getElementById("adhar").value),
          gstin,
          branchId: clean(document.getElementById("branchId").value),
          clientFolderUrl: clean(document.getElementById("clientFolderUrl").value),
          notes: clean(document.getElementById("notes").value),
          status: clean(document.getElementById("status").value) || "Active",
          createdAt: now,
          updatedAt: now
        };

        /*
         * ALL WRITES happen after ALL READS.
         */
        transaction.set(
          result.counterRef,
          {
            lastNumber: result.nextNumber,
            updatedAt: now
          },
          { merge: true }
        );

        transaction.set(
          clientRef,
          clientData
        );

        clientIdInput.value =
          clientId;
      });

      idStatus.textContent = "✓";
      showMessage(`Client ${clientIdInput.value} saved successfully.`, "success");

      form.reset();
      document.getElementById("status").value = "Active";

      /*
       * Keep the generated ID visible after reset.
       * The next ID is generated only when the next record is saved,
       * so unused IDs are not consumed.
       */
      clientIdInput.value = "";

      openClientList();

    } catch (error) {
      console.error(error);
      idStatus.textContent = "";

      showMessage(
        error?.message || "Unable to save client. Please try again."
      );
    } finally {
      saveBtn.disabled = false;
      form.classList.remove("saving");
      saveBtn.querySelector(".save-text").textContent = "Save Client";
    }
  });

  window.lucide.createIcons();
</script>

</body>
