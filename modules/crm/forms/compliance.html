<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="stylesheet" href="../../../css/cm.css">
  <link rel="stylesheet" href="../../../css/forms.css">
  <link rel="stylesheet" href="../../../css/responsive.css">

  <script src="https://unpkg.com/lucide@latest"></script>

  <title>Compliance — CM | BIZODIT</title>

  <style>
    .id-box {
      display:flex;
      align-items:center;
      gap:8px;
    }

    .id-box input {
      flex:1;
    }

    .id-status {
      min-width:24px;
      text-align:center;
      font-size:14px;
    }

    .list-toolbar {
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:12px;
      flex-wrap:wrap;
    }

    .list-search {
      flex:1 1 180px;
      min-width:150px;
    }

    .list-icon-btn {
      width:40px;
      height:40px;
      border:1px solid #d7dce2;
      background:#fff;
      border-radius:8px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }

    .list-icon-btn.active {
      background:#f1f4f7;
    }

    .add-form-btn {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      min-width:72px;
      height:40px;
      padding:0 12px;
    }

    .list-panel {
      display:block;
    }

    .list-panel.hidden,
    .entry-panel.hidden {
      display:none;
    }

    .data-list {
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .data-row {
      border:1px solid #e0e3e7;
      border-radius:10px;
      padding:12px 14px;
      background:#fff;
      cursor:pointer;
    }

    .data-row-main {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }

    .data-row-title {
      font-weight:600;
      font-size:15px;
    }

    .data-row-sub {
      margin-top:4px;
      color:#727983;
      font-size:12px;
    }

    .data-row-meta {
      text-align:right;
      font-size:12px;
      color:#727983;
      white-space:nowrap;
    }

    .empty-list {
      padding:28px 12px;
      text-align:center;
      color:#777;
      font-size:13px;
    }

    .filter-panel {
      display:none;
      margin-bottom:12px;
      padding:12px;
      border:1px solid #e0e3e7;
      border-radius:10px;
      background:#fafbfc;
    }

    .filter-panel.show {
      display:block;
    }

    .filter-panel .field {
      margin-bottom:8px;
    }

    .sort-menu {
      display:none;
      position:relative;
    }

    .sort-menu.show {
      display:block;
      margin-bottom:10px;
    }

    .sort-options {
      display:flex;
      gap:6px;
      flex-wrap:wrap;
    }

    .sort-option {
      border:1px solid #d7dce2;
      background:#fff;
      border-radius:7px;
      padding:7px 10px;
      font-size:12px;
      cursor:pointer;
    }

    .sort-option.active {
      background:#eef2f5;
      font-weight:600;
    }

    .form-message {
      display:none;
      margin:0 0 14px;
      padding:10px 12px;
      border-radius:8px;
      font-size:13px;
      line-height:1.4;
    }

    .form-message.show {
      display:block;
    }

    .form-message.error {
      background:#fff1f1;
      color:#b42318;
      border:1px solid #f3c2c2;
    }

    .form-message.success {
      background:#effaf3;
      color:#16723a;
      border:1px solid #b9e4c7;
    }

    .client-search-note {
      margin-top:5px;
      font-size:11px;
      color:#777;
    }

    .client-loading {
      opacity:.65;
    }

    .saving .save-icon {
      animation:spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform:rotate(360deg); }
    }
  </style>
</head>

<body>

<header class="cm-header">
  <div class="cm-header-inner">
    <div class="cm-header-left">
      <button class="menu-toggle" id="menuToggle" type="button">
        <i data-lucide="menu"></i>
      </button>

      <div class="cm-brand">
        <div class="cm-logo">CM</div>
        <div class="cm-brand-title">CM | BIZODIT</div>
      </div>
    </div>
  </div>
</header>

<main class="main">
  <div class="page">
    <div class="form-page">

      <section class="module-header">
        <div class="module-header-left">

          <button class="back-btn" onclick="history.back()" type="button">
            <i data-lucide="arrow-left"></i>
          </button>

          <div class="module-title">
            <h1>Compliance</h1>
            <p>Track client compliance work</p>
            <div class="report-as-on">
              Date : <strong id="presentDate">--</strong>
            </div>
          </div>

        </div>
      </section>

      <div id="complianceListPanel" class="form-section list-panel">
        <div class="list-toolbar">
          <input id="complianceSearch" class="list-search" type="search" placeholder="Search compliance...">
          <button id="complianceSortBtn" class="list-icon-btn" type="button" title="Sort"><i data-lucide="arrow-up-down"></i></button>
          <button id="complianceFilterBtn" class="list-icon-btn" type="button" title="Filter"><i data-lucide="list-filter"></i></button>
          <button id="addComplianceBtn" class="btn btn-primary add-form-btn" type="button"><i data-lucide="plus"></i>Add</button>
        </div>
        <div id="complianceSortMenu" class="sort-menu">
          <div class="sort-options">
            <button class="sort-option active" data-sort="due">Due Date</button>
            <button class="sort-option" data-sort="due-desc">Due Date Newest</button>
            <button class="sort-option" data-sort="client">Client</button>
            <button class="sort-option" data-sort="status">Status</button>
          </div>
        </div>
        <div id="complianceFilterPanel" class="filter-panel">
          <div class="field"><label>Status</label><select id="complianceStatusFilter"><option value="">All Status</option><option value="Pending">Pending</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option><option value="On Hold">On Hold</option><option value="Cancelled">Cancelled</option></select></div>
          <div class="field"><label>Payment</label><select id="compliancePaymentFilter"><option value="">All Payments</option><option value="Pending">Pending</option><option value="Paid">Paid</option><option value="Partial">Partial</option><option value="Not Applicable">Not Applicable</option></select></div>
        </div>
        <div id="complianceList" class="data-list"><div class="empty-list">Loading compliance...</div></div>
      </div>

      <form class="form-section entry-panel hidden" id="complianceForm">

        <h2>Compliance Entry</h2>

        <div id="formMessage" class="form-message"></div>

        <div class="form-grid">

          <!-- Firestore document ID -->
          <div class="field">
            <label>Compliance ID</label>
            <div class="id-box">
              <input id="complianceId" type="text" readonly
                     placeholder="Generated on save">
              <span id="idStatus" class="id-status"></span>
            </div>
          </div>

          <div class="field">
            <label>Client ID <span class="required">*</span></label>
            <input id="clientId" type="text" required
                   list="clientIdList"
                   placeholder="Search / select Client ID"
                   autocomplete="off"
                   style="text-transform:uppercase">
            <datalist id="clientIdList"></datalist>
          </div>

          <div class="field">
            <label>Client Name <span class="required">*</span></label>
            <input id="clientName" type="text" required
                   list="clientNameList"
                   placeholder="Search / select Client Name"
                   autocomplete="off">
            <datalist id="clientNameList"></datalist>
          </div>

          <div class="field">
            <label>Task Title <span class="required">*</span></label>
            <input id="taskTitle" type="text" required
                   placeholder="Example: ITR">
          </div>

          <div class="field">
            <label>Amount (₹)</label>
            <input id="amount" type="number" min="0" step="0.01"
                   placeholder="0.00">
          </div>

          <div class="field">
            <label>Due Date <span class="required">*</span></label>
            <input id="dueDate" type="date" required>
          </div>

          <div class="field">
            <label>Payment Status</label>
            <select id="paymentStatus">
              <option value="Pending">Pending</option>
              <option value="Paid">Paid</option>
              <option value="Partial">Partial</option>
              <option value="Not Applicable">Not Applicable</option>
            </select>
          </div>

          <div class="field">
            <label>Status</label>
            <select id="status">
              <option value="Pending">Pending</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
              <option value="On Hold">On Hold</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>

          <div class="field">
            <label>Created By</label>
            <input id="createdBy" type="text" value="Admin"
                   placeholder="Created by">
          </div>

          <div class="field full">
            <label>Narration</label>
            <textarea id="narration" rows="3"
                      placeholder="Enter compliance details..."></textarea>
          </div>

        </div>

        <div class="form-actions">

          <button type="button" class="btn btn-secondary"
                  onclick="history.back()">
            Cancel
          </button>

          <button id="saveBtn" class="btn btn-primary" type="submit">
            <i class="save-icon" data-lucide="save"></i>
            <span class="save-text">Save Compliance</span>
          </button>

        </div>

      </form>

    </div>
  </div>
</main>

<nav class="bottom-nav">
  <div class="bottom-nav-inner">

    <a class="bottom-item" href="../../../index.html">
      <i data-lucide="house"></i>
      <span>HOME</span>
    </a>

    <a class="bottom-item" href="../../crm/crm.html">
      <i data-lucide="users-round"></i>
      <span>CRM</span>
    </a>

    <a class="bottom-item" href="../../accounts/accounts.html">
      <i data-lucide="wallet"></i>
      <span>ACCOUNTS</span>
    </a>

    <a class="bottom-item" href="../../settings/settings.html">
      <i data-lucide="settings-2"></i>
      <span>SETTINGS</span>
    </a>

  </div>
</nav>

<script type="module">

  import { formatIndianDate, todayISO }
    from "../../../js/date.js";

  import { db } from "../../../js/firebase-config.js";

  import {
    doc,
    runTransaction,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  /*
   * ============================================================
   * PAGE SETUP
   * ============================================================
   */

  const form = document.getElementById("complianceForm");
  const saveBtn = document.getElementById("saveBtn");
  const message = document.getElementById("formMessage");
  const idInput = document.getElementById("complianceId");
  const idStatus = document.getElementById("idStatus");

  const dueDate = document.getElementById("dueDate");

  document.getElementById("presentDate").textContent =
    formatIndianDate(new Date());

  /*
   * Default due date = today.
   * User can change it before saving.
   */
  dueDate.value = todayISO();

  // Load existing clients for searchable Client ID / Client Name.
  loadClients();


  function clean(value) {
    return String(value || "").trim();
  }

  function upper(value) {
    return clean(value).toUpperCase();
  }

  function showMessage(text, type = "error") {
    message.textContent = text;
    message.className = `form-message show ${type}`;
  }

  function clearMessage() {
    message.textContent = "";
    message.className = "form-message";
  }


  /*
   * ============================================================
   * CLIENT SEARCH / AUTO FILL
   * ============================================================
   *
   * Client records are loaded from:
   *
   *   clients/{clientId}
   *
   * Selecting/searching either Client ID OR Client Name
   * automatically fills the other field.
   */

  const clientIdInput = document.getElementById("clientId");
  const clientNameInput = document.getElementById("clientName");
  const clientIdList = document.getElementById("clientIdList");
  const clientNameList = document.getElementById("clientNameList");

  let clientsCache = [];
  let clientsLoaded = false;

  function normalize(value) {
    return String(value || "").trim().toLowerCase();
  }

  function fillClient(client) {
    if (!client) return;

    clientIdInput.value =
      client.clientId || client.id || "";

    clientNameInput.value =
      client.clientName || "";

    clientIdInput.classList.remove("client-loading");
    clientNameInput.classList.remove("client-loading");
  }

  function findClientById(value) {
    const id = String(value || "").trim().toUpperCase();

    return clientsCache.find(client =>
      String(client.clientId || client.id || "")
        .trim()
        .toUpperCase() === id
    );
  }

  function findClientByName(value) {
    const name = normalize(value);

    return clientsCache.find(client =>
      normalize(client.clientName) === name
    );
  }

  async function loadClients() {
    try {
      clientIdInput.classList.add("client-loading");
      clientNameInput.classList.add("client-loading");

      const snapshot =
        await getDocs(collection(db, "clients"));

      clientsCache = snapshot.docs.map(item => {
        const data = item.data();

        return {
          id: item.id,
          ...data
        };
      }).filter(client =>
        client.clientId &&
        client.clientName
      );

      clientsCache.sort((a, b) =>
        String(a.clientName).localeCompare(
          String(b.clientName)
        )
      );

      clientIdList.innerHTML = "";
      clientNameList.innerHTML = "";

      clientsCache.forEach(client => {
        const idOption = document.createElement("option");
        idOption.value =
          client.clientId || client.id;
        clientIdList.appendChild(idOption);

        const nameOption = document.createElement("option");
        nameOption.value =
          client.clientName;
        clientNameList.appendChild(nameOption);
      });

      clientsLoaded = true;

      clientIdInput.classList.remove("client-loading");
      clientNameInput.classList.remove("client-loading");

    } catch (error) {

      console.error(
        "Unable to load clients:",
        error
      );

      clientIdInput.classList.remove("client-loading");
      clientNameInput.classList.remove("client-loading");

      showMessage(
        "Unable to load clients. Please check Firebase access."
      );
    }
  }

  clientIdInput.addEventListener("input", () => {
    if (!clientsLoaded) return;

    const client =
      findClientById(clientIdInput.value);

    if (client) {
      fillClient(client);
    }
  });

  clientNameInput.addEventListener("input", () => {
    if (!clientsLoaded) return;

    const client =
      findClientByName(clientNameInput.value);

    if (client) {
      fillClient(client);
    }
  });

  /*
   * If the user types a partial Client ID/name and then
   * leaves the field, try one final exact match.
   */
  clientIdInput.addEventListener("change", () => {
    const client =
      findClientById(clientIdInput.value);

    if (client) fillClient(client);
  });

  clientNameInput.addEventListener("change", () => {
    const client =
      findClientByName(clientNameInput.value);

    if (client) fillClient(client);
  });


  /*
   * ============================================================
   * COMPLIANCE ID
   * ============================================================
   *
   * FORMAT:
   *
   *     SYYMM0001
   *
   * Examples:
   *
   *     August 2026  -> S26080001
   *     August 2026  -> S26080002
   *     August 2026  -> S26080003
   *
   *     September 2026 -> S26090001
   *
   * The count restarts at 0001 for every month.
   *
   * Firestore counter:
   *
   * counters/compliance_2608
   *
   * counters/compliance_2609
   *
   * etc.
   *
   * The counter is incremented inside a Firestore transaction,
   * preventing duplicate IDs when multiple users save at once.
   */


  function getPeriodFromDate(dateString) {

    const date = new Date(`${dateString}T00:00:00`);

    if (Number.isNaN(date.getTime())) {
      throw new Error("Invalid compliance date.");
    }

    const year = String(date.getFullYear()).slice(-2);

    const month = String(
      date.getMonth() + 1
    ).padStart(2, "0");

    return {
      year,
      month,
      period: `${year}${month}`
    };
  }


  async function getNextComplianceId(transaction, dateString) {

    const { year, month, period } =
      getPeriodFromDate(dateString);

    const counterRef = doc(
      db,
      "counters",
      `compliance_${period}`
    );

    const counterSnap =
      await transaction.get(counterRef);

    let nextNumber = 1;

    if (counterSnap.exists()) {
      const lastNumber =
        Number(counterSnap.data().lastNumber);

      if (
        Number.isFinite(lastNumber) &&
        lastNumber >= 0
      ) {
        nextNumber =
          lastNumber + 1;
      }
    }

    /*
     * IMPORTANT:
     * All transaction READS happen before any WRITE.
     * Only return the unused ID here. The counter write is
     * performed by the caller after all reads are complete.
     */
    while (true) {

      const candidateId =
        `S${year}${month}${String(nextNumber).padStart(4, "0")}`;

      const candidateRef =
        doc(
          db,
          "compliances",
          candidateId
        );

      const candidateSnap =
        await transaction.get(candidateRef);

      if (!candidateSnap.exists()) {

        return {
          id: candidateId,
          counterRef,
          nextNumber,
          period
        };
      }

      nextNumber++;
    }
  }


  /*
   * ============================================================
   * COMPLIANCE LIST VIEW
   * ============================================================
   */

  const complianceListPanel = document.getElementById("complianceListPanel");
  const addComplianceBtn = document.getElementById("addComplianceBtn");
  const complianceSearch = document.getElementById("complianceSearch");
  const complianceSortBtn = document.getElementById("complianceSortBtn");
  const complianceFilterBtn = document.getElementById("complianceFilterBtn");
  const complianceSortMenu = document.getElementById("complianceSortMenu");
  const complianceFilterPanel = document.getElementById("complianceFilterPanel");
  const complianceStatusFilter = document.getElementById("complianceStatusFilter");
  const compliancePaymentFilter = document.getElementById("compliancePaymentFilter");
  const complianceList = document.getElementById("complianceList");

  let complianceRows = [];
  let complianceSort = "due";

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  async function loadComplianceList() {
    try {
      const snapshot = await getDocs(collection(db, "compliances"));
      complianceRows = snapshot.docs.map(item => ({
        id: item.id,
        ...item.data()
      }));
      renderComplianceList();
    } catch (error) {
      console.error("Unable to load compliance:", error);
      complianceList.innerHTML =
        '<div class="empty-list">Unable to load compliance records.</div>';
    }
  }

  function renderComplianceList() {
    const term = clean(complianceSearch.value).toLowerCase();
    const status = clean(complianceStatusFilter.value);
    const payment = clean(compliancePaymentFilter.value);

    let rows = complianceRows.filter(row => {
      const text =
        `${row.complianceID || row.id} ${row.clientId || ""} ${row.clientName || ""} ${row.taskTitle || ""}`.toLowerCase();

      return (!term || text.includes(term)) &&
        (!status || row.status === status) &&
        (!payment || row.paymentStatus === payment);
    });

    rows.sort((a, b) => {
      if (complianceSort === "due")
        return String(a.dueDate || "").localeCompare(String(b.dueDate || ""));
      if (complianceSort === "due-desc")
        return String(b.dueDate || "").localeCompare(String(a.dueDate || ""));
      if (complianceSort === "client")
        return String(a.clientName || "").localeCompare(String(b.clientName || ""));
      if (complianceSort === "status")
        return String(a.status || "").localeCompare(String(b.status || ""));
      return 0;
    });

    if (!rows.length) {
      complianceList.innerHTML = '<div class="empty-list">No compliance records found.</div>';
      return;
    }

    complianceList.innerHTML = rows.map(row => `
      <div class="data-row" data-compliance-id="${escapeHtml(row.id)}">
        <div class="data-row-main">
          <div>
            <div class="data-row-title">${escapeHtml(row.taskTitle || "Compliance")}</div>
            <div class="data-row-sub">${escapeHtml(row.complianceID || row.id)} · ${escapeHtml(row.clientName || row.clientId || "")}</div>
          </div>
          <div class="data-row-meta">${escapeHtml(row.dueDate || "")}<br>${escapeHtml(row.status || "Pending")}</div>
        </div>
      </div>
    `).join("");
  }

  function openComplianceForm() {
    form.reset();
    document.getElementById("paymentStatus").value = "Pending";
    document.getElementById("status").value = "Pending";
    document.getElementById("createdBy").value = "Admin";
    dueDate.value = todayISO();
    idInput.value = "";
    complianceListPanel.classList.add("hidden");
    form.classList.remove("hidden");
    clearMessage();
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function openComplianceList() {
    form.classList.add("hidden");
    complianceListPanel.classList.remove("hidden");
    loadComplianceList();
    window.scrollTo({top:0, behavior:"smooth"});
  }

  addComplianceBtn.addEventListener("click", openComplianceForm);
  complianceSearch.addEventListener("input", renderComplianceList);
  complianceStatusFilter.addEventListener("change", renderComplianceList);
  compliancePaymentFilter.addEventListener("change", renderComplianceList);

  complianceSortBtn.addEventListener("click", () => {
    complianceSortMenu.classList.toggle("show");
  });

  complianceFilterBtn.addEventListener("click", () => {
    complianceFilterPanel.classList.toggle("show");
  });

  complianceSortMenu.querySelectorAll(".sort-option").forEach(option => {
    option.addEventListener("click", () => {
      complianceSort = option.dataset.sort;
      complianceSortMenu.querySelectorAll(".sort-option").forEach(x => x.classList.remove("active"));
      option.classList.add("active");
      complianceSortMenu.classList.remove("show");
      renderComplianceList();
    });
  });

  const complianceBackButton = document.querySelector(".back-btn");
  if (complianceBackButton) {
    complianceBackButton.onclick = (event) => {
      event.preventDefault();
      if (!form.classList.contains("hidden")) {
        openComplianceList();
      } else {
        history.back();
      }
    };
  }

  /*
   * ============================================================
   * SAVE
   * ============================================================
   *
   * Document path:
   *
   *     compliances/{complianceId}
   *
   * Therefore:
   *
   *     compliances/S26080001
   *
   * The Compliance ID is BOTH:
   *
   * 1. Firestore document ID
   * 2. complianceID field
   */


  form.addEventListener("submit", async (event) => {

    event.preventDefault();

    clearMessage();

    if (saveBtn.disabled) {
      return;
    }


    const clientId =
      upper(document.getElementById("clientId").value);

    const clientName =
      clean(document.getElementById("clientName").value);

    const taskTitle =
      clean(document.getElementById("taskTitle").value);

    const dueDateValue =
      clean(document.getElementById("dueDate").value);


    if (!clientId) {
      showMessage("Client ID is required.");

      document.getElementById("clientId").focus();

      return;
    }


    if (!clientName) {
      showMessage("Client Name is required.");

      document.getElementById("clientName").focus();

      return;
    }

    // Client ID and Client Name must belong to the same existing client.
    const selectedClient = findClientById(clientId);

    if (
      !selectedClient ||
      normalize(selectedClient.clientName) !== normalize(clientName)
    ) {
      showMessage(
        "Please select a valid Client ID or Client Name from the client list."
      );

      document.getElementById("clientId").focus();

      return;
    }


    if (!taskTitle) {
      showMessage("Task Title is required.");

      document.getElementById("taskTitle").focus();

      return;
    }


    if (!dueDateValue) {
      showMessage("Due Date is required.");

      document.getElementById("dueDate").focus();

      return;
    }


    const amountValue =
      clean(document.getElementById("amount").value);

    const amount =
      amountValue === ""
        ? 0
        : Number(amountValue);


    if (!Number.isFinite(amount) || amount < 0) {

      showMessage("Enter a valid amount.");

      document.getElementById("amount").focus();

      return;
    }


    saveBtn.disabled = true;

    form.classList.add("saving");

    saveBtn.querySelector(".save-text").textContent =
      "Saving...";

    idStatus.textContent = "…";


    try {

      const now =
        new Date().toISOString();


      let generatedId = "";


      await runTransaction(
        db,
        async (transaction) => {

          /*
           * ALL transaction READS happen first.
           */
          const result =
            await getNextComplianceId(
              transaction,
              dueDateValue
            );

          generatedId =
            result.id;

          const complianceRef =
            doc(
              db,
              "compliances",
              generatedId
            );

          const data = {

            complianceID:
              generatedId,

            clientId,

            clientName,

            taskTitle,

            amount,

            createdAt:
              now,

            createdBy:
              clean(
                document.getElementById("createdBy").value
              ) || "Admin",

            dueDate:
              dueDateValue,

            narration:
              clean(
                document.getElementById("narration").value
              ),

            paymentStatus:
              clean(
                document.getElementById("paymentStatus").value
              ) || "Pending",

            status:
              clean(
                document.getElementById("status").value
              ) || "Pending",

            updatedAt:
              now
          };

          /*
           * ALL writes happen after all reads.
           */
          transaction.set(
            result.counterRef,
            {
              lastNumber:
                result.nextNumber,

              period:
                result.period,

              updatedAt:
                now
            },
            {
              merge: true
            }
          );

          transaction.set(
            complianceRef,
            data
          );

        }
      );


      idInput.value =
        generatedId;

      idStatus.textContent =
        "✓";


      showMessage(
        `Compliance ${generatedId} saved successfully.`,
        "success"
      );


      /*
       * Reset the form after successful save.
       * The counter is NOT reset.
       */
      form.reset();

      document.getElementById("paymentStatus").value =
        "Pending";

      document.getElementById("status").value =
        "Pending";

      document.getElementById("createdBy").value =
        "Admin";

      dueDate.value =
        todayISO();

      /*
       * ID is cleared after showing success.
       * The next save gets the next monthly number.
       */
      idInput.value =
        "";


    } catch (error) {

      console.error(
        "Compliance save error:",
        error
      );

      idStatus.textContent =
        "";

      showMessage(
        error?.message ||
        "Unable to save compliance. Please try again."
      );

    } finally {

      saveBtn.disabled =
        false;

      form.classList.remove(
        "saving"
      );

      saveBtn.querySelector(".save-text").textContent =
        "Save Compliance";

    }

  });


  window.lucide.createIcons();

</script>

</body>
</html>
