<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="theme-color" content="#0b3b66">

<link rel="icon" type="image/png" href="assets/logo-app.png">
<link rel="stylesheet" href="css/cm.css">

<script src="https://unpkg.com/lucide@latest"></script>

<title>404 — Page Not Found | CM | BIZODIT</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#f4f6f8;
}

.error-page{
  width:100%;
  max-width:520px;

  padding:25px;

  text-align:center;
}

.error-card{
  background:#fff;

  border:1px solid #d8dee5;

  border-radius:12px;

  padding:40px 28px;

  box-shadow:
    0 8px 30px rgba(16,32,57,.05);
}

.error-logo{
  width:48px;
  height:48px;

  margin:0 auto 20px;

  border-radius:9px;

  background:#0b3b66;

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:19px;
  font-weight:700;
}

.error-code{
  margin:0;

  color:#0b3b66;

  font-size:72px;
  line-height:1;

  font-weight:700;

  letter-spacing:-3px;
}

.error-title{
  margin:18px 0 7px;

  color:#202b36;

  font-size:20px;
  font-weight:700;
}

.error-text{
  margin:0 auto;

  max-width:390px;

  color:#687583;

  font-size:13px;

  line-height:1.6;
}

.error-actions{
  display:flex;

  justify-content:center;

  gap:8px;

  margin-top:25px;

  flex-wrap:wrap;
}

.error-actions .btn{
  min-width:120px;
}

.error-footer{
  margin-top:18px;

  color:#8a95a3;

  font-size:10px;
}

@media(max-width:480px){

  .error-page{
    padding:15px;
  }

  .error-card{
    padding:32px 20px;
  }

  .error-code{
    font-size:62px;
  }

  .error-title{
    font-size:18px;
  }

}

</style>

</head>

<body>

<main class="error-page">

  <section class="error-card">

    <div class="error-logo">
      CM
    </div>

    <h1 class="error-code">
      404
    </h1>

    <h2 class="error-title">
      Page not found
    </h2>

    <p class="error-text">
      The page you're looking for doesn't exist,
      may have been moved, or is temporarily unavailable.
    </p>

    <div class="error-actions">

      <button
        class="btn btn-primary"
        type="button"
        onclick="location.href='index.html'">

        <i data-lucide="house"></i>

        Go Home

      </button>

      <button
        class="btn btn-secondary"
        type="button"
        onclick="history.back()">

        <i data-lucide="arrow-left"></i>

        Go Back

      </button>

    </div>

  </section>

  <div class="error-footer">
    CM | BIZODIT · Business Management
  </div>

</main>

<script>
  window.lucide?.createIcons();
</script>

</body>
</html>
