<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6f8">
<title>BizOdit — Page Not Found</title>
<style>
:root{
  --brand:#0b3b66;
  --soft:#e8f1f7;
  --bg:#f4f6f8;
  --card:#fff;
  --text:#202b36;
  --muted:#687583;
  --line:#d7dee5;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg)}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
.wrap{
  width:min(430px,100%);
  text-align:center;
}
.logo{
  width:64px;
  height:64px;
  object-fit:contain;
  margin:0 auto 22px;
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  padding:34px 25px 28px;
}
.code{
  color:var(--brand);
  font-size:64px;
  line-height:1;
  font-weight:850;
  letter-spacing:-.05em;
}
h1{
  margin:15px 0 7px;
  font-size:22px;
  letter-spacing:-.02em;
}
p{
  margin:0 auto;
  max-width:320px;
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}
.actions{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:24px;
}
button{
  height:43px;
  border-radius:7px;
  padding:0 17px;
  font:700 12px inherit;
  cursor:pointer;
}
.primary{
  border:1px solid var(--brand);
  background:var(--brand);
  color:#fff;
}
.secondary{
  border:1px solid var(--line);
  background:#fff;
  color:var(--brand);
}
.footer{
  margin-top:16px;
  color:#8a949d;
  font-size:10px;
}
.icon{
  width:50px;
  height:50px;
  margin:0 auto 12px;
  border-radius:9px;
  background:var(--soft);
  color:var(--brand);
  display:grid;
  place-items:center;
}
.icon svg{
  width:25px;
  height:25px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.7;
  stroke-linecap:round;
  stroke-linejoin:round;
}
@media(max-width:400px){
  body{padding:14px}
  .card{padding:28px 20px 24px}
  .code{font-size:56px}
  .actions{flex-direction:column}
  button{width:100%}
}
</style>
</head>
<body>

<main class="wrap">

  <img src="assets/logo.png" alt="BizOdit" class="logo">

  <section class="card">

    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/>
        <path d="M4 5.5v15"/>
        <path d="M8 7h8M8 11h6"/>
      </svg>
    </div>

    <div class="code">404</div>

    <h1>Page not found</h1>

    <p>
      The page you are looking for doesn't exist, has been moved,
      or may no longer be available.
    </p>

    <div class="actions">
      <button class="primary" type="button" id="homeBtn">Go to Dashboard</button>
      <button class="secondary" type="button" id="backBtn">Go Back</button>
    </div>

  </section>

  <div class="footer">BizOdit • Business Management</div>

</main>

<script>
document.getElementById("homeBtn").onclick=()=>{
  window.location.href="index.html";
};

document.getElementById("backBtn").onclick=()=>{
  if(history.length>1) history.back();
  else window.location.href="index.html";
};
</script>

</body>
</html>
