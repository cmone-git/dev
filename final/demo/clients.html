<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Clients - BizOdit</title>

<style>
:root{
  --brand:#0b3b66;
  --bg:#f4f6f8;
  --card:#fff;
  --text:#202b36;
  --muted:#687583;
  --line:#d7dee5;
  --green:#23794f;
  --red:#b74646;
  --amber:#9b6a19;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,
  "Segoe UI",Roboto,Arial,sans-serif;
  font-size:15px;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

svg{
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.page{
  padding:18px 24px 30px;
  max-width:1280px;
  margin:auto;
}

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px;
  margin-bottom:16px;
}

.page-title{
  font-size:27px;
  line-height:1.1;
  margin:0;
  letter-spacing:-.025em;
}

.page-sub{
  font-size:14px;
  color:var(--muted);
  margin-top:5px;
}

.report{
  font-size:14px;
  color:var(--muted);
  margin-top:5px;
}

.report strong{
  color:var(--brand);
}

.refresh{
  width:50px;
  height:50px;
  flex:0 0 50px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:8px;
  color:var(--brand);
  display:grid;
  place-items:center;
}

.refresh svg{
  width:23px;
  height:23px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px;
}

.toolbar{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:14px 0;
}

.search{
  height:40px;
  min-width:220px;
  flex:1;
  border:1px solid var(--line);
  border-radius:7px;
  padding:0 11px;
  background:#fff;
  color:var(--text);
  outline:none;
}

.search:focus,
.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--brand);
}

.tool{
  height:40px;
  padding:0 12px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;
  color:var(--brand);
  font-weight:600;
  display:inline-flex;
  align-items:center;
  gap:6px;
}

.tool.primary{
  background:var(--brand);
  border-color:var(--brand);
  color:#fff;
}

.tool svg{
  width:18px;
  height:18px;
}

.section{
  margin-top:14px;
}

.section-title{
  font-size:20px;
  margin:0 0 4px;
}

.section-sub{
  font-size:14px;
  color:var(--muted);
}

.table-wrap{
  overflow:auto;
  margin-top:14px;
}

.table{
  width:100%;
  min-width:900px;
  border-collapse:collapse;
}

.table th,
.table td{
  padding:10px;
  border-bottom:1px solid #edf0f2;
  text-align:left;
  font-size:13px;
  white-space:nowrap;
}

.table th{
  background:#fafbfc;
  color:#5f6d79;
  font-weight:600;
}

.table td strong{
  font-size:14px;
}

.mobile-list{
  display:none;
}

.mobile-item{
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px;
  background:#fff;
  margin-bottom:10px;
}

.mobile-title{
  font-size:16px;
  font-weight:700;
  color:var(--brand);
  margin-bottom:8px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:7px 0;
  border-bottom:1px solid #edf0f2;
}

.row:last-child{
  border-bottom:0;
}

.label{
  font-size:13px;
  color:var(--muted);
}

.value{
  text-align:right;
  font-size:14px;
  font-weight:600;
  word-break:break-word;
}

.status{
  display:inline-flex;
  padding:4px 8px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.status.active,
.status.paid,
.status.completed{
  background:#eaf7ef;
  color:var(--green);
}

.status.pending{
  background:#fff6df;
  color:#8a5a00;
}

.status.overdue{
  background:#fff0f0;
  color:var(--red);
}

.status.inactive{
  background:#f0f2f4;
  color:#687583;
}

.action{
  width:40px;
  height:40px;
  border:1px solid var(--line);
  background:#fff;
  border-radius:7px;
  color:var(--brand);
  display:inline-grid;
  place-items:center;
}

.action svg{
  width:18px;
  height:18px;
}

.actions{
  display:flex;
  gap:5px;
}

.empty{
  padding:30px;
  text-align:center;
  color:var(--muted);
}

.message{
  display:none;
  padding:9px 11px;
  border-radius:7px;
  margin:10px 0;
  font-size:13px;
}

.message.show{
  display:block;
}

.message.error{
  background:#fff0f0;
  color:var(--red);
}

.message.success{
  background:#eff8f3;
  color:var(--green);
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.full{
  grid-column:1/-1;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  min-height:44px;
  border:1px solid var(--line);
  border-radius:7px;
  padding:8px 10px;
  background:#fff;
  color:var(--text);
  outline:0;
}

.field textarea{
  min-height:80px;
  resize:vertical;
}

.locked{
  background:#f1f4f6!important;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:14px;
}

.btn{
  min-height:44px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;
  color:var(--brand);
  font-weight:600;
}

.btn.primary{
  background:var(--brand);
  color:#fff;
  border-color:var(--brand);
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(10,25,38,.45);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.modal.open{
  display:flex;
}

.modal-box{
  background:#fff;
  width:min(760px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:10px;
  padding:16px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.modal-head h2{
  margin:0;
  font-size:20px;
}

.close{
  width:40px;
  height:40px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;
  color:var(--brand);
  font-size:22px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translate(-50%,15px);
  opacity:0;
  background:#17232d;
  color:#fff;
  padding:9px 13px;
  border-radius:7px;
  font-size:13px;
  z-index:200;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(max-width:760px){

  .page{
    padding:18px 24px 30px;
  }

  .table-wrap{
    display:none;
  }

  .mobile-list{
    display:block;
    margin-top:14px;
  }

  .toolbar .search{
    flex-basis:100%;
    min-width:0;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .modal{
    align-items:flex-end;
    padding:0;
  }

  .modal-box{
    width:100%;
    max-height:92vh;
    border-radius:10px 10px 0 0;
  }
}
</style>
</head>

<body>

<main class="page">

  <div class="page-head">

    <div>
      <h1 class="page-title">Clients</h1>

      <div class="page-sub">
        Client master and relationship information
      </div>

      <div class="report">
        Report as on :
        <strong id="today"></strong>
      </div>
    </div>

    <button class="refresh" onclick="loadClients()">

      <svg viewBox="0 0 24 24">
        <path d="M20 11a8 8 0 0 0-14.7-4L3 10"/>
        <path d="M3 5v5h5"/>
        <path d="M4 13a8 8 0 0 0 14.7 4L21 14"/>
        <path d="M21 19v-5h-5"/>
      </svg>

    </button>

  </div>


  <div class="toolbar">

    <input
      class="search"
      id="search"
      placeholder="Search Client ID, name, mobile, email, PAN or GSTIN">

    <button class="tool primary" onclick="openForm()">
      ＋ Add Client
    </button>

    <button class="tool" onclick="exportCSV()">
      Export CSV
    </button>

  </div>


  <section class="section card">

    <h2 class="section-title">
      Client List
    </h2>

    <div class="section-sub" id="count">
      Loading clients...
    </div>


    <div class="table-wrap">

      <table class="table">

        <thead>
          <tr>
            <th>Client ID</th>
            <th>Client Name</th>
            <th>Email</th>
            <th>Mobile</th>
            <th>PAN</th>
            <th>GSTIN</th>
            <th>Branch</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="tableBody"></tbody>

      </table>

    </div>


    <div
      class="mobile-list"
      id="mobileList">
    </div>

  </section>

</main>


<div class="modal" id="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">
        Add Client
      </h2>

      <button
        class="close"
        onclick="closeForm()">
        ×
      </button>

    </div>


    <div
      id="message"
      class="message">
    </div>


    <div class="form-grid">

      <div class="field">
        <label>Client ID</label>
        <input id="ClientId" class="locked" readonly>
      </div>

      <div class="field">
        <label>Client Name *</label>
        <input id="ClientName">
      </div>

      <div class="field">
        <label>Mobile *</label>
        <input id="Mobile" inputmode="tel">
      </div>

      <div class="field">
        <label>Email</label>
        <input id="Email" type="email">
      </div>

      <div class="field">
        <label>Constitution</label>
        <input id="Constitution">
      </div>

      <div class="field">
        <label>Status</label>
        <select id="Status">
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>
      </div>

      <div class="field">
        <label>PAN</label>
        <input id="Pan">
      </div>

      <div class="field">
        <label>GSTIN</label>
        <input id="Gstin">
      </div>

      <div class="field">
        <label>Aadhaar</label>
        <input id="Adhar">
      </div>

      <div class="field">
        <label>Branch ID</label>
        <input id="BranchId">
      </div>

      <div class="field full">
        <label>Client Folder URL</label>
        <input id="ClientFolderLinkUrl">
      </div>

      <div class="field full">
        <label>Notes</label>
        <textarea id="Notes"></textarea>
      </div>

    </div>


    <div class="form-actions">

      <button class="btn" onclick="closeForm()">
        Cancel
      </button>

      <button
        class="btn primary"
        id="saveBtn"
        onclick="saveClient()">
        Save
      </button>

    </div>

  </div>

</div>


<div class="toast" id="toast"></div>


<script>

const params=new URLSearchParams(location.search);

const CONFIG={
  WEB_APP_URL:
    params.get("webAppUrl") ||
    localStorage.getItem("bizodit_web_app_url") ||
    "",
  SHEET_ID:
    params.get("sheetId") ||
    localStorage.getItem("bizodit_sheet_id") ||
    ""
};

if(CONFIG.WEB_APP_URL)
  localStorage.setItem("bizodit_web_app_url",CONFIG.WEB_APP_URL);

if(CONFIG.SHEET_ID)
  localStorage.setItem("bizodit_sheet_id",CONFIG.SHEET_ID);


let clients=[];
let editing=null;


function $(id){
  return document.getElementById(id);
}


function today(){

  const d=new Date();

  return String(d.getDate()).padStart(2,"0")+
    "/"+
    String(d.getMonth()+1).padStart(2,"0")+
    "/"+
    d.getFullYear();

}

$("today").textContent=today();


function esc(v){

  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function toast(text){

  $("toast").textContent=text;
  $("toast").classList.add("show");

  setTimeout(()=>{
    $("toast").classList.remove("show");
  },2200);

}


function status(v){

  const value=v||"Pending";

  const cls=
    String(value)
      .toLowerCase()
      .replaceAll(" ","");

  return `<span class="status ${cls}">
    ${esc(value)}
  </span>`;

}


async function api(action,data={}){

  if(!CONFIG.WEB_APP_URL)
    throw new Error("Apps Script URL is missing.");

  const url=new URL(CONFIG.WEB_APP_URL);

  url.searchParams.set("action",action);

  Object.entries(data).forEach(([key,value])=>{

    if(value!==undefined && value!==null){

      url.searchParams.set(
        key,
        typeof value==="object"
          ? JSON.stringify(value)
          : value
      );

    }

  });

  const response=await fetch(url.toString());

  const result=await response.json();

  if(!result.ok)
    throw new Error(result.error||"Apps Script error.");

  return result;

}


async function loadClients(){

  $("count").textContent="Loading clients...";

  try{

    const result=await api("list",{
      sheet:"Clients"
    });

    clients=result.data||[];

    render();

    $("count").textContent=
      clients.length+
      (clients.length===1?" client":" clients")+
      " from Apps Script";

  }
  catch(error){

    $("count").textContent="Unable to load clients.";
    toast(error.message);

  }

}


function filtered(){

  const q=
    $("search").value
      .trim()
      .toLowerCase();

  if(!q) return clients;

  return clients.filter(x=>

    [
      x.ClientId,
      x.ClientName,
      x.Email,
      x.Mobile,
      x.Pan,
      x.Gstin,
      x.BranchId,
      x.Status
    ]
    .join(" ")
    .toLowerCase()
    .includes(q)

  );

}


function render(){

  const rows=filtered();

  $("tableBody").innerHTML=rows.map(x=>`

    <tr>

      <td><strong>${esc(x.ClientId)}</strong></td>

      <td>${esc(x.ClientName)}</td>

      <td>${esc(x.Email)}</td>

      <td>${esc(x.Mobile)}</td>

      <td>${esc(x.Pan)}</td>

      <td>${esc(x.Gstin)}</td>

      <td>${esc(x.BranchId)}</td>

      <td>${status(x.Status)}</td>

      <td>

        <button
          class="action"
          onclick="editClient(${JSON.stringify(x).replaceAll('"','&quot;')})">

          <svg viewBox="0 0 24 24">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/>
          </svg>

        </button>

      </td>

    </tr>

  `).join("")||`

    <tr>
      <td colspan="9" class="empty">
        No clients found.
      </td>
    </tr>

  `;


  $("mobileList").innerHTML=rows.map(x=>`

    <div class="mobile-item">

      <div class="mobile-title">
        ${esc(x.ClientName||"Unnamed")}
        <span style="font-size:12px;color:var(--muted)">
          • ${esc(x.ClientId)}
        </span>
      </div>

      ${[
        ["Mobile",x.Mobile],
        ["Email",x.Email],
        ["PAN",x.Pan],
        ["GSTIN",x.Gstin],
        ["Branch",x.BranchId],
        ["Status",x.Status]
      ].map(a=>`

        <div class="row">

          <span class="label">${a[0]}</span>

          <span class="value">
            ${a[0]==="Status"
              ?status(a[1])
              :esc(a[1]||"—")}
          </span>

        </div>

      `).join("")}

      <div class="actions"
           style="justify-content:flex-end;margin-top:8px">

        <button
          class="action"
          onclick="editClient(${JSON.stringify(x).replaceAll('"','&quot;')})">

          <svg viewBox="0 0 24 24">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/>
          </svg>

        </button>

      </div>

    </div>

  `).join("")||`

    <div class="empty">
      No clients found.
    </div>

  `;

}


$("search").addEventListener(
  "input",
  render
);


function openForm(data=null){

  editing=data;

  $("modalTitle").textContent=
    data?"Edit Client":"Add Client";

  $("message").className="message";
  $("message").textContent="";

  const fields=[
    "ClientId",
    "ClientName",
    "Mobile",
    "Email",
    "Constitution",
    "Status",
    "Pan",
    "Gstin",
    "Adhar",
    "BranchId",
    "ClientFolderLinkUrl",
    "Notes"
  ];

  fields.forEach(id=>{

    $(id).value=
      data?.[id]??"";

  });

  if(!data)
    $("Status").value="Active";

  $("modal").classList.add("open");

}


function editClient(data){

  openForm(data);

}


function closeForm(){

  $("modal").classList.remove("open");

}


function formData(){

  return {

    ClientId:$("ClientId").value.trim(),

    ClientName:$("ClientName").value.trim(),

    Mobile:$("Mobile").value.trim(),

    Email:$("Email").value.trim(),

    Constitution:$("Constitution").value.trim(),

    Status:$("Status").value,

    Pan:$("Pan").value.trim(),

    Gstin:$("Gstin").value.trim(),

    Adhar:$("Adhar").value.trim(),

    BranchId:$("BranchId").value.trim(),

    ClientFolderLinkUrl:
      $("ClientFolderLinkUrl").value.trim(),

    Notes:$("Notes").value.trim()

  };

}


async function saveClient(){

  const record=formData();

  if(!record.ClientName){

    showMessage("Client Name is required.");
    return;

  }

  if(!record.Mobile){

    showMessage("Mobile is required.");
    return;

  }

  $("saveBtn").disabled=true;
  $("saveBtn").textContent="Saving...";

  try{

    await api(
      editing?"update":"create",
      {
        sheet:"Clients",
        key:editing?.ClientId||"",
        record
      }
    );

    closeForm();

    await loadClients();

    toast(
      editing
        ?"Client updated"
        :"Client created"
    );

  }
  catch(error){

    showMessage(error.message);

  }
  finally{

    $("saveBtn").disabled=false;
    $("saveBtn").textContent="Save";

  }

}


function showMessage(text){

  $("message").textContent=text;
  $("message").className="message show error";

}


function exportCSV(){

  const rows=filtered();

  if(!rows.length){

    toast("No data to export.");
    return;

  }

  const keys=Object.keys(rows[0]);

  const csv=[
    keys,
    ...rows.map(row=>
      keys.map(key=>
        String(row[key]??"")
          .replaceAll('"','""')
      )
    )
  ]
  .map(row=>
    row.map(value=>`"${value}"`).join(",")
  )
  .join("\n");

  const blob=new Blob(
    ["\ufeff"+csv],
    {type:"text/csv;charset=utf-8"}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download="BizOdit_Clients.csv";

  a.click();

  URL.revokeObjectURL(url);

}


loadClients();

</script>

</body>
</html>
