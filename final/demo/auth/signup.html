<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#f4f6f8">
<title>Create Account — BizOdit</title>
<style>
:root{--brand:#0b3b66;--bg:#f4f6f8;--card:#fff;--text:#202b36;--muted:#687583;--line:#d7dee5;--danger:#b84a4a;--success:#247a50}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:22px}
.auth-shell{width:min(470px,100%)}
.brand{text-align:center;margin-bottom:18px}
.logo{width:56px;height:56px;object-fit:contain;display:block;margin:0 auto 10px}
.brand-name{font-size:25px;font-weight:800;color:var(--brand);letter-spacing:-.03em}
.brand-sub{font-size:12px;color:var(--muted);margin-top:3px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:25px;box-shadow:0 8px 30px rgba(20,35,50,.06)}
h1{font-size:23px;margin:0 0 6px}.lead{font-size:13px;color:var(--muted);margin:0 0 21px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{margin-bottom:14px}.full{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:750;margin-bottom:7px}
input{width:100%;height:46px;border:1px solid #cfd7df;border-radius:8px;padding:0 12px;font-size:14px;color:var(--text);background:#fff;outline:none}
input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,59,102,.08)}
.password-input{padding-right:48px}.input-wrap{position:relative}
.eye{position:absolute;right:5px;top:4px;width:37px;height:37px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;border-radius:6px}
.eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hint{font-size:9px;color:var(--muted);margin-top:5px}
.primary{width:100%;height:48px;border:0;border-radius:8px;background:var(--brand);color:#fff;font-weight:750;font-size:14px;margin-top:2px}
.primary:disabled{opacity:.65}
.message{display:none;padding:10px 12px;border-radius:7px;font-size:11px;margin-bottom:15px;line-height:1.45}.message.show{display:block}.message.error{background:#fceeee;color:var(--danger)}.message.success{background:#edf8f2;color:var(--success)}
.bottom{text-align:center;margin-top:17px;font-size:11px;color:var(--muted)}
.bottom button{border:0;background:none;color:var(--brand);font-weight:750;font-size:11px}
.support{display:flex;justify-content:center;margin-top:16px}
.support a{display:inline-flex;align-items:center;gap:7px;color:var(--brand);text-decoration:none;font-size:11px;font-weight:700}
.support a:hover{text-decoration:underline}
.support-icon{width:18px;height:18px;display:grid;place-items:center}
.support-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.footer{text-align:center;color:#8a949d;font-size:10px;margin-top:15px}
@media(max-width:500px){body{padding:14px}.card{padding:20px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<main class="auth-shell">
  <div class="brand">
    <img src="../assets/logo.png" class="logo" alt="BizOdit">
    <div class="brand-name">BizOdit</div>
    <div class="brand-sub">Business Management</div>
  </div>

  <section class="card">
    <h1>Create your account</h1>
    <p class="lead">Create a secure BizOdit account to access your workspace.</p>

    <div id="message" class="message"></div>

    <form id="signupForm" novalidate>
      <div class="grid">

        <div class="field">
          <label for="name">Full name *</label>
          <input id="name" type="text" autocomplete="name" placeholder="Your full name" required>
        </div>

        <div class="field">
          <label for="mobile">Mobile number *</label>
          <input id="mobile" type="tel" inputmode="numeric" autocomplete="tel" maxlength="10" placeholder="10-digit mobile" required>
          <div class="hint">Indian mobile number</div>
        </div>

        <div class="field full">
          <label for="email">Email address *</label>
          <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="password">Password *</label>
          <div class="input-wrap">
            <input id="password" class="password-input" type="password" autocomplete="new-password" placeholder="Minimum 6 characters" required>
            <button class="eye" type="button" id="togglePassword" aria-label="View password">
              <svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="confirm">Confirm password *</label>
          <div class="input-wrap">
            <input id="confirm" class="password-input" type="password" autocomplete="new-password" placeholder="Re-enter password" required>
            <button class="eye" type="button" id="toggleConfirm" aria-label="View password">
              <svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
            </button>
          </div>
        </div>

      </div>

      <button class="primary" id="signupButton" type="submit">Create Account</button>
    </form>

    <div class="bottom">
      Already have an account?
      <button type="button" id="signinButton">Sign In</button>
    </div>

    <div class="support">
      <a id="supportLink" href="#" target="_blank" rel="noopener" aria-label="Contact Support">
        <span class="support-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M21 15a4 4 0 0 1-4 4H8l-5 3 1.5-4.5A8 8 0 1 1 21 15Z"/>
            <path d="M8 12h.01M12 12h.01M16 12h.01"/>
          </svg>
        </span>
        <span>Support</span>
      </a>
    </div>
  </section>

  <div class="footer">Secure account registration • BizOdit</div>
</main>

<script type="module">
import { auth, db } from "../js/firebase-config.js";
import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const $=id=>document.getElementById(id);
const form=$("signupForm"), button=$("signupButton"), msg=$("message");

function showMessage(text,type="error"){
  msg.textContent=text;
  msg.className="message show "+type;
}
function clearMessage(){msg.className="message";msg.textContent=""}

function setupEye(buttonId,inputId){
  $(buttonId).addEventListener("click",()=>{
    const input=$(inputId);
    input.type=input.type==="password"?"text":"password";
  });
}
setupEye("togglePassword","password");
setupEye("toggleConfirm","confirm");

$("mobile").addEventListener("input",e=>{
  e.target.value=e.target.value.replace(/\D/g,"").slice(0,10);
});

$("signinButton").addEventListener("click",()=>{
  location.assign("signin.html");
});

const supportText="Hi, BizOdit User Login Issue, I need assistance with my BizOdit account login.";
$("supportLink").href="https://wa.me/919946151111?text="+encodeURIComponent(supportText);

form.addEventListener("submit",async e=>{
  e.preventDefault();
  clearMessage();

  const name=$("name").value.trim();
  const mobile=$("mobile").value.trim();
  const email=$("email").value.trim().toLowerCase();
  const password=$("password").value;
  const confirm=$("confirm").value;

  if(!name||!mobile||!email||!password||!confirm){
    showMessage("Please complete all required fields.");
    return;
  }

  if(!/^[6-9]\d{9}$/.test(mobile)){
    showMessage("Please enter a valid 10-digit Indian mobile number.");
    return;
  }

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    showMessage("Please enter a valid email address.");
    return;
  }

  if(password.length<6){
    showMessage("Password must contain at least 6 characters.");
    return;
  }

  if(password!==confirm){
    showMessage("Passwords do not match.");
    return;
  }

  button.disabled=true;
  button.textContent="Creating Account…";

  try{
    const credential=await createUserWithEmailAndPassword(auth,email,password);
    const user=credential.user;

    /*
      Firestore:
      users/{uid}

      Firebase Authentication remains the source of truth
      for login credentials. The Firestore document stores
      the user's profile/application data.
    */
    await setDoc(doc(db,"users",user.uid),{
      uid:user.uid,
      name:name,
      email:email,
      mobile:mobile,
      status:"Active",
      createdAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    });

    showMessage("Account created successfully. Redirecting to Sign In…","success");

    setTimeout(()=>{
      location.replace("signin.html?created=1");
    },900);

  }catch(error){
    showMessage(firebaseError(error));
    button.disabled=false;
    button.textContent="Create Account";
  }
});

function firebaseError(error){
  switch(error?.code){
    case "auth/email-already-in-use": return "An account with this email already exists. Please sign in.";
    case "auth/invalid-email": return "Please enter a valid email address.";
    case "auth/weak-password": return "Please use a stronger password.";
    case "auth/network-request-failed": return "Network error. Check your internet connection.";
    case "permission-denied": return "Account was created, but the profile could not be saved. Please check Firestore rules.";
    default: return error?.message||"Unable to create account. Please try again.";
  }
}
</script>
</body>
</html>
