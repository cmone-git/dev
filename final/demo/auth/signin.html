<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#f4f6f8">
<title>Sign In — BizOdit</title>
<style>
:root{--brand:#0b3b66;--brand2:#123f67;--bg:#f4f6f8;--card:#fff;--text:#202b36;--muted:#687583;--line:#d7dee5;--danger:#b84a4a;--success:#247a50}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:22px}
.auth-shell{width:min(430px,100%)}
.brand{text-align:center;margin-bottom:20px}
.logo{width:58px;height:58px;object-fit:contain;display:block;margin:0 auto 12px}
.brand-name{font-size:25px;font-weight:800;color:var(--brand);letter-spacing:-.03em}
.brand-sub{font-size:12px;color:var(--muted);margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:25px;box-shadow:0 8px 30px rgba(20,35,50,.06)}
h1{font-size:23px;margin:0 0 6px}
.lead{font-size:13px;color:var(--muted);margin:0 0 22px}
.field{margin-bottom:15px}
label{display:block;font-size:12px;font-weight:750;margin-bottom:7px}
.input-wrap{position:relative}
input{width:100%;height:48px;border:1px solid #cfd7df;border-radius:8px;padding:0 13px;font-size:14px;color:var(--text);background:#fff;outline:none}
input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,59,102,.08)}
.password-input{padding-right:48px}
.eye{position:absolute;right:5px;top:5px;width:38px;height:38px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;border-radius:6px}
.eye:hover{background:var(--bg);color:var(--brand)}
.eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 17px}
.check{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}
.check input{width:15px;height:15px}
.link{border:0;background:none;color:var(--brand);font-size:11px;font-weight:700;padding:0;cursor:pointer}
.primary{width:100%;height:48px;border:0;border-radius:8px;background:var(--brand);color:#fff;font-weight:750;font-size:14px}
.primary:disabled{opacity:.65;cursor:not-allowed}
.divider{display:flex;align-items:center;gap:10px;color:#8a949d;font-size:10px;margin:19px 0}
.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}
.secondary{width:100%;height:45px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--brand);font-weight:700;font-size:13px}
.support{display:flex;justify-content:center;margin-top:18px}
.support a{display:inline-flex;align-items:center;gap:7px;color:var(--brand);text-decoration:none;font-size:11px;font-weight:700}
.support a:hover{text-decoration:underline}
.support-icon{width:18px;height:18px;display:grid;place-items:center}
.support-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.message{display:none;padding:10px 12px;border-radius:7px;font-size:11px;margin-bottom:15px;line-height:1.45}
.message.show{display:block}.message.error{background:#fceeee;color:var(--danger)}.message.success{background:#edf8f2;color:var(--success)}
.footer{text-align:center;color:#8a949d;font-size:10px;margin-top:16px}
@media(max-width:420px){body{padding:14px}.card{padding:21px}}
</style>
</head>
<body>
<main class="auth-shell">
  <div class="brand">
    <img src="../assets/logo.png" class="logo" alt="BizOdit">
    <div class="brand-name">BizOdit</div>
    <div class="brand-sub">Business Management</div>
  </div>

  <section class="card">
    <h1>Welcome back</h1>
    <p class="lead">Sign in to continue to your BizOdit workspace.</p>

    <div id="message" class="message"></div>

    <form id="signinForm" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input id="password" class="password-input" type="password" autocomplete="current-password" placeholder="Enter your password" required>
          <button class="eye" type="button" id="togglePassword" aria-label="View password">
            <svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
          </button>
        </div>
      </div>

      <div class="row">
        <label class="check"><input type="checkbox" id="remember"> Remember me</label>
        <button class="link" type="button" id="forgotPassword">Forgot password?</button>
      </div>

      <button class="primary" id="signinButton" type="submit">Sign In</button>
    </form>

    <div class="divider">NEW TO BIZODIT?</div>

    <button class="secondary" type="button" id="signupButton">Create Account</button>

    <div class="support">
      <a id="supportLink" href="#" target="_blank" rel="noopener" aria-label="Contact Support">
        <span class="support-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M21 15a4 4 0 0 1-4 4H8l-5 3 1.5-4.5A8 8 0 1 1 21 15Z"/>
            <path d="M8 12h.01M12 12h.01M16 12h.01"/>
          </svg>
        </span>
        <span>Support</span>
      </a>
    </div>
  </section>

  <div class="footer">Secure account access • BizOdit</div>
</main>

<script type="module">
import { auth } from "../js/firebase-config.js";
import {
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  setPersistence,
  browserLocalPersistence,
  browserSessionPersistence
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const $=id=>document.getElementById(id);
const form=$("signinForm"), button=$("signinButton"), msg=$("message");

function showMessage(text,type="error"){
  msg.textContent=text;
  msg.className="message show "+type;
}
function clearMessage(){msg.className="message";msg.textContent=""}

$("togglePassword").addEventListener("click",()=>{
  const input=$("password");
  input.type=input.type==="password"?"text":"password";
});

$("signupButton").addEventListener("click",()=>{
  location.assign("signup.html");
});

const supportText="Hi, BizOdit User Login Issue, I need assistance with my BizOdit account login.";
$("supportLink").href="https://wa.me/919946151111?text="+encodeURIComponent(supportText);

$("forgotPassword").addEventListener("click",async()=>{
  clearMessage();
  const email=$("email").value.trim();
  if(!email){
    showMessage("Enter your registered email address first.");
    $("email").focus();
    return;
  }
  try{
    await sendPasswordResetEmail(auth,email);
    showMessage("Password reset instructions have been sent to your email.","success");
  }catch(error){
    showMessage(firebaseError(error));
  }
});

form.addEventListener("submit",async e=>{
  e.preventDefault();
  clearMessage();

  const email=$("email").value.trim();
  const password=$("password").value;

  if(!email||!password){
    showMessage("Please enter your email address and password.");
    return;
  }

  button.disabled=true;
  button.textContent="Signing In…";

  try{
    const persistence=$("remember").checked?browserLocalPersistence:browserSessionPersistence;
    await setPersistence(auth,persistence);
    await signInWithEmailAndPassword(auth,email,password);
    location.replace("../index.html");
  }catch(error){
    showMessage(firebaseError(error));
    button.disabled=false;
    button.textContent="Sign In";
  }
});

function firebaseError(error){
  switch(error?.code){
    case "auth/invalid-credential":
    case "auth/invalid-login-credentials":
    case "auth/wrong-password":
    case "auth/user-not-found": return "Invalid email or password.";
    case "auth/invalid-email": return "Please enter a valid email address.";
    case "auth/user-disabled": return "This account has been disabled. Please contact support.";
    case "auth/too-many-requests": return "Too many attempts. Please try again later.";
    case "auth/network-request-failed": return "Network error. Check your internet connection.";
    default: return error?.message||"Unable to sign in. Please try again.";
  }
}
</script>
</body>
</html>
